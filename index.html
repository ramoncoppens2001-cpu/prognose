  bedrag_tekst_omgezet: {t:'Bedrag als tekst, wel omgezet', u:'Het dashboard telt dit mee; Excel niet.'},
  mogelijk_dubbel:  {t:'Mogelijk dubbel ingevoerd', u:'Twee of meer regels zijn helemaal gelijk (client, object, status, bedrag, maand, factuur).'},
  dubbel_nr:        {t:'Zelfde factuurnummer op meer regels', u:'Kan kloppen (één factuur, meerdere objecten), maar kan ook dubbel zijn.'},
  client_mist:      {t:'Clientnaam ontbreekt of is #N/A', u:'Telt mee onder “(onbekende client)”.'},
  client_typo:      {t:'“Cleint” in plaats van “Client”', u:'Het dashboard corrigeert dit zelf.'},
  inv_geen_nr:      {t:'Invoiced zonder factuurnummer', u:''},
  sec_bij_inv:      {t:'Secured Fee ingevuld bij Invoiced', u:'Wordt genegeerd: bij Invoiced telt Invoiced amount.'},
  team_mist:        {t:'Team leeg', u:'Telt mee onder “(geen team)”.'},
  dynamics_leeg:    {t:'“Client in Dynamics?” leeg', u:'Leeg kan “nee” of “niet ingevuld” betekenen.'},
};
const IMPACT_MIST  = ['status_onbekend','status_leeg','inv_ander_jaar','maand_ander_jaar'];
const IMPACT_MAAND = ['inv_geen_datum','datum_onbekend','maand_mist','maand_onbekend'];

/* Per regel: wat doet het probleem met de cijfers, en wat moet je doen? */
function adviesVoor(o, jaar){
  const st = o.statusTekst || '(leeg)';
  const r = [];
  if (o.issues.includes('status_onbekend')) r.push({c:'status_onbekend', mist:o.bedrag, a:`Status “${st}” ken ik niet. Gebruik Invoiced, Running of Accrual. Of laat het weten als “${st}” iets eigens betekent.`});
  if (o.issues.includes('status_leeg'))     r.push({c:'status_leeg', mist:o.bedrag, a:'Vul de instruction status in.'});
  if (o.issues.includes('inv_ander_jaar'))  r.push({c:'inv_ander_jaar', mist:o.bedrag, a:`Factuurdatum ${datumNL(o.factuurdatum)} valt buiten ${jaar}. Klopt het jaar?`});
  if (o.issues.includes('maand_ander_jaar'))r.push({c:'maand_ander_jaar', mist:o.bedrag, a:`Projected month “${o.maandTekst}” valt buiten ${jaar}.`});
  if (o.issues.includes('inv_bij_ander') && o.invoiced) r.push({c:'inv_bij_ander', mist:o.invoiced, a:`Er staat ${eur(o.invoiced)} bij Invoiced amount, maar de status is ${st}. Zet de status op Invoiced, of zet het bedrag bij Secured Fee.`});
  if (o.issues.includes('inv_geen_datum'))  r.push({c:'inv_geen_datum', maand:o.bedrag, a:'Vul de invoice date in.'});
  if (o.issues.includes('datum_onbekend'))  r.push({c:'datum_onbekend', maand:o.bedrag, a:'De invoice date is geen datum.'});
  if (o.issues.includes('maand_mist'))      r.push({c:'maand_mist', maand:o.bedrag, a:'Vul de projected month in.'});
  if (o.issues.includes('maand_onbekend'))  r.push({c:'maand_onbekend', maand:o.bedrag, a:`“${o.maandTekst}” is geen maand. Gebruik Jan … Dec.`});
  return r.filter(x => (x.mist || x.maand));
}

function controles(m){
  const aandacht = [], groepen = {};
  for (const o of m.regels){
    const adv = adviesVoor(o, m.jaar);
    const impactCodes = new Set(adv.map(x => x.c));
    if (adv.length) aandacht.push({o, adv, mist: adv.reduce((s,x)=>s+(x.mist||0),0), maand: adv.reduce((s,x)=>s+(x.maand||0),0)});
    for (const c of o.issues){
      if (impactCodes.has(c)) continue;
      (groepen[c] = groepen[c] || []).push(o);
    }
  }
  aandacht.sort((a,b) => Math.abs(b.mist+b.maand) - Math.abs(a.mist+a.maand));
  const volgorde = Object.keys(CHECKS);
  const overig = Object.entries(groepen).map(([code, regels]) => ({code, ...(CHECKS[code]||{t:code,u:''}), regels,
      bedrag: code==='status_uit' || code==='client_mist' || code==='dubbel_nr' || code==='mogelijk_dubbel' ? regels.reduce((s,o)=>s+Math.abs(o.bedrag||0),0) : 0}))
    .sort((a,b) => volgorde.indexOf(a.code) - volgorde.indexOf(b.code));
  return {aandacht, overig, aantal: aandacht.length,
          mist: aandacht.reduce((s,x)=>s+Math.abs(x.mist),0), maand: aandacht.reduce((s,x)=>s+Math.abs(x.maand),0)};
}

function optellen(regels){
  const a = {inv:Array(12).fill(0), sec:Array(12).fill(0), acc:Array(12).fill(0),
             zonder:{inv:0, sec:0, acc:0}, tot:{inv:0, sec:0, acc:0}, n:0};
  for (const o of regels){
    if (!o.telt || !['inv','sec','acc'].includes(o.cat)) continue;
    a.n++;
    const v = o.bedrag || 0;
    if (o.mnd) a[o.cat][o.mnd-1] += v; else a.zonder[o.cat] += v;
    a.tot[o.cat] += v;
  }
  a.open = a.tot.sec + a.tot.acc;
  a.totaal = a.tot.inv + a.open;
  a.maandTot = a.inv.map((v,i) => v + a.sec[i] + a.acc[i]);
  return a;
}
function groepeer(regels, veld){
  const m = new Map();
  for (const o of regels){
    if (!o.telt || !['inv','sec','acc'].includes(o.cat)) continue;
    const k = o[veld];
    if (!m.has(k)) m.set(k, {naam:k, inv:0, sec:0, acc:0, n:0, klanten:new Set(), teams:new Set()});
    const g = m.get(k); g[o.cat] += o.bedrag || 0; g.n++; g.klanten.add(o.client); g.teams.add(o.team);
  }
  const uit = [...m.values()].map(g => ({...g, open: g.sec + g.acc, tot: g.inv + g.sec + g.acc}));
  uit.sort((a,b) => b.tot - a.tot);
  return uit;
}

/* Tijd: hoeveel maanden zijn afgesloten, en welke maand loopt nu */
const afgesloten = () => S.lopend ? S.peil - 1 : S.peil;
const lopendeMaand = () => S.lopend ? S.peil : 0;
const meervoud = (n, een, veel) => `${n} ${n===1 ? een : veel}`;

/* ---------------------------------------------------------------------
   Inzichten — op volgorde van belang. De eerste vijf staan open.
   --------------------------------------------------------------------- */
function maakInzichten(m, regels, agg, ctrl){
  const uit = []; const Y = m.jaar, af = afgesloten(), nu = lopendeMaand();
  const fc = S.team === 'Alle' ? m.forecast : null;
  const vj = S.team === 'Alle' ? m.hist[Y-1] : null;
  const invAf = som(agg.inv, 0, af);

  if (S.team !== 'Alle'){
    const t = groepeer(m.regels, 'team').filter(x => x.tot > 0);
    const tot = t.reduce((s,x) => s + x.tot, 0), pos = t.findIndex(x => x.naam === S.team);
    if (pos >= 0) uit.push({toon:'neutraal', ikoon:'team',
      html:`<b>${esc(S.team)}</b> is goed voor ${pct(t[pos].tot/tot)} van de omzet van alle teams (nummer ${pos+1} van ${t.length}). ${agg.totaal ? `${pct(agg.tot.inv/agg.totaal)} daarvan is al gefactureerd.` : ''}`});
  }
  if (fc && af > 0){
    const fcAf = som(fc, 0, af);
    if (fcAf > 0){
      const r = invAf / fcAf;
      uit.push({toon: r>=1 ? 'goed' : r>=.9 ? 'let' : 'slecht', ikoon:'doel',
        html:`Over ${af===1 ? 'januari' : `januari t/m ${MNDL[af-1]}`} is <b>${eurK(invAf)}</b> gefactureerd tegen ${eurK(fcAf)} forecast: <b>${pct(r)}</b>, ${r>=1 ? 'een voorsprong' : 'een achterstand'} van ${eurK(Math.abs(invAf-fcAf))}.`});
    }
  }
  if (nu){
    const i = nu-1, gef = agg.inv[i], sec = agg.sec[i] + agg.acc[i];
    if (fc && fc[i]){
      const rest = fc[i] - gef - sec;
      uit.push({toon: rest <= 0 ? 'goed' : 'let', ikoon:'kalender',
        html:`In <b>${MNDL[i]}</b> is tot nu toe ${eurK(gef)} gefactureerd en staat nog ${eurK(sec)} secured, tegen ${eurK(fc[i])} forecast. ${rest > 0 ? `Om de maand te halen moet er nog <b>${eurK(rest)}</b> bij.` : 'Daarmee is de maand gedekt.'} <a data-ga="pijplijn" data-o="maand">Wat staat er open?</a>`});
    } else if (gef || sec){
      uit.push({toon:'neutraal', ikoon:'kalender', html:`In <b>${MNDL[i]}</b> is tot nu toe ${eurK(gef)} gefactureerd en staat nog ${eurK(sec)} secured. <a data-ga="pijplijn" data-o="maand">Wat staat er open?</a>`});
    }
  }
  const achter = regels.filter(o => o.telt && o.cat==='sec' && o.mnd && o.mnd <= af);
  if (achter.length){
    const s = achter.reduce((t,o) => t + o.bedrag, 0);
    uit.push({toon:'slecht', ikoon:'klok',
      html:`<b>${meervoud(achter.length,'regel','regels')} Running</b> (${eurK(s)}) ${achter.length===1?'heeft':'hebben'} een projected month die al voorbij is. Nog factureren, of de maand verschuiven? <a data-ga="pijplijn" data-o="over">Bekijk de lijst</a>`});
  }
  if (fc){
    const fy = som(fc), nodig = fy - agg.tot.inv;
    if (nodig > 0){
      const dek = agg.open / nodig;
      uit.push({toon: dek>=1 ? 'goed' : dek>=.6 ? 'let' : 'slecht', ikoon:'pijplijn',
        html:`Voor de jaarforecast van ${eurK(fy)} moet nog ${eurK(nodig)} gefactureerd worden. Daarvan staat ${eurK(agg.open)} al klaar (${pct(dek)}). ${dek<1 ? `Er moet nog <b>${eurK(nodig-agg.open)}</b> aan nieuw werk bij.` : 'Dat dekt de rest van het jaar.'}`});
    }
    let bi = -1, gat = 0;
    for (let i=Math.max(af, 0); i<12; i++){ const g = fc[i] - agg.maandTot[i]; if (g > gat){ gat = g; bi = i; } }
    if (bi >= 0){
      const vjm = vj && vj.invoiced ? vj.invoiced[bi] : null;
      uit.push({toon:'let', ikoon:'kalender',
        html:`Het grootste gat zit in <b>${MNDL[bi]}</b>: ${eurK(fc[bi])} forecast (${pct(fc[bi]/fy)} van het jaar) tegen ${eurK(agg.maandTot[bi])} secured.${vjm ? ` In ${Y-1} werd in ${MNDL[bi]} ${eurK(vjm)} gefactureerd.` : ''}`});
    }
  }
  if (vj && vj.invoiced && af > 0){
    const vjAf = som(vj.invoiced, 0, af);
    if (vjAf > 0){
      const gr = invAf / vjAf - 1;
      uit.push({toon: gr>=0 ? 'goed' : 'let', ikoon:'trend',
        html:`Ten opzichte van dezelfde maanden in ${Y-1} (${eurK(vjAf)}) is dat <b>${gr>=0?'+':'−'}${pct(Math.abs(gr),1)}</b>.`});
    }
  }
  if (fc && af >= 2){
    const r = []; for (let i=0;i<af;i++) if (fc[i] > 0) r.push({i, r: agg.inv[i]/fc[i]});
    if (r.length >= 2){
      r.sort((a,b) => b.r - a.r); const b = r[0], w = r[r.length-1];
      uit.push({toon:'neutraal', ikoon:'staaf',
        html:`Sterkste maand: <b>${MNDL[b.i]}</b> (${eurK(agg.inv[b.i])}, ${pct(b.r)} van forecast). Zwakste: <b>${MNDL[w.i]}</b> (${eurK(agg.inv[w.i])}, ${pct(w.r)}).`});
    }
  }
  if (S.team === 'Alle'){
    const t = groepeer(regels, 'team').filter(x => x.tot > 0);
    if (t.length >= 2){
      const tot = t.reduce((s,x) => s + x.tot, 0);
      const ts = [...t].sort((a,b) => b.open - a.open)[0];
      uit.push({toon:'neutraal', ikoon:'team',
        html:`<b>${esc(t[0].naam)}</b> is het grootste team met ${eurK(t[0].tot)} (${pct(t[0].tot/tot)}). ${ts.naam===t[0].naam ? 'Dat team heeft ook' : `<b>${esc(ts.naam)}</b> heeft`} het meeste werk klaarstaan: ${eurK(ts.open)}.`});
    }
  } else {
    const p = groepeer(regels, 'purpose');
    if (p.length >= 2 && agg.totaal > 0) uit.push({toon:'neutraal', ikoon:'staaf', html:`Grootste purpose binnen ${esc(S.team)}: <b>${esc(p[0].naam)}</b> (${pct(p[0].tot/agg.totaal)}), daarna ${esc(p[1].naam)} (${pct(p[1].tot/agg.totaal)}).`});
  }
  const k = groepeer(regels, 'client').filter(x => x.naam !== '(onbekende client)');
  if (k.length >= 8){
    const tot = k.reduce((s,x) => s + x.tot, 0);
    const top5 = k.slice(0,5).reduce((s,x) => s + x.tot, 0);
    uit.push({toon:'neutraal', ikoon:'klant',
      html:`De <b>top 5 klanten</b> zijn samen goed voor ${pct(top5/tot)} van de omzet. De grootste is ${esc(k[0].naam)} met ${eurK(k[0].tot)}.`});
  }
  const nAcc = regels.filter(o => o.telt && o.cat==='acc' && o.bedrag).length;
  if (nAcc && Math.abs(agg.tot.acc) >= 1){
    uit.push({toon:'neutraal', ikoon:'plusmin',
      html:`Accruals staan netto op <b>${eurK(agg.tot.acc)}</b> (${meervoud(nAcc,'regel','regels')}) en ${agg.tot.acc<0 ? 'verlagen' : 'verhogen'} de verwachte jaaromzet.`});
  }
  if (vj && vj.invoiced && af > 0 && af < 12){
    const vjFY = som(vj.invoiced), vjAf = som(vj.invoiced, 0, af);
    if (vjFY > 0 && vjAf > 0 && invAf > 0){
      uit.push({toon:'neutraal', ikoon:'trend',
        html:`Volgt de rest van het jaar het patroon van ${Y-1}, dan landt ${Y} rond <b>${eurK(invAf / (vjAf / vjFY))}</b>. Een grove indicatie: in ${Y-1} kwam ${pct(1 - vjAf/vjFY)} van de omzet na ${MNDL[af-1]}.`});
    }
  }
  if (ctrl && ctrl.aantal){
    uit.push({toon:'let', ikoon:'let',
      html:`${meervoud(ctrl.aantal,'regel heeft','regels hebben')} invloed op de cijfers: ${ctrl.mist ? `${eurK(ctrl.mist)} telt niet mee` : ''}${ctrl.mist && ctrl.maand ? ', ' : ''}${ctrl.maand ? `${eurK(ctrl.maand)} valt in geen maand` : ''}. <a data-ga="controle">Naar de controle</a>`});
  }
  return uit;
}

/* ---------------------------------------------------------------------
   Versies: een compacte momentopname per geladen bestand, zodat je ziet
   wat er sinds de vorige keer is veranderd.
   --------------------------------------------------------------------- */
function hashTekst(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(36); }
function momentopname(m){
  const tel = {};
  const rijen = m.regels.map(o => {
    const b = [o.id, o.client, o.object, o.purpose].join('|').toLowerCase();
    tel[b] = (tel[b]||0) + 1;
    return {k: b+'#'+tel[b], c:o.client, t:o.team, ob:o.object, s:o.statusTekst, cat:o.cat, b:Math.round((o.bedrag||0)*100)/100, m:o.mnd||0, x:o.telt?1:0, r:o.rij};
  });
  const a = optellen(m.regels);
  return {bestand:m.bestand, tijd:m.bestandTijd || m.tijd, geladen:Date.now(), jaar:m.jaar,
          h: hashTekst(JSON.stringify(rijen)), tot:{inv:a.tot.inv, open:a.open, totaal:a.totaal}, rijen};
}
function vergelijk(oud, nieuw){
  const kaart = new Map(oud.rijen.map(r => [r.k, r]));
  const v = {gefactureerd:[], nieuw:[], bedrag:[], maand:[], status:[], weg:[]};
  const gezien = new Set();
  for (const r of nieuw.rijen){
    const o = kaart.get(r.k);
    if (!o){ v.nieuw.push({n:r}); continue; }
    gezien.add(r.k);
    if (o.cat !== 'inv' && r.cat === 'inv') v.gefactureerd.push({o, n:r});
    else if (o.cat !== r.cat || o.s !== r.s) v.status.push({o, n:r});
    else if (Math.abs(o.b - r.b) >= 1) v.bedrag.push({o, n:r});
    else if (o.m !== r.m) v.maand.push({o, n:r});
  }
  for (const r of oud.rijen) if (!gezien.has(r.k)) v.weg.push({o:r});
  v.delta = {inv: nieuw.tot.inv - oud.tot.inv, open: nieuw.tot.open - oud.tot.open, totaal: nieuw.tot.totaal - oud.tot.totaal};
  v.aantal = v.gefactureerd.length + v.nieuw.length + v.bedrag.length + v.maand.length + v.status.length + v.weg.length;
  return v;
}
/* Voor de voorbeelddata: een verzonnen vorige versie, zodat je ziet hoe het werkt */
function voorbeeldVorige(m){
  const snap = momentopname(m);
  const rijen = snap.rijen.filter(r => r.r < 505).map(r => ({...r}));
  let n = 0;
  rijen.forEach(r => {
    if (r.cat === 'inv' && r.m === 7 && n < 12){ r.cat = 'sec'; r.s = 'Running'; n++; }
    else if (r.cat === 'sec' && r.m === 9 && n < 18){ r.m = 8; n++; }
    else if (r.cat === 'sec' && r.m === 12 && n < 22){ r.b = Math.round(r.b * 1.2); n++; }
  });
  rijen.push({k:'voorbeeld|client 999|vervallen opdracht|accounts#1', c:'Client 999', t:'Banking', ob:'Vervallen opdracht', s:'Running', cat:'sec', b:15000, m:11, x:1, r:999});
  const tot = {inv:0, open:0};
  rijen.forEach(r => { if (!r.x) return; if (r.cat==='inv') tot.inv += r.b; else if (r.cat==='sec'||r.cat==='acc') tot.open += r.b; });
  tot.totaal = tot.inv + tot.open;
  return {bestand:'Prognose_2026_voorbeeld (vorige week, fictief)', tijd: Date.now() - 7*864e5, jaar:m.jaar, h:'vb', tot, rijen};
}

/* ---------------------------------------------------------------------
   Kerncijfers: één plek voor de tegels, de aandachtspunten en het rapport
   --------------------------------------------------------------------- */
function kerncijfers(m, regels, agg){
  const Y = m.jaar, af = afgesloten(), nu = lopendeMaand();
  const fc = S.team === 'Alle' ? m.forecast : null;
  const fy = fc ? som(fc) : null, fcAf = fc ? som(fc, 0, af) : 0;
  const invAf = som(agg.inv, 0, af);
  const vj = S.team === 'Alle' ? m.hist[Y-1] : null;
  const vjAf = vj && vj.invoiced ? som(vj.invoiced, 0, af) : null;
  const ni = nu ? nu-1 : -1;
  const deze = nu ? {gef: agg.inv[ni], sec: agg.sec[ni] + agg.acc[ni], fc: fc ? fc[ni] : null,
                     n: regels.filter(o => o.telt && (o.cat==='sec'||o.cat==='acc') && o.mnd===nu).length} : null;
  const achter = regels.filter(o => o.telt && o.cat==='sec' && o.mnd && o.mnd <= af);
  const periode = af === 0 ? '' : af === 1 ? 'januari' : af === 12 ? 'heel het jaar' : `januari t/m ${MNDL[af-1]}`;
  return {Y, af, nu, fc, fy, fcAf, invAf, vj, vjAf, groei: vjAf ? invAf/vjAf - 1 : null, deze, periode,
          achterN: achter.length, achterB: achter.reduce((s,o) => s + o.bedrag, 0),
          gat: fc ? fy - agg.totaal : null, klanten: new Set(regels.filter(o => o.telt).map(o => o.client)).size};
}
/* Koers op basis van de afgesloten maanden */
function koersVan(k){
  if (!k.fc || !k.fcAf) return null;
  const r = k.invAf / k.fcAf;
  return r>=1.02 ? {c:'goed', t:'Voor op forecast', r} : r>=.97 ? {c:'goed', t:'Op koers', r} : r>=.88 ? {c:'let', t:'Iets achter op forecast', r} : {c:'slecht', t:'Achter op forecast', r};
}

/* ---------------------------------------------------------------------
   Controle voor het Data-scherm: de aandachtspunten (met invloed op de
   cijfers) gebundeld per soort, en een volledige lijst van wat er is
   nagekeken, ook wat in orde is.
   --------------------------------------------------------------------- */
function controleGroepen(ctrl){
  const g = {};
  ctrl.aandacht.forEach(a => a.adv.forEach(x => {
    const k = g[x.c] = g[x.c] || {code:x.c, t:(CHECKS[x.c]||{t:x.c}).t, regels:[], mist:0, maand:0, statussen:new Set()};
    k.regels.push(a.o); k.mist += Math.abs(x.mist||0); k.maand += Math.abs(x.maand||0); if (a.o.statusTekst) k.statussen.add(a.o.statusTekst);
  }));
  return Object.values(g).sort((a,b) => (b.mist+b.maand) - (a.mist+a.maand));
}
const CONTROLELIJST = [
  {t:'Alle regels hebben een herkende status',       codes:['status_onbekend','status_leeg']},
  {t:'Invoiced-regels hebben een factuurdatum',      codes:['inv_geen_datum','datum_onbekend']},
  {t:'Running en accruals hebben een projected month', codes:['maand_mist','maand_onbekend']},
  {t:'Datums vallen in het boekjaar',                codes:['inv_ander_jaar','maand_ander_jaar']},
  {t:'Bedragen staan in de goede kolom',             codes:['inv_bij_ander','sec_bij_inv']},
  {t:'Bedragen zijn getallen',                       codes:['bedrag_tekst','bedrag_tekst_omgezet']},
  {t:'Running-regels hebben een Secured Fee',        codes:['sec_geen_bedrag','acc_geen_bedrag']},
  {t:'Invoiced-regels hebben een bedrag',            codes:['inv_geen_bedrag']},
  {t:'Geen dubbel ingevoerde regels',                codes:['mogelijk_dubbel']},
  {t:'Factuurnummers komen één keer voor',           codes:['dubbel_nr']},
  {t:'Invoiced-regels hebben een factuurnummer',     codes:['inv_geen_nr']},
  {t:'Elke regel heeft een client',                  codes:['client_mist','client_typo']},
  {t:'Elke regel heeft een team',                    codes:['team_mist']},
  {t:'Client in Dynamics is ingevuld',               codes:['dynamics_leeg']},
  {t:'Bewust niet meegeteld (Cancelled e.d.)',       codes:['status_uit'], altijdInfo:true},
];
/* Per regel: welke soorten punten hebben echt invloed op de cijfers (bedrag niet 0) */
const impactCodes = ctrl => new Map(ctrl.aandacht.map(a => [a.o, new Set(a.adv.map(x => x.c))]));
function controleLijst(m, ctrl){
  const impact = impactCodes(ctrl);
  return CONTROLELIJST.map(c => {
    const regels = m.regels.filter(o => o.issues.some(x => c.codes.includes(x)));
    const metImpact = regels.filter(o => { const s = impact.get(o); return s && c.codes.some(x => s.has(x)); });
    const st = !regels.length ? 'ok' : (metImpact.length && !c.altijdInfo) ? 'let' : 'info';
    return {...c, regels, st, n: regels.length};
  });
}
function aansluiting(m){
  const Y = m.jaar, oud = m.hist[Y] && m.hist[Y].invoiced && m.hist[Y].invoiced.some(v => v) ? m.hist[Y].invoiced : null;
  if (!oud) return null;
  const alles = optellen(m.regels);
  const versch = oud.map((v,i) => alles.inv[i] - (v||0));
  return {oud, nieuw: alles.inv, versch, afwijk: versch.filter(v => Math.abs(v) >= 1).length, tab: m.hist[Y].tab, rij: m.hist[Y].invoicedRij,
          totaal: som(alles.inv) - som(oud)};
}

/* =====================================================================
   5. GRAFIEKEN (eigen SVG, geen bibliotheek)
   Zelfde grafiektaal als de Portefeuille Tool: teal is de data, licht teal
   is "nog niet", oranje de correctie, navy de referentie (forecast als
   streep, vorig jaar als open rondje). Elke grafiek kan als tekst (SVG)
   worden gemaakt, zodat het rapport dezelfde tekening gebruikt.
   ===================================================================== */
const KLEUR = {inv:'#008A9C', sec:'#BDD9DE', acc:'#EF6B00', fc:'#25273A', vj:'#25273A', vvj:'#BEBEC4', verwacht:'#6FB3BF',
               rooster:'#E8E8EB', as:'#92939C', inkt:'#25273A', toek:'#F7F5F2', schaduw:'#EEF0F2'};
const CATNAAM = {inv:'Gefactureerd', sec:'Secured', acc:'Accrual'};

function ticks(min, max, n=5){
  if (max === min) max = min + 1;
  const ruw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(ruw))), f = ruw / mag;
  const stap = (f<=1 ? 1 : f<=2 ? 2 : f<=2.5 ? 2.5 : f<=5 ? 5 : 10) * mag;
  const lo = Math.floor(min/stap)*stap, hi = Math.ceil(max/stap)*stap, t = [];
  for (let v=lo; v<=hi+stap/2; v+=stap) t.push(Math.round(v/stap)*stap);
  return {lo, hi, t, stap};
}
function balkPad(x, y0, y1, w, r){
  const h = Math.abs(y0 - y1); if (h < .5) return '';
  r = Math.min(r, h, w/2);
  if (r <= 0) return `M${x},${y0}H${x+w}V${y1}H${x}Z`;
  const d = y1 < y0 ? 1 : -1;
  return `M${x},${y0}V${y1+d*r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1+d*r}V${y0}Z`;
}
const f1 = v => Math.round(v*10)/10;
/* Breedte van de inhoud van een element, zonder de padding */
function binnenBreedte(el){ const cs = getComputedStyle(el); return el.clientWidth - (parseFloat(cs.paddingLeft)||0) - (parseFloat(cs.paddingRight)||0); }

/* ---------- hover-label (zelfde vorm als de andere tools) ---------- */
const tip = {
  el: null,
  toon(html, e){ this.el = this.el || $('#tip'); this.el.innerHTML = html; this.el.classList.remove('verborgen'); this.zet(e); },
  zet(e){
    if (!this.el || this.el.classList.contains('verborgen')) return;
    const w = this.el.offsetWidth, h = this.el.offsetHeight, pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > innerHeight - 8) y = e.clientY - h - pad;
    this.el.style.left = Math.max(8,x) + 'px'; this.el.style.top = Math.max(8,y) + 'px';
  },
  weg(){ this.el && this.el.classList.add('verborgen'); }
};
const tipKop = t => `<b>${esc(t)}</b>`;
function tipRij(kleur, naam, waarde, vorm){
  const i = kleur ? `<i style="background:${kleur};${vorm==='lijn'?'height:2.5px;border-radius:2px;vertical-align:3px':''}${vorm==='ring'?'border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px '+kleur:''}"></i>` : '';
  return `<div class="tr"><span class="tz">${i}${esc(naam)}</span><span>${esc(waarde)}</span></div>`;
}
const tipSep = '<div class="tsep"></div>';

/* ---------- per maand: gestapelde kolommen tegen een forecast-streep ---------- */
function maandSvg(o, W, H){
  const m = {l:52, r:8, t:26, b: o.fc && (W - 60)/12 >= 36 ? 44 : 28};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  let max = 0, min = 0;
  for (let i=0;i<12;i++){
    const pos = Math.max(0,o.inv[i]) + Math.max(0,o.sec[i]) + Math.max(0,o.acc[i]);
    const neg = Math.min(0,o.inv[i]) + Math.min(0,o.sec[i]) + Math.min(0,o.acc[i]);
    max = Math.max(max, pos, o.fc ? o.fc[i] : 0, o.vj && o.toonVj ? (o.vj[i]||0) : 0);
    min = Math.min(min, neg);
  }
  const tk = ticks(0, max*1.04 || 1, 5);
  if (min < 0){ tk.lo = Math.min(min*1.25, -tk.stap*.12); while (tk.t[0] - tk.stap >= tk.lo - 1e-9) tk.t.unshift(tk.t[0]-tk.stap); }
  const y = v => f1(m.t + (tk.hi - v) / (tk.hi - tk.lo) * ih);
  const band = iw / 12, bw = Math.min(40, band*.44), gw = Math.min(64, band*.74);
  const x0 = i => m.l + band*i + band/2, xs = i => f1(m.l + band*i);
  const af = o.af, nu = o.nu, progStart = nu ? nu : af;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Per maand">`;
  s += `<defs><pattern id="arceer${o.id||''}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="${KLEUR.sec}"/><rect width="1.8" height="5" fill="${KLEUR.inv}"/></pattern></defs>`;
  const lab = (x, t, kl='#92939C', anker='start') => `<text x="${x}" y="${m.t-9}" font-size="10.5" fill="${kl}" font-weight="600" letter-spacing=".06em" text-anchor="${anker}">${t}</text>`;
  if (progStart < 12){
    s += `<rect x="${xs(progStart)}" y="${m.t-22}" width="${f1(m.l+iw-xs(progStart))}" height="${ih+22}" fill="${KLEUR.toek}" rx="6"/>`;
    if (m.l + iw - xs(progStart) > 76) s += lab(xs(progStart)+8, 'PROGNOSE');
  }
  if (nu){
    s += `<rect x="${xs(nu-1)+3}" y="${m.t-22}" width="${f1(band-6)}" height="3" fill="#FFDF00" rx="1.5"/>`;
    s += lab(f1(x0(nu-1)), 'NU', '#25273A', 'middle');
  }
  if (af > 0 && band*af > 150) s += lab(m.l+2, af===12 ? 'REALISATIE' : `REALISATIE T/M ${MND[af-1].toUpperCase()}`);
  else if (af > 0 && band*af > 90) s += lab(m.l+2, 'REALISATIE');
  const smal = band < 30, pctOk = band >= 36;
  tk.t.forEach(v => { s += `<line x1="${m.l}" x2="${m.l+iw}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?KLEUR.inkt:KLEUR.rooster}" stroke-width="1"/><text x="${m.l-8}" y="${y(v)+3.5}" text-anchor="end" font-size="11" fill="${KLEUR.as}">${asLabel(v)}</text>`; });
  for (let i=0;i<12;i++){
    const cx = x0(i);
    if (o.fc && o.fc[i]) s += `<path d="${balkPad(f1(cx-gw/2), y(0), y(o.fc[i]), f1(gw), 3)}" fill="${KLEUR.schaduw}"/>`;
    let op = 0, neer = 0; const segs = [];
    ['inv','sec','acc'].forEach(c => { const v = o[c][i]; if (!v) return;
      if (v > 0){ segs.push({c, a:op, b:op+v}); op += v; } else { segs.push({c, a:neer, b:neer+v}); neer += v; } });
    const laatstOp = segs.filter(g => g.b > 0).pop(), laatstNeer = segs.filter(g => g.b < 0).pop();
    segs.forEach(g => {
      let ya = y(g.a); const yb = y(g.b);
      if (g.a !== 0) ya = f1(ya + (g.b > 0 ? -1.5 : 1.5));
      if (Math.abs(ya - yb) < .5) return;
      const r = (g === laatstOp || g === laatstNeer) ? 3 : 0;
      const achter = g.c === 'sec' && i < af;
      s += `<path d="${balkPad(f1(cx-bw/2), ya, yb, f1(bw), r)}" fill="${achter ? `url(#arceer${o.id||''})` : KLEUR[g.c]}"/>`;
    });
    if (o.fc && o.fc[i]) s += `<line x1="${f1(cx-gw/2)}" x2="${f1(cx+gw/2)}" y1="${y(o.fc[i])}" y2="${y(o.fc[i])}" stroke="${KLEUR.fc}" stroke-width="2.5" stroke-linecap="round"/>`;
    if (o.vj && o.toonVj && o.vj[i]){
      const vx = f1(cx + bw/2 + Math.min(8, (gw-bw)/2));
      s += `<circle cx="${vx}" cy="${y(o.vj[i])}" r="4" fill="#fff" stroke="${KLEUR.vj}" stroke-width="1.8"/>`;

    if (o.fc && o.fc[i] && pctOk){

  if (o.hover) for (let i=0;i<12;i++) s += `<rect class="hv" data-i="${i}" x="${xs(i)}" y="${m.t-22}" width="${f1(band)}" height="${ih+22+m.b}" fill="#25273A" fill-opacity="0"/>`;

}
function maandGrafiek(el, o){

  $$('.hv', el).forEach(r => {
    const i = +r.dataset.i;

    r.addEventListener('mousemove', e => tip.zet(e));

function maandTip(o, i){
  const tot = o.inv[i] + o.sec[i] + o.acc[i];
  let h = tipKop(`${Hoofd(MNDL[i])} ${o.jaar}${i===o.nu-1 ? ' · lopende maand' : i<o.af ? '' : ' · prognose'}`);
  if (o.fc) h += tipRij('#FFFFFF', 'Forecast', eur(o.fc[i]), 'lijn');
  h += tipRij(KLEUR.inv, 'Gefactureerd', eur(o.inv[i]));
  h += tipRij(KLEUR.sec, i < o.af && o.sec[i] ? 'Secured, maand voorbij' : 'Secured', eur(o.sec[i]));
  if (o.acc[i]) h += tipRij(KLEUR.acc, 'Accrual', eur(o.acc[i]));
  h += tipSep + tipRij(null, 'Totaal (I+F)', eur(tot));
  if (o.fc && o.fc[i]) h += tipRij(null, 'Van forecast', pct(tot/o.fc[i]) + ' · ' + plus(tot - o.fc[i], eur));
  if (o.vj && o.vj[i] != null) h += tipRij(KLEUR.vj, `Gefactureerd ${o.jaar-1}`, eur(o.vj[i]), 'ring');
  return h;
}

/* ---------- opgeteld door het jaar ---------- */
function lijnSvg(o, W, H){
  const m = {l:52, r:118, t:12, b:28};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  let max = 0; o.series.forEach(se => se.w.forEach(v => { if (v!=null) max = Math.max(max, v); }));
  const tk = ticks(0, max*1.04 || 1, 5);
  const y = v => f1(m.t + (tk.hi - v) / (tk.hi - tk.lo) * ih);
  const x = i => f1(m.l + iw * (i + .5) / 12);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cumulatief per maand">`;
  if (o.nu) s += `<rect x="${f1(m.l + iw*(o.nu-1)/12 + 3)}" y="${m.t-10}" width="${f1(iw/12-6)}" height="3" fill="#FFDF00" rx="1.5"/>`;
  tk.t.forEach(v => { s += `<line x1="${m.l}" x2="${m.l+iw}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?KLEUR.inkt:KLEUR.rooster}"/><text x="${m.l-8}" y="${y(v)+3.5}" text-anchor="end" font-size="11" fill="${KLEUR.as}">${asLabel(v)}</text>`; });
  const smal = iw/12 < 30;
  for (let i=0;i<12;i++) s += `<text x="${x(i)}" y="${m.t+ih+18}" text-anchor="middle" font-size="11.5" fill="${(i<o.af || i===o.nu-1)?'#25273A':'#92939C'}" font-weight="${i===o.nu-1?700:400}">${smal ? MND[i][0] : MND[i]}</text>`;
  const eind = [];
  [...o.series].reverse().forEach(se => {
    const pts = se.w.map((v,i) => v==null ? null : [x(i), y(v)]).filter(Boolean);
    if (!pts.length) return;
    s += `<path d="M${pts.map(p => p.join(',')).join('L')}" fill="none" stroke="${se.kleur}" stroke-width="${se.dik||2}" ${se.streep?'stroke-dasharray="6 5"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    const lp = pts[pts.length-1];
    s += `<circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="${se.kleur}" stroke="#fff" stroke-width="1.5"/>`;
    eind.push({y: lp[1], se, v: se.w.filter(v=>v!=null).pop()});
  });
  eind.sort((a,b) => a.y - b.y);
  for (let k=1;k<eind.length;k++) if (eind[k].y - eind[k-1].y < 30) eind[k].y = eind[k-1].y + 30;
  const over = eind.length ? eind[eind.length-1].y - (m.t+ih) : 0;
  if (over > 0) eind.forEach(e => e.y -= over);
  eind.forEach(e => {
    const lx = m.l + iw + 12;
    s += `<text x="${lx}" y="${f1(e.y)}" font-size="11" fill="#666874">${esc(e.se.kort||e.se.naam)}</text>`;
    s += `<text x="${lx}" y="${f1(e.y+13)}" font-size="12" font-weight="600" fill="#25273A">${eurK(e.v)}</text>`;
  });
  if (o.hover) s += `<line class="lgGids" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="#25273A" stroke-opacity=".25" visibility="hidden"/><g class="lgPunten"></g><rect class="lgVlak" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  return s + `</svg>`;
}
function lijnGrafiek(el, o){
  const W = Math.max(320, binnenBreedte(el)), H = o.hoogte || 320;
  el.innerHTML = lijnSvg({...o, hover:true}, W, H);
  const m = {l:52, r:118, t:12, b:28}, iw = W - m.l - m.r, ih = H - m.t - m.b;
  let max = 0; o.series.forEach(se => se.w.forEach(v => { if (v!=null) max = Math.max(max, v); }));
  const tk = ticks(0, max*1.04 || 1, 5);
  const y = v => m.t + (tk.hi - v) / (tk.hi - tk.lo) * ih, x = i => m.l + iw * (i + .5) / 12;
  const vlak = $('.lgVlak', el), gids = $('.lgGids', el), punten = $('.lgPunten', el), svg = $('svg', el);
  vlak.addEventListener('mousemove', e => {
    const bb = svg.getBoundingClientRect(); const px = (e.clientX - bb.left) * (W / bb.width);
    const i = Math.max(0, Math.min(11, Math.round((px - m.l) / iw * 12 - .5)));
    gids.setAttribute('x1', x(i)); gids.setAttribute('x2', x(i)); gids.setAttribute('visibility','visible');
    let p = '', h = tipKop(`T/m ${MNDL[i]} ${o.jaar}`);
    o.series.forEach(se => { const v = se.w[i]; if (v==null) return;
      p += `<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="${se.kleur}" stroke="#fff" stroke-width="2"/>`;
      h += tipRij(se.kleur === KLEUR.fc ? '#FFFFFF' : se.kleur, se.naam, eur(v), 'lijn'); });
    punten.innerHTML = p; tip.toon(h, e);
  });
  vlak.addEventListener('mouseleave', () => { gids.setAttribute('visibility','hidden'); punten.innerHTML=''; tip.weg(); });
}

/* ---------- kleine kolommen per team (zelfde schaal) ---------- */
function miniKolommen(el, o){
  const W = Math.max(200, binnenBreedte(el)), H = 96, m = {l:2, r:2, t:8, b:17};
  const iw = W-m.l-m.r, ih = H-m.t-m.b, band = iw/12, bw = Math.min(13, band*.58);
  const y = v => f1(m.t + (o.max - v) / (o.max - o.min) * ih);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  const ps = o.nu ? o.nu : o.af;
  if (ps < 12) s += `<rect x="${f1(m.l+band*ps)}" y="${m.t-6}" width="${f1(iw-band*ps)}" height="${ih+6}" fill="${KLEUR.toek}" rx="4"/>`;
  if (o.nu) s += `<rect x="${f1(m.l+band*(o.nu-1)+1)}" y="${m.t-6}" width="${f1(band-2)}" height="2.5" fill="#FFDF00" rx="1"/>`;
  s += `<line x1="${m.l}" x2="${m.l+iw}" y1="${y(0)}" y2="${y(0)}" stroke="#25273A" stroke-opacity=".45"/>`;
  for (let i=0;i<12;i++){
    const cx = m.l + band*i + band/2; let op = 0, neer = 0;
    const segs = []; ['inv','sec','acc'].forEach(c => { const v = o[c][i]; if (!v) return; if (v>0){ segs.push({c,a:op,b:op+v}); op+=v; } else { segs.push({c,a:neer,b:neer+v}); neer+=v; } });
    const lo = segs.filter(g=>g.b>0).pop();
    segs.forEach(g => { let ya = y(g.a); if (g.a!==0) ya += g.b>0 ? -1.2 : 1.2; s += `<path d="${balkPad(f1(cx-bw/2), ya, y(g.b), f1(bw), g===lo?2.5:0)}" fill="${(g.c==='sec' && i<o.af) ? '#7FB8C2' : KLEUR[g.c]}"/>`; });
    s += `<text x="${f1(cx)}" y="${H-3}" text-anchor="middle" font-size="9.5" fill="${i===o.nu-1?'#25273A':'#92939C'}" font-weight="${i===o.nu-1?700:400}">${MND[i][0]}</text>`;
    s += `<rect class="hv" data-i="${i}" x="${f1(m.l+band*i)}" y="0" width="${f1(band)}" height="${H}" fill="transparent"/>`;
  }
  el.innerHTML = s + `</svg>`;
  $$('.hv', el).forEach(r => {
    const i = +r.dataset.i;
    r.addEventListener('mouseenter', e => tip.toon(tipKop(`${o.naam} · ${MNDL[i]}`) + tipRij(KLEUR.inv,'Gefactureerd',eur(o.inv[i])) + tipRij(KLEUR.sec,'Secured',eur(o.sec[i])) + (o.acc[i]?tipRij(KLEUR.acc,'Accrual',eur(o.acc[i])):'') + tipSep + tipRij(null,'Totaal (I+F)',eur(o.inv[i]+o.sec[i]+o.acc[i])), e));
    r.addEventListener('mousemove', e => tip.zet(e));
    r.addEventListener('mouseleave', () => tip.weg());
  });
}

/* ---------- horizontale staven (HTML): naam | balk | waarde · aandeel ---------- */
function staven(lijst, o={}){
  if (!lijst.length) return `<div class="gleeg">Geen gegevens</div>`;
  const max = Math.max(...lijst.map(g => Math.max(0,g.inv) + Math.max(0,g.open)), ...lijst.map(g => g.mk || 0), 1);
  const totaal = o.totaal ?? lijst.reduce((s,g) => s + g.tot, 0);
  return `<div class="staven">` + lijst.map(g => {
    const wi = Math.max(0,g.inv)/max*100, wo = Math.max(0,g.open)/max*100;
    const t = esc(tipKop(g.naam) + tipRij(KLEUR.inv,'Gefactureerd',eur(g.inv)) + tipRij(KLEUR.sec,'Nog te factureren',eur(g.open)) + tipSep + tipRij(null,'Verwacht (I+F)',eur(g.tot))
      + (totaal ? tipRij(null,'Aandeel',pct(g.tot/totaal,1)) : '') + (g.n != null ? tipRij(null,'Regels',nl0.format(g.n)) : '') + (o.tipExtra ? o.tipExtra(g) : ''));
    const kl = 'staaf' + (o.klik ? ' klik' : '') + (o.gekozen === g.naam ? ' gekozen' : '');
    const data = o.klik ? ` data-${o.klik}="${esc(g.naam)}" tabindex="0" role="button" aria-pressed="${o.gekozen === g.naam}"` : '';
    return `<div class="${kl}"${data} data-tip="${t}">
      <div class="sn">${esc(g.naam)}${o.sub ? `<small>${o.sub(g)}</small>` : ''}</div>
      <div class="ss">${wi>0?`<div style="width:${wi}%;background:${KLEUR.inv}"></div>`:''}${wo>0?`<div style="width:${wo}%;background:${KLEUR.sec}"></div>`:''}${g.mk ? `<span class="mk" style="left:calc(${g.mk/max*100}% - 1px)"></span>` : ''}</div>
      <div class="sw">${eurK(g.tot)}<span>${o.rechts ? o.rechts(g) : (totaal ? pct(g.tot/totaal) : '')}</span></div></div>`;
  }).join('') + `</div>`;
}

/* ---------- jaarbalk: gefactureerd | nog te factureren | nog te vinden ---------- */
function jaarbalkHtml(agg, fy, fcAf, af){
  const schaal = Math.max(fy, agg.totaal) || 1, inv = Math.max(0, agg.tot.inv), open = Math.max(0, agg.open), gat = Math.max(0, fy - inv - open);
  return `<div class="jaarbalk">
      <div class="jbspoor">
        ${inv ? `<div class="seg" style="width:${inv/schaal*100}%;background:${KLEUR.inv}" data-tip="${esc(tipKop('Gefactureerd') + tipRij(KLEUR.inv,'Bedrag',eur(agg.tot.inv)) + tipRij(null,'Van forecast',pct(agg.tot.inv/fy)))}"></div>` : ''}
        ${open ? `<div class="seg" style="width:${open/schaal*100}%;background:${KLEUR.sec}" data-tip="${esc(tipKop('Nog te factureren') + tipRij(KLEUR.sec,'Secured',eur(agg.tot.sec)) + tipRij(KLEUR.acc,'Accruals',eur(agg.tot.acc)) + tipSep + tipRij(null,'Samen',eur(agg.open)))}"></div>` : ''}
        ${gat ? `<div class="seg gat" style="width:${gat/schaal*100}%" data-tip="${esc(tipKop('Nog te vinden') + tipRij(null,'Bedrag',eur(gat)) + tipRij(null,'Van forecast',pct(gat/fy)))}"></div>` : ''}
      </div>
      ${fcAf ? `<div class="jbmarker" style="left:calc(${fcAf/schaal*100}% - 1px)"><span>forecast t/m ${MND[af-1]}</span></div>` : ''}
    </div>
    <div class="jbschaal"><span>€ 0</span><span>jaarforecast ${eurK(fy)}</span></div>
    <div class="jblegenda">
      <span><i style="background:${KLEUR.inv}"></i>Gefactureerd <b>${eurK(agg.tot.inv)}</b></span>
      <span><i style="background:${KLEUR.sec}"></i>Nog te factureren <b>${eurK(agg.open)}</b></span>
      <span><i style="background:repeating-linear-gradient(135deg,#F2F3F5 0 3px,#C9CAD0 3px 4.5px)"></i>Nog te vinden <b>${eurK(gat)}</b></span>
    </div>`;
}

const xlEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
const xlKol = i => { let s = ''; i++; while (i > 0){ const r = (i-1) % 26; s = String.fromCharCode(65+r) + s; i = Math.floor((i-1)/26); } return s; };
const xlDatum = d => (d.getTime() - Date.UTC(1899, 11, 30)) / 864e5;
/* Een cel: getal, tekst, datum, of {v, s, f} met een stijl en eventueel een formule. */
function xlCel(ref, c){
  if (c == null || c === '') return '';
  let v = c, s = null, f = null;
  if (typeof c === 'object' && !(c instanceof Date)){ v = c.v; s = c.s ?? null; f = c.f ?? null; }
  const st = sv => sv != null ? ` s="${sv}"` : '';
  if (f) return `<c r="${ref}"${st(s ?? XL_STIJL.getal)}><f>${xlEsc(f)}</f>${typeof v === 'number' && isFinite(v) ? `<v>${v}</v>` : ''}</c>`;
  if (v instanceof Date) return `<c r="${ref}"${st(s ?? XL_STIJL.datum)}><v>${xlDatum(v)}</v></c>`;
  if (typeof v === 'number') return isFinite(v) ? `<c r="${ref}"${st(s ?? XL_STIJL.getal)}><v>${Math.round(v*100)/100}</v></c>` : '';
  if (v == null || v === '') return s != null ? `<c r="${ref}"${st(s)}/>` : '';
  return `<c r="${ref}" t="inlineStr"${st(s)}><is><t xml:space="preserve">${xlEsc(v)}</t></is></c>`;
}
/* blad: {naam, rijen:[[cel…]], breedtes:[…], vast: aantal vaste rijen, filter:'A1:Q10'} */
function xlBlad(b){
  const rijen = b.rijen.map((r, i) => `<row r="${i+1}">${r.map((c, j) => xlCel(xlKol(j) + (i+1), c)).join('')}</row>`).join('');
  const vast = b.vast ? `<pane ySplit="${b.vast}" topLeftCell="A${b.vast+1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A${b.vast+1}" sqref="A${b.vast+1}"/>` : '';

}
function xlWerkboek(bladen){
  const enc = new TextEncoder();
  const naamOk = n => n.replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31);
  const absoluut = ref => ref.split(':').map(x => x.replace(/^([A-Z]+)(\d+)$/, '$$$1$$$2')).join(':');   // A1:S9 → $A$1:$S$9
  const filters = bladen.map((b, i) => b.filter ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xlEsc(naamOk(b.naam))}'!${absoluut(b.filter)}</definedName>` : '').join('');
  const nu = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  const delen = [

  return maakZip(delen.map(([naam, tekst]) => ({naam, data: enc.encode(tekst)})));
}

/* ---------- zip zonder compressie (STORE), met CRC-32 ---------- */
const CRC_TABEL = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABEL[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function maakZip(bestanden){
  const enc = new TextEncoder(), d = new Date();
  const tijd = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const datum = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const lokaal = [], centraal = []; let positie = 0;
  for (const b of bestanden){
    const naam = enc.encode(b.naam), crc = crc32(b.data), n = b.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, tijd, true); h.setUint16(12, datum, true); h.setUint32(14, crc, true); h.setUint32(18, n, true); h.setUint32(22, n, true);
    h.setUint16(26, naam.length, true); h.setUint16(28, 0, true);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, tijd, true); c.setUint16(14, datum, true); c.setUint32(16, crc, true); c.setUint32(20, n, true); c.setUint32(24, n, true);
    c.setUint16(28, naam.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true);
    c.setUint32(38, 0, true); c.setUint32(42, positie, true);
    lokaal.push(new Uint8Array(h.buffer), naam, b.data);
    centraal.push(new Uint8Array(c.buffer), naam);
    positie += 30 + naam.length + n;
  }
  const cdGrootte = centraal.reduce((s, x) => s + x.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, bestanden.length, true); e.setUint16(10, bestanden.length, true);
  e.setUint32(12, cdGrootte, true); e.setUint32(16, positie, true); e.setUint16(20, 0, true);
  const delen = [...lokaal, ...centraal, new Uint8Array(e.buffer)];
  const uit = new Uint8Array(delen.reduce((s, x) => s + x.length, 0)); let p = 0;
  for (const x of delen){ uit.set(x, p); p += x.length; }
  return uit;
}

/* ---------- de inhoud ---------- */
function exportBladen(){
  const m = S.m, Y = m.jaar, regels = gefilterd(), agg = optellen(regels), k = kerncijfers(m, regels, agg);
  const fc = k.fc, af = k.af, nu = k.nu, X = XL_STIJL;
  const vj = S.team === 'Alle' && m.hist[Y-1] && m.hist[Y-1].invoiced ? m.hist[Y-1].invoiced : null;
  const wie = S.team === 'Alle' ? 'Alle teams' : S.team;
  const peil = S.lopend ? `${MNDL[S.peil-1]} ${Y}` : `heel ${Y} afgesloten`;
  const kop = t => ({v:t, s:X.kop});
  const tot = v => ({v, s:X.totaal});

  // 1. Per maand
  const s1 = [];
  s1.push([{v:`Prognose ${Y}${S.team !== 'Alle' ? ' · ' + S.team : ''}`, s:X.titel}]);
  s1.push([{v:`${m.bestand} · huidige maand ${peil} · gemaakt ${datumLang(Date.now())}`, s:X.grijs}]);
  s1.push([]);
  const h1 = ['Maand', ...(fc ? ['Forecast'] : []), 'Gefactureerd', 'Secured', 'Accrual', 'Nog te factureren', 'Totaal (I+F)', ...(fc ? ['Verschil met forecast', '% van forecast'] : []), 'Cumulatief totaal', ...(fc ? ['Cumulatief forecast'] : []), ...(vj ? [`Gefactureerd ${Y-1}`] : []), 'Periode'];
  s1.push(h1.map(kop));
  const r0 = 5;   // eerste maandrij in Excel
  const kolVan = naam => xlKol(h1.indexOf(naam));
  MND.forEach((n, i) => {
    const r = r0 + i, rij = [Hoofd(MNDL[i])];
    if (fc) rij.push(fc[i]);
    rij.push(agg.inv[i], agg.sec[i], agg.acc[i]);
    rij.push({v: agg.sec[i] + agg.acc[i], f:`${kolVan('Secured')}${r}+${kolVan('Accrual')}${r}`});
    rij.push({v: agg.maandTot[i], f:`${kolVan('Gefactureerd')}${r}+${kolVan('Nog te factureren')}${r}`});
    if (fc){
      rij.push({v: agg.maandTot[i] - fc[i], f:`${kolVan('Totaal (I+F)')}${r}-${kolVan('Forecast')}${r}`});
      rij.push(fc[i] ? {v: agg.maandTot[i]/fc[i], f:`IF(${kolVan('Forecast')}${r}=0,"",${kolVan('Totaal (I+F)')}${r}/${kolVan('Forecast')}${r})`, s:X.pct} : '');
    }
    rij.push({v: som(agg.maandTot, 0, i+1), f:`SUM(${kolVan('Totaal (I+F)')}$${r0}:${kolVan('Totaal (I+F)')}${r})`});
    if (fc) rij.push({v: som(fc, 0, i+1), f:`SUM(${kolVan('Forecast')}$${r0}:${kolVan('Forecast')}${r})`});
    if (vj) rij.push(vj[i] || 0);
    rij.push(i === nu-1 ? 'lopende maand' : i < af ? 'realisatie' : 'prognose');
    s1.push(rij);
  });
  const rt = r0 + 12, laatste = r0 + 11;
  const somF = naam => ({v:null, f:`SUM(${kolVan(naam)}${r0}:${kolVan(naam)}${laatste})`, s:X.totaal});
  const jr = [{v:'Jaar', s:X.totaalTekst}];
  if (fc) jr.push({...somF('Forecast'), v:som(fc)});
  jr.push({...somF('Gefactureerd'), v:agg.tot.inv}, {...somF('Secured'), v:som(agg.sec)}, {...somF('Accrual'), v:som(agg.acc)}, {...somF('Nog te factureren'), v:som(agg.sec)+som(agg.acc)}, {...somF('Totaal (I+F)'), v:som(agg.maandTot)});
  if (fc){ jr.push({...somF('Verschil met forecast'), v:som(agg.maandTot) - som(fc)}); jr.push({v:som(agg.maandTot)/som(fc), f:`${kolVan('Totaal (I+F)')}${rt}/${kolVan('Forecast')}${rt}`, s:X.totaalPct}); }
  jr.push({v:som(agg.maandTot), f:`${kolVan('Cumulatief totaal')}${laatste}`, s:X.totaal});
  if (fc) jr.push({v:som(fc), f:`${kolVan('Cumulatief forecast')}${laatste}`, s:X.totaal});
  if (vj) jr.push({...somF(`Gefactureerd ${Y-1}`), v:som(vj)});
  jr.push({v:'', s:X.totaalTekst});
  s1.push(jr);
  if (agg.zonder.inv || agg.zonder.sec || agg.zonder.acc){
    s1.push([]);
    s1.push([{v:`Zonder maand (niet in de tabel): gefactureerd ${eur(agg.zonder.inv)}, secured ${eur(agg.zonder.sec)}, accrual ${eur(agg.zonder.acc)}. Zie het blad Controle.`, s:X.grijs}]);
  }

  // 2. Per team (altijd alle teams)
  const teams = groepeer(m.regels, 'team'), totT = teams.reduce((s, t) => s + t.tot, 0);
  const perMaand = {}; teams.forEach(t => { perMaand[t.naam] = optellen(m.regels.filter(o => o.team === t.naam)).maandTot; });
  const s2 = [[{v:`Per team · ${Y}`, s:X.titel}], [{v:'Verwacht (I+F) = gefactureerd + nog te factureren. Altijd alle teams.', s:X.grijs}], []];
  const h2 = ['Team', 'Regels', 'Klanten', 'Gefactureerd', 'Secured', 'Accrual', 'Nog te factureren', 'Verwacht (I+F)', 'Aandeel', ...MND.map(n => `${Hoofd(n)} (I+F)`)];
  s2.push(h2.map(kop));
  teams.forEach((t, i) => { const r = 5 + i;
    s2.push([t.naam, t.n, t.klanten.size, t.inv, t.sec, t.acc, {v:t.open, f:`E${r}+F${r}`}, {v:t.tot, f:`D${r}+G${r}`}, {v:t.tot/(totT||1), f:`IF($H$${5+teams.length}=0,"",H${r}/$H$${5+teams.length})`, s:X.pct}, ...perMaand[t.naam]]); });
  const rl = 4 + teams.length;
  s2.push([{v:'Totaal', s:X.totaalTekst}, ...['B','C','D','E','F','G','H'].map((c, j) => ({v:[teams.reduce((s,t)=>s+t.n,0), null, teams.reduce((s,t)=>s+t.inv,0), teams.reduce((s,t)=>s+t.sec,0), teams.reduce((s,t)=>s+t.acc,0), teams.reduce((s,t)=>s+t.open,0), totT][j], f: c === 'C' ? null : `SUM(${c}5:${c}${rl})`, s:X.totaal})),
    {v:1, s:X.totaalPct}, ...MND.map((n, i) => ({v: teams.reduce((s, t) => s + perMaand[t.naam][i], 0), f:`SUM(${xlKol(9+i)}5:${xlKol(9+i)}${rl})`, s:X.totaal}))]);
  s2[s2.length-1][2] = {v: new Set(m.regels.filter(o => o.telt).map(o => o.client)).size, s:X.totaal};

  // 3. Regels
  const catNaam = o => !o.telt ? '–' : ({inv:'Gefactureerd', sec:'Secured', acc:'Accrual'}[o.cat] || '–');
  const h3 = ['Rij in Excel', 'FLOW ID', 'Client', 'Team', 'Purpose', 'Type', 'One-off / recurring', 'Property / portfolio', 'Instruction status', 'Telt mee', 'Soort', 'Maand', 'Bedrag', 'Secured Fee', 'Invoiced amount', 'Factuurnummer', 'Factuurdatum', 'Projected month (zoals ingevuld)', 'Opmerking'];
  const s3 = [h3.map(kop)];
  regels.slice().sort((a, b) => a.rij - b.rij).forEach(o => s3.push([o.rij, o.id, o.client, o.team, o.purpose === '(leeg)' ? '' : o.purpose, o.type === '(leeg)' ? '' : o.type, o.soort === '(leeg)' ? '' : o.soort, o.object, o.statusTekst,
    o.telt ? 'ja' : 'nee', catNaam(o), o.mnd ? Hoofd(MNDL[o.mnd-1]) : '', o.bedrag, o.secured ?? '', o.invoiced ?? '', o.factuurnr, o.factuurdatum || '', o.maandTekst,
    o.issues.filter(c => !STIL.has(c)).map(c => (CHECKS[c] || {t:c}).t).join('; ')]));

  // 4. Controle (altijd het hele bestand)
  const s4 = [[{v:'Controle', s:X.titel}], [{v:'Regels met invloed op de cijfers. Het rijnummer is de rij in Excel; pas ze daar aan en lees het bestand opnieuw in.', s:X.grijs}], []];
  s4.push(['Rij in Excel', 'Client', 'Instruction status', 'Projected month', 'Bedrag', 'Telt niet mee', 'Valt in geen maand', 'Wat is er aan de hand', 'Wat moet er gebeuren'].map(kop));
  if (!S.ctrl.aandacht.length) s4.push(['', 'Alle bedragen tellen mee, elk in een maand.']);
  S.ctrl.aandacht.slice().sort((a, b) => a.o.rij - b.o.rij).forEach(a => s4.push([a.o.rij, a.o.client, a.o.statusTekst || '(leeg)', a.o.maandTekst, a.o.bedrag, a.mist || '', a.maand || '',
    a.adv.map(x => (CHECKS[x.c] || {t:x.c}).t).join('; '), {v: a.adv.map(x => x.a).join(' '), s:X.wrap}]));
  const info = controleLijst(m, S.ctrl).filter(c => c.n && c.st !== 'let');
  if (info.length){
    s4.push([]); s4.push([{v:'Ter info', s:X.vet}]);
    info.forEach(c => s4.push([{v:c.t, s:X.tekst}, '', '', '', '', '', '', `${meervoud(c.n,'regel','regels')}: rij ${c.regels.slice(0, 25).map(o => o.rij).join(', ')}${c.n > 25 ? ' …' : ''}`]));
  }

  // 5. Herkomst
  const aansl = aansluiting(m);
  const s5 = [[{v:'Herkomst', s:X.titel}], [],
    [{v:'Bestand', s:X.vet}, m.bestand], [{v:'Ingelezen', s:X.vet}, datumTijd(m.tijd)], [{v:'Tab met regels', s:X.vet}, `${m.tab} (koprij op rij ${m.kop.rij+1})`],
    [{v:'Tab met forecast', s:X.vet}, m.hist[Y] ? m.hist[Y].tab : (m.histTabs[0] || '–')], [{v:'Regels', s:X.vet}, m.regels.length],
    [{v:'Overgeslagen rijen', s:X.vet}, m.overgeslagen.map(x => `rij ${x.rij} (${x.tekst})`).join(', ') || '–'],
    [{v:'Team', s:X.vet}, wie], [{v:'Huidige maand', s:X.vet}, peil],
    [{v:'Aansluiting', s:X.vet}, !aansl ? 'geen rij Invoiced om mee te vergelijken' : aansl.afwijk ? `gefactureerd wijkt in ${meervoud(aansl.afwijk,'maand','maanden')} af van ${aansl.tab} (samen ${plus(aansl.totaal, eur)})` : `gefactureerd sluit aan op ${aansl.tab}`],
    [], [{v:'Hoe rekent Prognose', s:X.vet}],
    ['', 'Gefactureerd: status Invoiced; bedrag uit Invoiced amount, in de maand van de Invoice date.'],
    ['', 'Secured: status Running; bedrag uit Secured Fee, in de Projected month.'],
    ['', 'Accrual (FS en YE): bedrag uit Secured Fee, in de Projected month. Negatieve accruals verlagen de prognose.'],
    ['', 'Nog te factureren = secured + accruals. Verwacht (I+F) = gefactureerd + nog te factureren.'],
    ['', 'Cancelled, Lost en On hold tellen bewust niet mee. De totaalregel en lege regels worden overgeslagen.'],
    [], [{v:`Gemaakt met Prognose ${VERSIE.nr} op ${datumLang(Date.now())}.`, s:X.grijs}]];

  return [
    {naam:'Per maand', rijen:s1, vast:4, breedtes:[14, ...h1.slice(1, -1).map(() => 15), 14]},
    {naam:'Per team', rijen:s2, vast:4, breedtes:[24, 8, 9, 14, 13, 12, 15, 15, 9, ...MND.map(() => 12)]},
    {naam:'Regels', rijen:s3, vast:1, filter:`A1:${xlKol(h3.length-1)}${s3.length}`, breedtes:[9, 13, 30, 18, 18, 14, 14, 32, 16, 8, 13, 11, 13, 13, 13, 14, 12, 14, 40]},
    {naam:'Controle', rijen:s4, vast:4, breedtes:[10, 30, 16, 13, 13, 13, 13, 40, 70]},
    {naam:'Herkomst', rijen:s5, breedtes:[22, 110]},
  ];
}
function exporteerExcel(){
  if (!S.m) return;
  try {
    const data = xlWerkboek(exportBladen());
    const blob = new Blob([data], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const d = new Date(), dd = n => String(n).padStart(2, '0');
    const naam = `Prognose ${S.m.jaar}${S.team !== 'Alle' ? ' ' + S.team.replace(/[\\/:*?"<>|]/g, ' ') : ''} - ${d.getFullYear()}-${dd(d.getMonth()+1)}-${dd(d.getDate())}.xlsx`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = naam;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    diagLog('info', `Excel gemaakt: ${Math.round(data.length / 1024)} kB${S.team !== 'Alle' ? ', voor één team' : ''}`);
    meld(`Excel gemaakt: ${naam}`);
  } catch(e){ console.error(e); diagFout(e, 'Excel exporteren'); meld('Het Excel-bestand kon niet worden gemaakt. De foutzoeker op de Data-stap heeft de details.'); }
}

function kiesProfiel(k){

  const lijnen = y => [0,1,2,3].map(i => r(4, y + i*3.2, 40, 1.3)).join('');
  const d = {

    navy: r(4, 3, 40, 10, '#25273A', 1) + r(6, 5, 1.2, 6, '#FFDF00', 0) + r(8.5, 5.3, 16, 2.4, '#FFFFFF', .6) + r(8.5, 9, 10, 1.2, '#92939C', .3) + r(37.5, 4.5, 5, 5, '#FFE843', 0) + tegels(16, '#FFDF00') + r(4, 26, 8, 1.4, '#25273A', .3) + lijnen(29.5),

const STUDIO = {timer:null, wacht:false, laad:0, scroll:0};
const paginaMaat = () => R.richting === 'liggend' ? [297, 210] : [210, 297];
function pRapport(){

function schaalVoorbeeld(){
  const frame = $('#pdfFrame'), doek = $('#pdfDoek'), schaal = $('#pdfSchaal');
  if (!frame || !doek.clientWidth) return;
  const bw = Math.round(paginaMaat()[0] * 3.7795) + 40;
  const s = Math.min(1, (doek.clientWidth - 24) / bw);
  frame.style.width = bw + 'px';
  frame.style.height = Math.ceil(doek.clientHeight / s) + 'px';
  frame.style.transform = `scale(${s})`;
  frame.style.transformOrigin = '0 0';
  schaal.style.width = Math.floor(bw * s) + 'px';
  schaal.style.height = doek.clientHeight + 'px';
}
function verversRapport(direct){
  clearTimeout(STUDIO.timer);
  STUDIO.wacht = true;
  STUDIO.timer = setTimeout(maakVoorbeeld, direct ? 0 : 260);
}
function maakVoorbeeld(){
  clearTimeout(STUDIO.timer); STUDIO.wacht = false;
  if (!S.m || S.stap !== 'rapport') return;
  const frame = $('#pdfFrame');
  try { STUDIO.scroll = frame.contentWindow ? frame.contentWindow.scrollY : 0; } catch(e){ STUDIO.scroll = 0; }
  try { if (frame.contentWindow) frame.contentWindow.__oud = true; } catch(e){}
  schaalVoorbeeld();
  $('#pdfInfo').textContent = 'Bezig met opmaken…';
  $('#pdfLaden').classList.remove('verborgen');
  try { frame.srcdoc = bouwRapport({voorbeeld:true}); }
  catch(e){
    diagFout(e, 'rapport opmaken');
    $('#pdfLaden').classList.add('verborgen');
    $('#pdfInfo').innerHTML = '<span style="color:var(--signaal)">Het rapport kon niet worden gemaakt.</span> De foutzoeker op de Data-stap heeft de details.';
  }
}
function voorbeeldKlaar(){

  try { const w = $('#pdfFrame').contentWindow; return !!(w && !w.__oud && w.__klaar); } catch(e){ return false; }
}
function rapportInfo(){
  let n = 0;
  try { n = $('#pdfFrame').contentDocument.querySelectorAll('.blad').length; } catch(e){}
  $('#pdfLaden').classList.add('verborgen');
  $('#pdfInfo').innerHTML = `<b>${n} pagina${n===1?'':'’s'}</b> · A4 ${R.richting} · ${S.team==='Alle' ? 'alle teams' : esc(S.team)} · ${S.lopend ? `huidige maand ${MNDL[S.peil-1]}` : `heel ${S.m.jaar}`}`;
}
function rapportInVenster(){
  const win = window.open('', '_blank');
  if (!win){ meld('Pop-up geblokkeerd; sta pop-ups toe voor deze pagina'); return; }
  win.document.open(); win.document.write(bouwRapport({voorbeeld:false})); win.document.close();
}
async function drukRapportAf(){
  const knop = $('#pdfPrint'), frame = $('#pdfFrame');
  if (knop.disabled) return;
  if (STUDIO.wacht) maakVoorbeeld();
  knop.disabled = true;
  const tekst = $('span', knop), was = tekst.textContent;
  let n = 0;
  while (!voorbeeldKlaar()){
    if (S.stap !== 'rapport' || ++n > 300){ knop.disabled = false; tekst.textContent = was; return; }
    if (n === 4) tekst.textContent = 'Even wachten…';
    await new Promise(r => setTimeout(r, 100));
  }
  knop.disabled = false; tekst.textContent = was;
  try { const w = frame.contentWindow; w.focus(); w.print(); } catch(e){ rapportInVenster(); }
}
/* Vanaf het datascherm: naar Rapport, en meteen afdrukken (of eerst bekijken). */
async function naarRapport(afdrukken){

  if (afdrukken) await drukRapportAf();
}
function koppelRapport(){
  const k = $('#stKeuzes');
  const opnieuw = (direct=true) => { bewaarR(); const sc = k.scrollTop; tekenStudio(); k.scrollTop = sc; verversRapport(direct); };
  k.addEventListener('click', e => {
    const b = e.target.closest('[data-stseg] button');
    if (b){ R[b.parentElement.dataset.stseg] = b.dataset.w; if (b.parentElement.dataset.stseg === 'richting') schaalVoorbeeld(); opnieuw(); return; }
    const sj = e.target.closest('[data-stsjab]');
    if (sj){ R.sjabloon = sj.dataset.stsjab; opnieuw(); return; }
    const pr = e.target.closest('[data-stprof]');
    if (pr){ kiesProfiel(pr.dataset.stprof); opnieuw(); meld(`Profiel ${PROFIELEN[R.profiel].naam}`); return; }
    if (e.target.closest('[data-ststd]')){
      Object.assign(R, {...R_STANDAARD, titel:R.titel, kenmerk:R.kenmerk, auteur:R.auteur, datum:R.datum, toelichting:R.toelichting, o:R.o});
      kiesProfiel('maand'); opnieuw(); meld('Standaardinstellingen'); return;
    }
  });
  k.addEventListener('change', e => {
    const v = e.target.closest('[data-stvink]');
    if (v){
      const [g, sl] = v.dataset.stvink.split('.');
      if (g === 'o') R.o[sl] = v.checked; else R[sl] = v.checked;
      opnieuw();
      if (v.dataset.stvink === 'o.toel' && v.checked){ const t = $('[data-sttoel]'); if (t) t.focus(); }
      return;
    }
    if (e.target.matches('[data-stteam]')){ S.team = e.target.value; render(); return; }
    if (e.target.matches('[data-stpeil]')){ const w = e.target.value; if (w === 'af'){ S.peil = 12; S.lopend = false; } else { S.peil = +w; S.lopend = true; } render(); return; }
    if (e.target.matches('[data-sttekst]') && e.target.type === 'date'){ R.datum = e.target.value; bewaarR(); verversRapport(); }
  });
  k.addEventListener('input', e => {
    const tl = e.target.closest('[data-sttoel]');
    const t = tl || e.target.closest('[data-sttekst]'); if (!t || t.type === 'date') return;
    R[tl ? 'toelichting' : t.dataset.sttekst] = t.value; bewaarR(); verversRapport();
  });
  const frame = $('#pdfFrame');
  frame.addEventListener('load', () => {
    const mijn = ++STUDIO.laad, doel = STUDIO.scroll;
    let doc = null; try { doc = frame.contentDocument; } catch(e){}
    let terug = !doel;
    const wacht = () => {
      if (mijn !== STUDIO.laad) return;
      let w = null; try { w = frame.contentWindow; } catch(e){}
      if (!w || !doc || w.document !== doc) return;
      if (!terug && (w.scrollY > 0 || doc.documentElement.scrollHeight >= doel + w.innerHeight)){ if (!w.scrollY) w.scrollTo(0, doel); terug = true; }
      if (w.__klaar){ if (!terug && !w.scrollY) w.scrollTo(0, doel); rapportInfo(); if (w.__fout) diagFout({name:'Fout', message:w.__fout, stack:w.__stack || ''}, 'rapport over bladen verdelen'); return; }
      setTimeout(wacht, 80);
    };
    wacht();
  });
  $('#pdfPrint').addEventListener('click', drukRapportAf);
  $('#pdfVenster').addEventListener('click', rapportInVenster);
  if (window.ResizeObserver) new ResizeObserver(() => { if (S.stap === 'rapport') schaalVoorbeeld(); }).observe($('#pdfDoek'));
}

/* Eigen tekst als alinea's en opsommingen. */
function tekstHtml(tekst){
  const uit = []; let alinea = [], lijst = null;
  const sluitA = () => { if (alinea.length) uit.push(`<p>${alinea.map(esc).join('<br>')}</p>`); alinea = []; };
  const sluitL = () => { if (lijst) uit.push(`<ul>${lijst.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`); lijst = null; };
  for (const r of String(tekst || '').replace(/\r\n?/g, '\n').split('\n')){
    if (!r.trim()){ sluitA(); sluitL(); continue; }
    const b = r.match(/^\s*[-–•*]\s+(.*)$/);
    if (b){ sluitA(); (lijst = lijst || []).push(b[1].trim()); }
    else if (lijst && /^\s/.test(r)) lijst[lijst.length-1] += ' ' + r.trim();
    else { sluitL(); alinea.push(r.trim()); }
  }
  sluitA(); sluitL();
  return uit.join('');
}
const zonderLinks = h => String(h).replace(/\s*<a\b[^>]*>.*?<\/a>/g, '');
const getal = v => v == null || !isFinite(v) ? '' : (v < 0 ? '−' : '') + nl0.format(Math.round(Math.abs(v)));
const kort = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n-1) + '…' : s; };

function stavenSvg(lijst, W, o={}){
  const rij = 19, H = lijst.length * rij + 4, naamB = Math.min(170, W*.26), waardeB = 118, bx = naamB + 10, bw = Math.max(60, W - bx - waardeB);
  const max = Math.max(...lijst.map(g => Math.max(0,g.inv) + Math.max(0,g.open)), ...lijst.map(g => g.mk || 0), 1);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
  lijst.forEach((g, i) => {
    const y = 2 + i*rij, wi = Math.max(0,g.inv)/max*bw, wo = Math.max(0,g.open)/max*bw;
    s += `<text x="${f1(naamB)}" y="${y+12.5}" text-anchor="end" font-size="10.5" fill="#25273A">${esc(kort(g.naam, 30))}</text>`;
    if (wi > .2) s += `<rect x="${f1(bx)}" y="${y+4}" width="${f1(wi)}" height="10.5" fill="${KLEUR.inv}"/>`;
    if (wo > .2) s += `<rect x="${f1(bx + wi + (wi > .2 ? 1.5 : 0))}" y="${y+4}" width="${f1(wo)}" height="10.5" fill="${KLEUR.sec}"/>`;
    if (g.mk) s += `<rect x="${f1(bx + g.mk/max*bw - 1.2)}" y="${y+1}" width="2.4" height="16.5" rx="1" fill="${KLEUR.fc}"/>`;
    s += `<text x="${f1(bx + bw + 10)}" y="${y+12.5}" font-size="10.5" font-weight="700" fill="#25273A">${eurK(g.tot)}</text>`;
    s += `<text x="${W}" y="${y+12.5}" text-anchor="end" font-size="10" fill="#92939C">${esc(o.rechts ? o.rechts(g) : pct(g.tot/(o.totaal||1)))}</text>`;
  });
  return s + '</svg>';
}
function jaarbalkSvg(agg, fy, fcAf, af, W){
  const H = 50, schaal = Math.max(fy, agg.totaal) || 1, x = v => f1(Math.max(0, v)/schaal*W);
  const inv = Math.max(0, agg.tot.inv), open = Math.max(0, agg.open), gat = Math.max(0, fy - inv - open), y = 16, h = 13;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<defs><pattern id="gatR" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#F2F3F5"/><rect width="1.4" height="5" fill="#C9CAD0"/></pattern></defs>`;
  s += `<rect x="0" y="${y}" width="${W}" height="${h}" fill="#F2F3F5"/>`;
  if (inv) s += `<rect x="0" y="${y}" width="${x(inv)}" height="${h}" fill="${KLEUR.inv}"/>`;
  if (open) s += `<rect x="${f1(+x(inv) + (inv ? 1.5 : 0))}" y="${y}" width="${x(open)}" height="${h}" fill="${KLEUR.sec}"/>`;
  if (gat) s += `<rect x="${f1(+x(inv + open) + 3)}" y="${y}" width="${f1(Math.max(0, +x(gat) - 3))}" height="${h}" fill="url(#gatR)"/>`;
  if (fcAf && af){
    const mx = +x(fcAf);
    s += `<rect x="${f1(mx - 1)}" y="${y-5}" width="2" height="${h+10}" fill="${KLEUR.fc}"/>`;
    s += `<text x="${f1(Math.min(Math.max(mx, 50), W - 50))}" y="${y-8}" text-anchor="middle" font-size="9.5" fill="#666874">forecast t/m ${MND[af-1]}</text>`;
  }
  s += `<text x="0" y="${y+h+14}" font-size="9.5" fill="#92939C">€ 0</text><text x="${W}" y="${y+h+14}" text-anchor="end" font-size="9.5" fill="#92939C">jaarforecast ${eurK(fy)}</text>`;
  return s + '</svg>';
}

function bouwRapport({voorbeeld = true} = {}){
  const m = S.m, Y = m.jaar, regels = gefilterd(), agg = optellen(regels), k = kerncijfers(m, regels, agg);
  const O = R.o, liggend = R.richting === 'liggend';
  const [W, H] = paginaMaat(), marge = 14;
  const f = {klein:8, normaal:9, groot:10}[R.dichtheid] || 9, tf = f - .5;
  const pxB = Math.floor((W - 2*marge) * 3.7795);
  const af = k.af, nu = k.nu, fc = k.fc;
  const titel = R.titel.trim() || standaardTitel();
  const datum = R.datum ? datumLang(R.datum) : datumLang(Date.now());
  const wie = S.team === 'Alle' ? 'Alle teams' : S.team;
  const peilTekst = S.lopend ? `${MNDL[S.peil-1]} ${Y}` : `heel ${Y} afgesloten`;

      groepen.forEach(g => {
        const punt = o => (adv.get(o) || []).find(x => x.c === g.code) || {};
        const bedrag = g.regels.reduce((s,o) => s + Math.abs(punt(o).mist || punt(o).maand || 0), 0);
        B.push(`<div class="lbl klein">${esc(g.t)}<span class="sub">${meervoud(g.regels.length,'regel','regels')} · ${eurK(bedrag)} ${g.mist ? 'telt niet mee' : 'valt in geen maand'}</span></div>`);
        B.push(`<table class="tab opm"><thead><tr><th>Rij</th><th class="t">Client</th><th class="t">Status</th><th class="t">Maand</th><th>Bedrag</th><th class="t">Wat moet er gebeuren</th></tr></thead>
          <tbody>${g.regels.slice(0, 60).map(o => `<tr><td class="z">${o.rij}</td><td class="t">${esc(kort(o.client, 34))}</td><td class="t">${esc(o.statusTekst || '(leeg)')}</td><td class="t">${esc(kort(o.maandTekst, 14))}</td><td>${getal(punt(o).mist || punt(o).maand || o.bedrag)}</td><td class="t z">${esc(punt(o).a || '')}</td></tr>`).join('')}</tbody></table>`);
      });
    }
  }
  if (O.regels){
    const l = regels.slice().sort((a,b) => a.rij - b.rij);
    B.push(`<div class="lbl" data-nieuw>Bijlage · alle regels<span class="sub">${meervoud(l.length,'regel','regels')} uit ${esc(m.tab)}${S.team !== 'Alle' ? `, ${esc(S.team)}` : ''}; doorgestreept telt niet mee</span></div>`);
    B.push(`<table class="tab"><thead><tr><th>Rij</th><th class="t">Client</th>${liggend ? '<th class="t">Property / portfolio</th>' : ''}<th class="t">Team</th><th class="t">Status</th><th class="t">Maand</th><th>Bedrag</th><th class="t">Factuur</th></tr></thead>
      <tbody>${l.map(o => `<tr${o.telt ? '' : ' class="uit"'}><td class="z">${o.rij}</td><td class="t">${esc(kort(o.client, liggend ? 44 : 34))}</td>${liggend ? `<td class="t z">${esc(kort(o.object, 50))}</td>` : ''}<td class="t z">${esc(kort(o.team, 20))}</td><td class="t">${esc(kort(o.statusTekst || '(leeg)', 16))}</td><td class="t">${o.mnd ? Hoofd(MND[o.mnd-1]) : '–'}</td><td>${o.telt ? getal(o.bedrag) : `<s>${getal(o.bedrag)}</s>`}</td><td class="t z">${esc(kort(o.factuurnr, 16))}</td></tr>`).join('')}</tbody></table>`);
  }

  const voettekst = `${titel} · ${datum}`;
  const loop = `<span>${esc(titel)} · huidige maand ${esc(peilTekst)}</span><span>${esc(m.bestand)}</span>`;
  const css = rapportCss({W, H, marge, f, tf, liggend});
  return `<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>${esc(titel)}</title><style>${css}</style></head>
<body class="t-${R.sjabloon}">
${voorbeeld ? '' : `<div class="balkje geenprint"><span>Kies in het afdrukvenster “Opslaan als PDF” en zet de marges op “Geen”.</span><button onclick="window.print()">Afdrukken / PDF</button></div>`}
<div id="bron">${B.join('\n')}</div>
<div id="paginas"></div>
<script>var VOETTEKST=${JSON.stringify(voettekst)}, MET_VOET=${R.voet ? 'true' : 'false'}, LOOP=${JSON.stringify(loop)};
window.__klaar=false;
try { (${pagineer.toString()})(); } catch(e){ window.__fout = String(e && e.message || e); window.__stack = String(e && e.stack || ''); window.__klaar = true; }

}
