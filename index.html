  --kophoogte:52px;
  /* Data: teal is de merkkleur voor data (één stap verzadigder dan #238291),
     licht teal is "nog niet", oranje de tegenkleur voor correctie/daling,
     navy is de referentie (forecast als streep, vorig jaar als rondje). */
  --data1:#008A9C; --data1-licht:#BDD9DE; --data2:#EF6B00; --data3:#097CE8;
  --vorig:#25273A; --rooster:#E8E8EB; --room:#F5F2F0;
  /* Excel-groen: alles wat uit het werkboek komt */
  --xl:#107C41; --xl-d:#0B5A2F; --xl-t:#E6F2EA; --xl-l:#F3F9F5; --xl-r:#B9DCC6; --let-t:#FFF1E4;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--papier);color:var(--inkt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,"Helvetica Neue",sans-serif;
  font-size:14px;line-height:1.47;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.verborgen{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- knoppen ---------- */
.k{font-size:13.5px;font-weight:500;padding:7px 14px;border-radius:var(--r-klein);cursor:pointer;border:0;background:var(--accent-zacht);color:var(--accent);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background var(--soepel),transform var(--soepel),opacity var(--soepel),filter var(--soepel)}
.k.vol{background:var(--accent);color:#fff}
.k.stil{background:rgba(0,0,0,.05);color:var(--zacht)}
.k.geel{background:var(--geel);color:#000;font-weight:600}
.k.waarschuw{background:rgba(206,24,30,.08);color:var(--signaal)}
.k:disabled{opacity:.4;cursor:not-allowed}
.k:hover:not(:disabled){filter:brightness(1.06)}
.k.stil:hover:not(:disabled){background:var(--navy6);color:var(--inkt);filter:none}
.k.vol:hover:not(:disabled){filter:brightness(1.18)}
.k:active:not(:disabled){transform:scale(.97)}
.k svg{flex:0 0 auto}
.k.cta{background:var(--geel);color:#000;font-weight:600;font-size:14px;padding:9px 18px;border-radius:11px;box-shadow:0 1px 2px rgba(37,39,58,.18),0 6px 18px rgba(37,39,58,.14)}
.k.cta:hover:not(:disabled){filter:none;background:#FFE733;box-shadow:0 1px 2px rgba(37,39,58,.2),0 8px 22px rgba(37,39,58,.18)}
.k.cta:disabled{box-shadow:none}
.mini{font-size:11.5px;padding:3.5px 10px;border:0;border-radius:var(--r-pil);background:rgba(0,0,0,.05);color:var(--zacht);cursor:pointer;white-space:nowrap;transition:background var(--soepel),color var(--soepel)}
.mini:hover:not(:disabled){background:var(--accent-zacht);color:var(--accent)}
.ikoonknop{width:32px;height:32px;border:0;border-radius:var(--r-pil);background:transparent;color:var(--zacht);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background var(--soepel),color var(--soepel)}
.ikoonknop:hover{background:rgba(0,0,0,.06);color:var(--inkt)}
.ikoonknop.open{background:rgba(0,0,0,.08);color:var(--inkt)}
.ikoonknop svg{display:block}
.lnk{border:0;background:none;color:var(--xl);font:inherit;font-size:13px;font-weight:500;cursor:pointer;padding:0;white-space:nowrap}
.lnk:hover{text-decoration:underline;text-underline-offset:2px}
.alink{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--navy5);text-underline-offset:2px}
.alink:hover{text-decoration-color:var(--navy)}

/* ---------- kop: altijd bovenaan, nooit in de weg ---------- */
.kop{background:rgba(255,255,255,.74);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--lijn);
  position:sticky;top:0;z-index:40;height:var(--kophoogte)}
@supports not (backdrop-filter:blur(1px)){.kop{background:#fff}}
.kopbinnen{height:100%;max-width:1440px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:14px}
.merk{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--inkt);cursor:pointer;letter-spacing:-.015em;flex:0 0 auto;border:0;background:none;padding:4px 6px 4px 0;font-size:14px}
.vlag{width:24px;height:24px;display:block;flex:0 0 auto}
.vlag svg{width:100%;height:100%;display:block}
.stappen{display:inline-flex;gap:2px;background:rgba(0,0,0,.05);border-radius:var(--r-pil);padding:2px;flex:0 1 auto;overflow-x:auto;scrollbar-width:none}
.stappen::-webkit-scrollbar{display:none}
.stappen button{border:0;background:none;cursor:pointer;border-radius:var(--r-pil);padding:4px 12px;font-size:12.5px;font-weight:500;color:var(--zacht);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
  transition:background var(--soepel),color var(--soepel),box-shadow var(--soepel)}
.stappen button:hover:not(:disabled){color:var(--inkt)}
.stappen button.aan{background:var(--wit);color:var(--inkt);box-shadow:0 1px 3px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04)}
.stappen button:disabled{opacity:.4;cursor:not-allowed}
.stapvink{width:15px;height:15px;border-radius:50%;background:var(--goed);color:#fff;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
.stapvink.let{background:#E07B00}
.stapvink svg{display:block}
.kopcontext{min-width:0;flex:1 1 auto;font-size:13px;color:var(--zacht);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopcontext b{color:var(--inkt);font-weight:600}
.kop .rechts{margin-left:auto;display:flex;gap:2px;align-items:center;flex:0 0 auto}
.stand{font-size:12px;color:var(--zacht);margin-right:8px;white-space:nowrap;max-width:36ch;overflow:hidden;text-overflow:ellipsis}
.stand.goed{color:var(--goed)} .stand.mis{color:var(--signaal)}

/* ---------- schermen ---------- */
.scherm{min-height:calc(100vh - var(--kophoogte));display:flex;flex-direction:column}
.blad{width:100%;max-width:1320px;margin:0 auto;padding:18px 18px 24px;flex:1}
.blad.breed{max-width:1560px}
.paneel{background:var(--wit);border-radius:var(--r-groot);box-shadow:var(--schaduw)}
.paneelkop{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.paneelkop h2{margin:0;font-size:14px;font-weight:600}
.paneelkop .aantal{font-size:12px;color:var(--flauw)}
.paneelkop .rechtsin{margin-left:auto;display:flex;gap:6px;align-items:center}
.voetbalk{position:sticky;bottom:0;z-index:20;background:rgba(238,232,227,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:.5px solid var(--lijn)}
.voetbinnen{max-width:1320px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px}
.voetbinnen .samen{font-size:12.5px;color:var(--zacht)}
.voetbinnen .samen b{color:var(--inkt)}
.voetbinnen .rest{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- velden, keuzes ---------- */
.vld{margin-bottom:14px;min-width:0}
.vld>label{display:block;font-size:12px;font-weight:500;color:var(--zacht);margin-bottom:6px}
.vld .optioneel{font-weight:400;color:var(--flauw)}
.invoer,.vld input,.vld select,.vld textarea{width:100%;font-size:13.5px;padding:8px 11px;border:0;border-radius:var(--r-klein);background:var(--vlak);color:var(--inkt);transition:box-shadow var(--soepel),background var(--soepel)}
.invoer:focus,.vld input:focus,.vld select:focus,.vld textarea:focus{outline:0;background:var(--wit);box-shadow:0 0 0 3px var(--accent-zacht),0 0 0 1px var(--accent)}
.vld input::placeholder,.vld textarea::placeholder{color:var(--navy4)}
.vld textarea{resize:vertical;min-height:84px;line-height:1.45}
.hint{font-size:11.5px;color:var(--flauw);line-height:1.45;margin-top:5px}
.keuzes{display:flex;flex-wrap:wrap;gap:6px}
.keuze{font-size:13px;padding:6.5px 13px;border-radius:var(--r-pil);border:1px solid var(--lijn);background:var(--wit);color:var(--inkt);cursor:pointer;white-space:nowrap;
  transition:background var(--soepel),border-color var(--soepel),color var(--soepel)}
.keuze:hover{background:var(--vlak)}
.keuze.aan{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:500}
.segment{display:inline-flex;background:rgba(0,0,0,.05);border-radius:var(--r-pil);padding:2px;gap:2px;flex-wrap:wrap}
.segment button{border:0;background:none;cursor:pointer;border-radius:var(--r-pil);padding:4px 12px;font-size:12.5px;font-weight:500;color:var(--zacht);white-space:nowrap;
  transition:background var(--soepel),color var(--soepel),box-shadow var(--soepel)}
.segment button:hover{color:var(--inkt)}
.segment button.aan{background:var(--wit);color:var(--inkt);box-shadow:0 1px 3px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04)}
.segment.klein button{padding:2px 9px;font-size:11.5px}
.segment.vol{display:flex;width:100%}
.segment.vol button{flex:1}
.chip{font-size:12px;padding:4px 10px;border-radius:var(--r-pil);cursor:pointer;border:0;background:rgba(0,0,0,.05);color:var(--zacht);white-space:nowrap;transition:background var(--soepel),color var(--soepel)}
.chip:hover{background:rgba(0,0,0,.09)}
.chip.aan{background:var(--accent);color:#fff}
.feit{display:inline-block;font-size:12px;padding:4px 10px;line-height:1.3;background:var(--vlak);color:var(--zacht);border-radius:var(--r-pil);white-space:nowrap}
.feit b{color:var(--inkt);font-weight:600}
.st{display:inline-block;font-size:11px;font-weight:500;padding:4px 10px;line-height:1.3;border-radius:var(--r-pil);white-space:nowrap}
.st.klaar{background:#DAEEDF;color:var(--goed)} .st.open{background:#FCE2CC;color:var(--let)} .st.mis{background:#FBE3E3;color:var(--signaal)} .st.nu{background:var(--navy);color:#fff}
.st.klein{font-size:10px;padding:2px 7px;margin-left:4px;vertical-align:1px}
details.uitklap summary{cursor:pointer;font-size:12.5px;color:var(--zacht);list-style:none;display:flex;align-items:center;gap:6px;padding:4px 0}
details.uitklap summary::-webkit-details-marker{display:none}
details.uitklap summary::before{content:"›";font-size:15px;line-height:1;color:var(--flauw);transition:transform var(--soepel)}
details.uitklap[open] summary::before{transform:rotate(90deg)}

/* ---------- zwevend keuzevenster ---------- */
.popknop{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:6px 11px;border:0;border-radius:var(--r-pil);background:rgba(0,0,0,.05);color:var(--zacht);cursor:pointer;white-space:nowrap;transition:background var(--soepel),color var(--soepel)}
.popknop:hover{background:var(--navy6);color:var(--inkt)}
.popknop.open{background:var(--navy);color:#fff}
.popknop.gekozen{background:var(--wit);color:var(--inkt);box-shadow:var(--schaduw)}
.popknop.gekozen.open{background:var(--navy);color:#fff;box-shadow:none}
.popknop .tel{font-size:10.5px;font-weight:700;background:var(--geel);color:#000;border-radius:var(--r-pil);padding:0 6px;line-height:16px}
.popknop svg{transition:transform var(--soepel)}
.popknop.open svg{transform:rotate(180deg)}
.popknop b{font-weight:600;color:var(--inkt)}
.popknop.open b{color:#fff}
.pop{position:fixed;z-index:80;background:#fff;border-radius:14px;padding:8px;min-width:200px;box-shadow:0 10px 40px rgba(37,39,58,.22),0 2px 6px rgba(37,39,58,.12);
  max-height:calc(100vh - 90px);overflow:auto;animation:popin 160ms cubic-bezier(.22,.61,.36,1) both;transform-origin:top left}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.pop .popkop{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--flauw);padding:4px 8px 6px;font-weight:600}
.popkeuze{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--inkt)}
.popkeuze:hover{background:var(--vlak)}
.popkeuze.aan{background:var(--accent-zacht);box-shadow:inset 3px 0 0 var(--geel);font-weight:600}
.popkeuze .bij{margin-left:auto;font-size:11.5px;color:var(--flauw);font-weight:400;font-variant-numeric:tabular-nums;padding-left:12px}
.popscheid{height:.5px;background:var(--lijn);margin:5px 4px}
.popnoot{font-size:11.5px;color:var(--flauw);padding:6px 10px 4px;line-height:1.45;max-width:280px}

/* ---------- vensters ---------- */
.venster{position:fixed;inset:0;background:rgba(37,39,58,.30);z-index:90;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.vdoos{background:var(--wit);border-radius:20px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--schaduw-op);overflow:hidden;animation:popin 180ms cubic-bezier(.22,.61,.36,1) both}
.vdoos.smal{width:min(430px,100%)} .vdoos.breed{width:min(980px,100%)}
.vkop{padding:20px 24px 4px}
.vkop h2{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.vkop p{margin:0;font-size:13px;color:var(--zacht);line-height:1.5}
.vlijf{padding:14px 24px;overflow:auto;flex:1}
.vvoet{display:flex;gap:9px;align-items:center;padding:13px 24px;border-top:.5px solid var(--lijn)}
.vvoet .rest{margin-left:auto;display:flex;gap:9px}
.vlijf.over{font-size:13px;line-height:1.55;padding-top:8px}
.vlijf.over h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--flauw);font-weight:600;margin:16px 0 6px}
.vlijf.over h3:first-child{margin-top:4px}
.vlijf.over p{margin:0}
.vlijf.over ul{margin:0;padding-left:18px}
.vlijf.over li{margin:3px 0}
.overtab{width:100%;border-collapse:collapse;font-size:12px}
.overtab td{padding:6px 10px 6px 0;border-bottom:.5px solid var(--lijn);vertical-align:top;color:var(--zacht)}
.overtab td:nth-child(2){color:var(--inkt)}

/* ---------- bezig ---------- */
.bezig{position:fixed;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;padding:20px;cursor:progress;background:rgba(37,39,58,.32);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:bzin .2s ease .3s both}
@keyframes bzin{from{opacity:0}to{opacity:1}}
.bzdoos{background:var(--wit);border-radius:18px;width:min(420px,100%);padding:20px 22px 18px;box-shadow:var(--schaduw-op);display:flex;gap:14px;align-items:flex-start}
.bzdraai{width:28px;height:28px;border-radius:50%;border:3px solid var(--xl-t);border-top-color:var(--xl);flex:0 0 auto;margin-top:1px;animation:bzdraai .8s linear infinite}
@keyframes bzdraai{to{transform:rotate(360deg)}}
.bztitel{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.bztekst{display:block;font-size:12.5px;color:var(--zacht);margin-top:3px}

/* ---------- hover-label ---------- */
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;line-height:1.45;padding:7px 10px 8px;border-radius:9px;
  box-shadow:0 6px 20px rgba(37,39,58,.28);max-width:320px;white-space:normal;min-width:170px}
.tip b{font-weight:600}
.tip .tz{color:#C9CAD1}
.tip .tr{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .tr i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.tip .tsep{border-top:1px solid rgba(255,255,255,.14);margin:4px 0}
[data-tip]{cursor:default}

/* ---------- melding & slepen ---------- */
#melding{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;
  opacity:0;transition:all var(--soepel);z-index:95;pointer-events:none;box-shadow:var(--schaduw-op)}
#melding.aan{opacity:1;transform:translate(-50%,0)}
#sleepvlak{position:fixed;inset:0;z-index:100;background:rgba(220,239,227,.88);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity var(--soepel);border:3px solid var(--xl)}
#sleepvlak.aan{opacity:1}
#sleepvlak .sd{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
#sleepvlak b{font-size:18px;font-weight:600;letter-spacing:-.018em}
#sleepvlak span{font-size:13px;color:var(--xl-d)}
.pijlop{width:52px;height:52px;border-radius:50%;background:var(--xl);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(16,124,65,.35)}

/* =====================================================================
   DATA
   ===================================================================== */
.xlik{display:block;flex:0 0 auto}
.dataintro{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.dataintro h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.022em}
.dataintro p{margin:3px 0 0;color:var(--zacht);font-size:13px;max-width:760px}
.dataintro p b{color:var(--inkt);font-weight:600}
.dataintro .rechtsin{margin-left:auto;display:flex;gap:8px}
.datavak{position:relative;background:var(--wit);border-radius:var(--r-groot);box-shadow:var(--schaduw);min-width:0;transition:box-shadow var(--soepel)}
.datavak.leeg{padding:18px}
.vakdrop{border:1.5px dashed #A9D1B9;background:var(--xl-l);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:36px 24px;text-align:center;min-height:300px;cursor:pointer;outline:0;
  transition:border-color var(--soepel),background var(--soepel),box-shadow var(--soepel)}
.vakdrop:hover{border-color:#8CC3A2;background:#EEF7F1}
.vakdrop:focus-visible{box-shadow:0 0 0 3px var(--accent-zacht),0 0 0 1px var(--accent)}
.vakdrop.doel{border:2px solid var(--xl);background:#DCEFE3}
.vakdrop .sd{display:flex;flex-direction:column;align-items:center;gap:5px}
.vakdrop b{font-size:18px;font-weight:600;margin-top:14px;letter-spacing:-.018em}
.vakdrop .sub{font-size:13px;color:var(--zacht);max-width:500px;line-height:1.5}
.vakdrop .fmt{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.vakdrop .fmt span{font:600 10.5px ui-monospace,Menlo,Consolas,monospace;color:var(--xl-d);background:#fff;border:1px solid var(--xl-r);border-radius:5px;padding:2px 6px}
.vakdrop .knoppen{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.vakdrop .plak{font-size:12px;color:var(--flauw);margin-top:8px}
.vakhints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.vakhint{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--vlak)}
.vakhint .ti{width:30px;height:30px;border-radius:8px;background:var(--wit);display:flex;align-items:center;justify-content:center;color:var(--zacht);flex:0 0 auto;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.vakhint .tt{display:block;font-size:13px;font-weight:600}
.vakhint .ts{display:block;font-size:12px;color:var(--zacht);line-height:1.45;margin-top:2px}
.vakkop{display:flex;align-items:center;gap:13px;padding:16px 16px 0 18px;min-width:0}
.vakkop .vkt{min-width:0;flex:1 1 auto}
.vakkop .nm{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.vakkop .mt{display:block;font-size:12px;color:var(--zacht);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vakkop .vkacties{margin-left:auto;display:flex;gap:6px;align-items:center;flex:0 0 auto}
.vakbladen{display:flex;align-items:flex-end;padding:12px 18px 0;min-width:0;overflow:hidden;border-bottom:1px solid #E3E3E7}
.bronblad{display:flex;align-items:center;gap:6px;padding:6px 12px 7px;font-size:12px;color:var(--flauw);background:#F6F6F7;border:1px solid #E3E3E7;border-bottom:0;margin:0 -1px -1px 0;
  border-radius:7px 7px 0 0;position:relative;white-space:nowrap;flex:0 0 auto}
.bronblad.ja{background:#fff;color:var(--xl-d);font-weight:600;padding-bottom:8px;border-bottom:1px solid #fff;z-index:1}
.bronblad.ja svg{color:var(--goed)}
.bronblad.ja::after{content:"";position:absolute;left:9px;right:9px;bottom:3px;height:2px;border-radius:1px;background:var(--xl)}
.bronniet{font-size:11.5px;color:var(--flauw);padding:0 0 8px 10px;white-space:nowrap}
.vakdelen{padding:8px 18px 6px}
.vakdeel{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:10px 0;min-width:0}
.vakdeel .dikoon{width:40px;height:40px;border-radius:11px;background:var(--geel);color:var(--navy);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.vakdeel.leeg .dikoon{background:var(--vlak);color:var(--flauw)}
.vakdeel .dtekst{min-width:0}
.vakdeel .dtitel{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:-.01em;line-height:1.3;flex-wrap:wrap}
.vakdeel .dtitel code{font:600 11px ui-monospace,Menlo,Consolas,monospace;background:var(--vlak);color:var(--zacht);padding:2px 6px;border-radius:5px;letter-spacing:0}
.vakdeel .dbron{font-size:12.5px;color:var(--zacht);margin-top:2px;line-height:1.45}
.vakdeel .dbron b{color:var(--inkt);font-weight:600}
.vakdeel .dcijfers{display:grid;grid-template-columns:repeat(3,128px);gap:4px 18px}
.vakdeel .dcijfers .cg{display:block;font-size:20px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.vakdeel .dcijfers .cg small{font-size:13px;color:var(--flauw);font-weight:500;margin-left:1px;letter-spacing:0}
.vakdeel .dcijfers .cl{display:block;font-size:11.5px;color:var(--zacht);white-space:nowrap}
.vakdeel .dknoppen{display:flex;gap:2px;justify-self:end}
.sstip{flex:0 0 auto;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 10.5px/1 -apple-system,system-ui,sans-serif;color:#fff}
.sstip.ok{background:var(--goed)} .sstip.let{background:#E07B00}
.vakkoppel{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;align-items:center;min-height:24px}
.vakkoppel .klijn{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center}
.vakkoppel .klijn::before{content:"";position:absolute;left:50%;top:-12px;bottom:-12px;border-left:1.5px dashed var(--navy4);transform:translateX(-50%)}
.vakkoppel.vol .klijn::before{border-left:2px solid var(--xl)}
.vakkoppel.let .klijn::before{border-left:2px solid #E07B00}
.vakkoppel .kring{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;border:0;padding:0;background:var(--wit);box-shadow:0 0 0 3px var(--wit),0 1px 4px rgba(0,0,0,.16);
  display:flex;align-items:center;justify-content:center;color:var(--flauw);font:700 12px/1 -apple-system,system-ui,sans-serif}
.vakkoppel.vol .kring{background:var(--xl);color:#fff;box-shadow:0 0 0 3px var(--wit)}
.vakkoppel.let .kring{background:#E07B00;color:#fff;box-shadow:0 0 0 3px var(--wit);cursor:pointer}
.vakkoppel .ktekst{font-size:12.5px;color:var(--zacht);line-height:1.4}
.vakkoppel .ktekst b{color:var(--inkt);font-weight:600}
.vakvoorbeeld{margin:4px 18px 0;padding:12px 0 16px;border-top:1px solid var(--lijn)}
.vbkop{display:flex;align-items:center;gap:8px 12px;margin-bottom:10px;min-height:26px;flex-wrap:wrap}
.vbkop .vbl{font-size:11.5px;font-weight:600;color:var(--flauw);letter-spacing:.05em;text-transform:uppercase}
.vbkop .lnk{margin-left:auto}
.vbvoet{font-size:12px;color:var(--zacht);margin-top:8px}
.slottab{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1px var(--xl-r);table-layout:fixed}
.slottab th{background:var(--xl-t);color:var(--xl-d);font-weight:600;text-align:left;padding:6px 10px;border-bottom:1.5px solid var(--xl);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slottab td{padding:5.5px 10px;white-space:nowrap;border-bottom:1px solid #E7F0EA;overflow:hidden;text-overflow:ellipsis}
.slottab tr:last-child td{border-bottom:0}
.slottab tbody tr:nth-child(even) td{background:var(--xl-l)}
.slottab .g{text-align:right;font-variant-numeric:tabular-nums}
.dataonder{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;margin-top:14px;align-items:start}
.checkpaneel .paneelkop{padding-bottom:10px;flex-wrap:wrap}
.checkpaneel .aantal{display:flex;gap:6px;flex-wrap:wrap}
.cchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1.3;padding:3.5px 10px;border-radius:980px;background:var(--vlak);color:var(--inkt);white-space:nowrap}
.cchip.ok{background:var(--xl-t);color:var(--xl-d)} .cchip.let{background:var(--let-t);color:#8A3E00} .cchip.mis{background:#FBE3E3;color:#A11318}
.checkpunten{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px}
.cpunt{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;background:var(--let-t);border-radius:10px;padding:9px 12px}
.cpunt .dci{width:16px;height:16px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;margin-top:1px;font-size:10px;font-weight:700;background:#E07B00;color:#fff}
.cpunt b{font-weight:600}
.cpunt .meer,.datacheck .meer,.vakkoppel .meer{display:inline;color:var(--zacht);cursor:pointer;text-decoration:underline;text-decoration-color:var(--navy5);text-underline-offset:2px;border:0;background:none;padding:0;font:inherit;margin-left:4px}
.cpunt .meer:hover,.datacheck .meer:hover,.vakkoppel .meer:hover{color:var(--inkt);text-decoration-color:var(--inkt)}
.cgoed{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--xl-d);background:var(--xl-l);border-radius:10px;padding:9px 12px}
.datacheck{padding:0 16px 14px}
.datacheck ul{list-style:none;margin:0;padding:10px 12px;background:var(--vlak);border-radius:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:6px 18px;font-size:12px;color:var(--inkt)}
.datacheck li{display:flex;gap:7px;align-items:flex-start;line-height:1.45}
.datacheck em{font-style:normal;color:var(--flauw)}
.datacheck .dci{width:15px;height:15px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;margin-top:1px;font-size:10px;font-weight:700}
.datacheck li.ok .dci{background:#E4F2E8;color:var(--goed)}
.datacheck li.let .dci{background:#FFF1D6;color:#8A4B00}
.datacheck li.info .dci{background:var(--navy6);color:var(--zacht)}
.snelrapport{padding:16px 18px 15px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--schaduw),inset 4px 0 0 var(--geel)}
.snelrapport .srkop{display:flex;gap:14px;align-items:center;min-width:0}
.snelrapport .srikoon{width:34px;height:34px;border-radius:10px;background:var(--geel);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.snelrapport h2{margin:1px 0 1px;font-size:14.5px;font-weight:600}
.snelrapport .srsub{font-size:12.5px;color:var(--zacht);line-height:1.45}
.snelrapport .srkort{display:flex;flex-wrap:wrap;gap:6px}
.snelrapport .srkort .keuze{font-size:12px;padding:4.5px 11px}
.snelrapport .srlet{font-size:12px;color:var(--let);line-height:1.6}
.snelrapport .srlet .meer{color:var(--let);cursor:pointer;text-decoration:underline;text-underline-offset:2px;border:0;background:none;padding:0;font:inherit;font-weight:500;margin-left:4px}
.snelrapport .srknoppen{display:flex;align-items:center;gap:8px}
.snelrapport .srknoppen .rest{margin-left:auto;display:flex;gap:8px}

/* =====================================================================
   OVERZICHT EN DE ANDERE STAPPEN
   ===================================================================== */
.ovkop{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.ovkop h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.022em}
.ovkop p{margin:3px 0 0;color:var(--zacht);font-size:13px;max-width:880px;line-height:1.5}
.ovkop p b{color:var(--inkt);font-weight:600}
.ovkop .rechtsin{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filterbalk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filterbalk .scheid{width:1px;height:20px;background:var(--lijn-sterk);margin:0 2px}
.filterbalk .rechts{margin-left:auto;display:flex;gap:6px;align-items:center}
.filterbalk .noot{font-size:12px;color:var(--zacht)}
.btpil{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;padding:6px 12px 6px 10px;border-radius:var(--r-pil);background:var(--wit);box-shadow:var(--schaduw);color:var(--inkt);border:0;cursor:pointer;white-space:nowrap}
.btpil .stip{width:8px;height:8px;border-radius:50%;background:var(--navy4);flex:0 0 auto}
.btpil.aan .stip{background:var(--data1);box-shadow:0 0 0 3px rgba(0,138,156,.18)}
.btpil small{color:var(--flauw);font-weight:400;font-size:12px}
.tegels{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tegel{background:var(--wit);border-radius:14px;box-shadow:var(--schaduw);padding:13px 16px 13px;min-width:0;position:relative}
.tegel .tl{font-size:12px;color:var(--zacht);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tegel .tw{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.2;margin:5px 0 7px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tegel .tw small{font-size:13px;font-weight:500;color:var(--zacht);letter-spacing:0;margin-left:2px}
.tegel .ts{font-size:11.5px;color:var(--flauw);display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:20px}
.tegel.hoofd::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--geel)}
.tegel.nu{box-shadow:var(--schaduw),inset 0 3px 0 var(--geel)}
.tegel.klik{cursor:pointer;transition:box-shadow var(--soepel)}
.tegel.klik:hover{box-shadow:var(--schaduw-op)}
.tegel.nu.klik:hover{box-shadow:var(--schaduw-op),inset 0 3px 0 var(--geel)}
.dchip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--vlak);color:var(--inkt);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.35}
.dchip svg{display:block}
.dchip.nul{color:var(--zacht);font-weight:500}
.dchip.let{background:var(--let-t);color:#8A3E00}
.dchip.mis{background:#FBE3E3;color:#A11318}
.dchip.goed{background:var(--xl-t);color:var(--xl-d)}
.kaartraster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start;grid-auto-flow:row dense}
.grafkaart{background:var(--wit);border-radius:var(--r-groot);box-shadow:var(--schaduw);display:flex;flex-direction:column;min-width:0}
.grafkaart.breed{grid-column:1/-1}
.gkop{display:flex;align-items:flex-start;gap:10px;padding:15px 16px 6px;flex-wrap:wrap}
.gkop h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.gkop .gsub{font-size:12px;color:var(--flauw);margin-top:2px}
.gkop .rechtsin{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grafvak{padding:4px 16px 8px;min-height:40px;position:relative}
.grafvak svg{display:block;overflow:visible}
.grafvak svg text{font-family:inherit;font-variant-numeric:tabular-nums}
.legenda{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11.5px;color:var(--zacht);padding:2px 16px 6px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legenda i.tick{width:3px;height:13px;border-radius:1px}
.legenda i.ring{border-radius:50%;width:10px;height:10px;box-shadow:inset 0 0 0 2px var(--vorig);background:#fff}
.legenda i.punt{border-radius:50%}
.legenda i.lijn{width:14px;height:2.5px;border-radius:2px}
.legenda i.streep{width:14px;height:0;border-top:2px dashed var(--vorig);border-radius:0}
.legenda i.arceer{background:repeating-linear-gradient(135deg,var(--data1-licht) 0 2px,var(--data1) 2px 3.5px)}
.gnoot{font-size:11.5px;color:var(--flauw);padding:2px 16px 14px;line-height:1.5}
.gnoot b{color:var(--zacht);font-weight:600}
.gleeg{padding:22px 16px 26px;font-size:12.5px;color:var(--flauw);text-align:center}
.mtabel{width:100%;border-collapse:collapse;font-size:12px;margin:2px 0 4px}
.mtabelvak{padding:0 16px 12px;overflow-x:auto}
.mtabel th{font-size:11px;font-weight:600;color:var(--flauw);text-align:right;padding:6px 8px;border-bottom:1px solid var(--lijn-sterk);white-space:nowrap}
.mtabel th:first-child,.mtabel td:first-child{text-align:left;padding-left:0}
.mtabel th:last-child,.mtabel td:last-child{padding-right:0}
.mtabel td{padding:6px 8px;border-bottom:.5px solid var(--lijn);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mtabel td.z{color:var(--zacht)}
.mtabel td.t,.mtabel th.t{text-align:left;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.mtabel tr.tot td{font-weight:600;border-top:1px solid var(--navy);border-bottom:0;background:var(--room)}
.mtabel tr.gk td{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--inkt);font-weight:700;padding-top:14px;border-bottom:1px solid var(--navy);text-align:left}
.mtabel tbody tr.klik{cursor:pointer}
.mtabel tbody tr.klik:hover td{background:#FBFAF7}
.mtabel tbody tr.gekozen td{background:#FFFBEA}
.mtabel tbody tr.gekozen td:first-child{box-shadow:inset 3px 0 0 var(--geel);padding-left:8px}
.mtabel th.nu,.mtabel td.nu{background:#FBF9F6}
.mtabel th.nu{color:var(--inkt);box-shadow:inset 0 3px 0 var(--geel)}
.mtabel td.toek{color:var(--flauw)}
.mtabel tr.dik td{font-weight:600}
.neg{color:var(--signaal)} .pos{color:var(--goed)}
.pct{display:inline-block;min-width:40px;text-align:right;font-weight:600}
.pct.goed{color:var(--goed)} .pct.let{color:var(--let)} .pct.slecht{color:var(--signaal)}

/* jaarbalk: gefactureerd | nog te factureren | nog te vinden, tegen de forecast */
.jaarbalk{position:relative;margin:22px 16px 4px}
.jbspoor{height:14px;border-radius:7px;background:var(--vlak);display:flex;overflow:hidden;gap:2px}
.jbspoor .seg{height:100%}
.jbspoor .gat{background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(37,39,58,.08) 4px 6px)}
.jbmarker{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--vorig);border-radius:2px}
.jbmarker span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--zacht);white-space:nowrap;font-weight:500}
.jbschaal{display:flex;justify-content:space-between;font-size:11px;color:var(--flauw);margin:6px 16px 0}
.jblegenda{display:flex;gap:6px 16px;flex-wrap:wrap;margin:10px 16px 0;font-size:12px;color:var(--zacht)}
.jblegenda b{color:var(--inkt);font-weight:600;font-variant-numeric:tabular-nums}
.jblegenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* aandachtspunten */
.aandacht{list-style:none;margin:0;padding:0 16px 14px}
.aandacht li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:.5px solid var(--lijn);font-size:12.5px;line-height:1.5}
.aandacht li:first-child{border-top:0}
.aandacht .ai{width:22px;height:22px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--vlak);color:var(--zacht);margin-top:-1px}
.aandacht .ai svg{display:block}
.aandacht .ai.let{background:#FFF1D6;color:#8A4B00}
.aandacht .ai.slecht{background:#FBE3E3;color:#A11318}
.aandacht .ai.goed{background:var(--xl-t);color:var(--xl-d)}
.aandacht .at{flex:1;min-width:0}
.aandacht .at b{font-weight:600}
.aandacht a{color:var(--inkt);font-weight:500;cursor:pointer;text-decoration:underline;text-decoration-color:var(--navy5);text-underline-offset:2px;white-space:nowrap}
.aandacht a:hover{text-decoration-color:var(--inkt)}
.aandacht .az{display:block;color:var(--flauw);font-size:11.5px}
.meerrij{padding:0 16px 14px}

/* staven: horizontale balken met waarde rechts */
.staven{display:flex;flex-direction:column;padding:2px 16px 10px}
.staaf{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) minmax(112px,max-content);gap:12px;align-items:center;padding:5px 6px;margin:0 -6px;border-radius:8px}
.staaf.klik{cursor:pointer}
.staaf.klik:hover{background:#FBFAF7}
.staaf.gekozen{background:#FFFBEA;box-shadow:inset 3px 0 0 var(--geel)}
.staaf .sn{font-size:12.5px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--inkt)}
.staaf .sn small{display:block;font-size:11px;color:var(--flauw)}
.staaf .ss{height:12px;display:flex;gap:2px;position:relative}
.staaf .ss>div{height:100%}
.staaf .ss>div:last-of-type{border-radius:0 3px 3px 0}
.staaf .ss .mk{position:absolute;top:-4px;bottom:-4px;width:2.5px;border-radius:1.5px;background:var(--vorig);box-shadow:0 0 0 1px #fff}
.staaf .sw{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.staaf .sw span{font-weight:500;color:var(--flauw);margin-left:6px}
.staaf.klik:focus-visible{outline:2px solid var(--accent);outline-offset:0}

/* kleine grafieken per team */
.veelvoud{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:2px 16px 16px}
.vv{border-radius:12px;background:#FBFAF8;padding:11px 12px 4px;box-shadow:inset 0 0 0 .5px var(--lijn)}
.vv.gekozen{box-shadow:inset 0 0 0 1.5px var(--navy)}
.vv h3{font-size:12.5px;font-weight:600;margin:0;display:flex;justify-content:space-between;gap:8px}
.vv h3 span{font-weight:500;color:var(--zacht);font-variant-numeric:tabular-nums}

/* tabelpaneel met vaste kop en rijnummer */
.tabelpaneel{overflow:hidden;display:flex;flex-direction:column}
.objbalk{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:.5px solid var(--lijn);flex-wrap:wrap}
.objbalk .tel{font-size:12px;color:var(--flauw);margin-left:auto;white-space:nowrap}
.zoekvak{position:relative}
.zoekvak .loep{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--flauw);pointer-events:none}
.zoekvak input{width:100%;font-size:13.5px;padding:8px 11px 8px 32px;border:0;border-radius:var(--r-klein);background:var(--vlak);outline:0;transition:background var(--soepel),box-shadow var(--soepel)}
.zoekvak input:focus{background:var(--wit);box-shadow:0 0 0 3px var(--accent-zacht),0 0 0 1px var(--accent)}
.objbalk .zoekvak{flex:1 1 180px;max-width:280px}
.tabelscroll{overflow:auto;scrollbar-width:auto}
.tabelscroll.vol{height:calc(100vh - var(--kophoogte) - 262px);min-height:320px}
.lijstuitleg{font-size:12px;color:var(--zacht);padding:8px 14px;border-bottom:.5px solid var(--lijn);background:#FCFCFC}
.tabelscroll::-webkit-scrollbar{height:12px;width:12px}
.tabelscroll::-webkit-scrollbar-thumb{background:var(--navy5);border-radius:10px;border:3px solid var(--wit)}
.tabelscroll::-webkit-scrollbar-track{background:var(--vlak)}
.datatabel{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.datatabel th{position:sticky;top:0;z-index:2;background:#FAFAFB;text-align:left;font-weight:600;color:var(--zacht);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--lijn);white-space:nowrap;cursor:pointer;user-select:none}
.datatabel th:hover{color:var(--inkt)}
.datatabel th.r,.datatabel td.r{text-align:right}
.datatabel th .pijl{color:var(--flauw);margin-left:4px}
.datatabel td{padding:6px 10px;border-bottom:.5px solid var(--lijn);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.datatabel td.r{font-variant-numeric:tabular-nums}
.datatabel tr:hover td{background:#FBFAF7}
.datatabel .nr{position:sticky;left:0;z-index:1;background:#FAFAFB;color:var(--flauw);text-align:right;font-variant-numeric:tabular-nums;border-right:.5px solid var(--lijn)}
.datatabel th.nr{z-index:3}
.datatabel td.uit b{color:var(--flauw);font-weight:400;text-decoration:line-through}
.stc{display:inline-flex;align-items:center;gap:6px}
.stc i{width:8px;height:8px;border-radius:2px;display:block;flex:0 0 auto}
.opm{display:inline-block;font-size:11px;padding:1px 7px;border-radius:var(--r-pil);background:var(--let-t);color:#8A3E00;font-weight:500;margin:1px 2px 1px 0;white-space:nowrap}
.opm.zwaar{background:#FBE3E3;color:#A11318}
.meer{display:flex;justify-content:center;padding:12px;gap:8px;align-items:center;font-size:12px;color:var(--flauw)}
.leegtabel{padding:40px 20px;text-align:center;color:var(--flauw);font-size:13px}
.wijzstrip{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin:0 0 14px;padding:10px 14px;background:var(--wit);border-radius:12px;box-shadow:var(--schaduw);font-size:12.5px;color:var(--zacht)}
.wijzstrip b{color:var(--inkt);font-weight:600}
.wijzstrip .wk{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--flauw)}
.wijzstrip .alink{margin-left:auto;color:var(--inkt);font-weight:500}

/* =====================================================================
   RAPPORT
   ===================================================================== */
#s-rapport{height:calc(100vh - var(--kophoogte));min-height:520px}
.studio{display:grid;grid-template-columns:350px minmax(0,1fr);flex:1;min-height:0}
.stkeuzes{overflow:auto;padding:20px 20px 16px;border-right:.5px solid var(--lijn);background:#FCFCFC}
.stkop h2{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.stkop p{margin:0 0 6px;font-size:12.5px;color:var(--zacht);line-height:1.5}
.stgroep{padding:14px 0;border-top:.5px solid var(--lijn)}
.stgroep:first-of-type{border-top:0}
.stlabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--flauw);font-weight:600;margin-bottom:9px}
.stkeuzes .vld{margin-bottom:10px}
.profielen{display:grid;grid-template-columns:1fr;gap:6px}
.profiel{text-align:left;border:0;background:var(--wit);box-shadow:inset 0 0 0 1px var(--lijn);border-radius:10px;padding:8px 10px 9px;cursor:pointer;min-width:0;transition:box-shadow var(--soepel),background var(--soepel)}
.profiel b{font-size:12.5px;display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profiel span{font-size:11px;color:var(--flauw);line-height:1.3;display:block}
.profiel:hover{box-shadow:inset 0 0 0 1px var(--zacht)}
.profiel.aan{box-shadow:inset 0 0 0 2px var(--navy);background:#FFFDF0}
.pvink{display:flex;gap:10px;align-items:flex-start;padding:6px 6px;margin:0 -6px;border-radius:8px;cursor:pointer;font-size:13px}
.pvink:hover{background:var(--vlak)}
.pvink input{margin:2px 0 0;accent-color:var(--navy);width:15px;height:15px;flex:0 0 auto}
.pvink b{display:block;font-weight:500}
.pvink em{display:block;font-style:normal;font-size:11.5px;color:var(--flauw);line-height:1.4}
.pvink.uit{opacity:.5;cursor:not-allowed}
.sttegels{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sttegel{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;cursor:pointer;padding:8px 9px 9px;border-radius:11px;background:var(--wit);box-shadow:inset 0 0 0 1px var(--lijn);transition:box-shadow var(--soepel),background var(--soepel)}
.sttegel svg{width:100%;height:auto;max-height:52px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px #EEF0F3;margin-bottom:5px}
.sttegel b{font-size:12.5px;font-weight:600;color:var(--inkt)}
.sttegel span{font-size:11px;color:var(--flauw);line-height:1.3}
.sttegel:hover{box-shadow:inset 0 0 0 1px var(--zacht)}
.sttegel.aan{box-shadow:inset 0 0 0 2px var(--navy);background:#FFFDF0}
.stsub{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.stsub>span{font-size:12px;font-weight:500;color:var(--zacht)}
.stsub select.invoer{padding:7px 10px}
.sthint{font-size:11.5px;color:var(--flauw);line-height:1.45}
.stlabel .optioneel{font-weight:500;text-transform:none;letter-spacing:0}
.stgroep.laatst{padding-top:12px}
.sttekst{width:100%;min-height:96px;resize:vertical;line-height:1.45;font-size:13px}
.stvoorbeeld{display:flex;flex-direction:column;min-width:0;min-height:0;background:#E7E2DD}
.stbalk{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--wit);border-bottom:.5px solid var(--lijn)}
.stbalk .stinfo{font-size:12px;color:var(--zacht)}
.stbalk .stinfo b{color:var(--inkt);font-weight:600}
.stbalk .rest{margin-left:auto;display:flex;gap:8px;align-items:center}
.stdoek{flex:1;min-height:0;overflow:auto;position:relative}
.stschaal{position:relative;margin:0 auto;overflow:hidden}
.stdoek iframe{border:0;display:block;background:#E7E2DD}
.stdoek .laden{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--zacht);pointer-events:none}

/* =====================================================================
   FOUTZOEKER: inklapbaar terminalvenster op de Data-stap
   ===================================================================== */
.foutzoeker{margin-top:14px;overflow:hidden}
.fzkop{display:flex;align-items:center;gap:13px;padding:13px 16px;cursor:pointer;border-radius:var(--r-groot);outline:0}
.fzkop:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.fzkop:hover .fzknop{background:var(--accent-zacht);color:var(--accent)}
.fzik{width:34px;height:34px;border-radius:10px;background:#1C1D29;color:var(--geel);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.fzik svg{display:block}
.fztekst{min-width:0}
.fzkop h2{margin:0;font-size:14.5px;font-weight:600}
.fzsub{font-size:12.5px;color:var(--zacht);line-height:1.45;margin-top:1px}
.fzkop .rechtsin{margin-left:auto;display:flex;gap:8px;align-items:center;flex:0 0 auto}
.fzchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fzknop{display:inline-block}
.fzbalk{display:flex;align-items:center;gap:8px 14px;padding:0 16px 10px;flex-wrap:wrap}
.fzbalk .rest{margin-left:auto;display:flex;gap:8px}
.fzvink{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--zacht);cursor:pointer;user-select:none}
.fzvink input{accent-color:var(--navy);width:15px;height:15px;margin:0}
.term{margin:0 16px;border-radius:12px;background:#1C1D29;color:#D7D8DE;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.term .tkop{display:flex;align-items:center;gap:7px;padding:9px 12px;background:#25273A;border-bottom:1px solid rgba(255,255,255,.06);font:500 11.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color:#92939C}
.term .tkop i{width:10px;height:10px;border-radius:50%;background:#3B3D52;display:block;flex:0 0 auto}
.term .tkop i:first-child{background:var(--geel)}
.term .tkop span{margin-left:6px;white-space:nowrap}
.term .tkop .trechts{margin-left:auto;overflow:hidden;text-overflow:ellipsis}
.term pre{margin:0;padding:10px 14px 14px;max-height:480px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre-wrap;word-break:break-word;tab-size:4;outline:0}
.term pre:focus-visible{box-shadow:inset 0 0 0 2px rgba(255,223,0,.5)}
.term .tk{color:var(--geel);font-weight:600}
.term .t-titel{color:#fff;font-weight:600}
.term .t-ok{color:#7BD88F}
.term .t-let{color:#FFB35C}
.term .t-fout{color:#FF8A80}
.term .t-info{color:#D7D8DE}
.term .t-sub{color:#A9ABB8}
.term .t-zacht{color:#7D7F8F}
.term pre::-webkit-scrollbar{width:10px;height:10px}
.term pre::-webkit-scrollbar-thumb{background:#3B3D52;border-radius:8px;border:2px solid #1C1D29}
.term pre::-webkit-scrollbar-track{background:transparent}
.term .tprompt{display:flex;align-items:center;gap:9px;padding:9px 14px;border-top:1px solid rgba(255,255,255,.07);background:#202131;cursor:text}
.term .tprompt span{color:var(--geel);font:700 14px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.term .tprompt input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:2px 0;color:#fff;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;caret-color:var(--geel)}
.term .tprompt input::placeholder{color:#6B6D80}
.fznoot{font-size:11.5px;color:var(--flauw);padding:10px 16px 14px;line-height:1.5}
.fznoot b{color:var(--zacht);font-weight:600}
.paneel.kapot{padding:18px 20px;box-shadow:var(--schaduw),inset 4px 0 0 var(--signaal);margin-bottom:14px}
.paneel.kapot h2{margin:0 0 4px;font-size:15px;font-weight:600}
.paneel.kapot p{margin:0 0 12px;color:var(--zacht);font-size:13px;max-width:640px}
@media(max-width:620px){
  .fzkop{flex-wrap:wrap}
  .fzkop .rechtsin{margin-left:47px}
  .fzbalk .rest{margin-left:0;width:100%}
  .term{margin:0 10px}
  .term pre{font-size:11px;max-height:400px}
}

/* ---------- smal scherm ---------- */
@media(max-width:1180px){.dataonder{grid-template-columns:minmax(0,1fr)}.bronniet{display:none}.vakdeel .dcijfers{grid-template-columns:repeat(3,108px);gap:4px 12px}}
@media(max-width:1100px){.kopcontext{display:none}}
@media(max-width:960px){
  .kaartraster{grid-template-columns:1fr}
  .vakhints{grid-template-columns:1fr}
  .vakdeel{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"ik tekst knop" ". cijfers cijfers"}
  .vakdeel .dikoon{grid-area:ik}.vakdeel .dtekst{grid-area:tekst}.vakdeel .dcijfers{grid-area:cijfers}.vakdeel .dknoppen{grid-area:knop}
  .vakdeel .dcijfers{grid-template-columns:repeat(3,minmax(0,150px));gap:4px 16px}
  #s-rapport{height:auto}
  .studio{grid-template-columns:1fr;grid-template-rows:auto 80vh}
  .stkeuzes{border-right:0;border-bottom:.5px solid var(--lijn)}
  .stand{display:none}
}
@media(max-width:620px){
  .merk .woord{display:none}
  .datavak.leeg{padding:12px}
  .vakdrop{min-height:240px;padding:26px 16px}
  .vakkop{padding:14px 12px 0 14px;flex-wrap:wrap}
  .vakbladen{padding:10px 12px 0}
  .bronblad:not(.ja){display:none}
  .bronniet{display:inline}
  .vakdelen{padding:6px 12px 4px}
  .vakvoorbeeld{margin:4px 12px 0}
  .vakdeel .dcijfers{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 10px}
  .vakdeel .dcijfers .cg{font-size:18px}
  .slottab .n3{display:none}
  .tegels{grid-template-columns:1fr 1fr}
  .staaf{grid-template-columns:90px minmax(0,1fr) 92px;gap:8px}
  .blad{padding:14px 12px 20px}
  .voetbinnen{padding:10px 12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .kop,.voetbalk,.filterbalk .rechts,.ovkop .rechtsin,#sleepvlak,#melding{display:none!important}
  body{background:#fff}
  .grafkaart,.tegel,.paneel{box-shadow:none;border:.5px solid var(--lijn-sterk);break-inside:avoid}
}

/* Optisch centreren op kapitaalhoogte waar de browser dat kan (Chrome/Edge 133+,
   Safari 18.2+). De hoogte zetten we dan zelf via de padding; een browser zonder
   ondersteuning houdt de regels hierboven. */
@supports (text-box:trim-both cap alphabetic){
  .bn,.feit,.st,.mini,.chip,.keuze,.segment button,.popknop>span,.stappen button>span:not(.stapvink),.k>span,.k:not(:has(svg)),.popknop .tel,.dchip,.cchip,.opm,.btpil>span{text-box:trim-both cap alphabetic}
  .feit{padding:calc((24px - .7em) / 2) 10px}
  .st{padding:calc((22px - .7em) / 2) 10px}
  .st.klein{padding:calc((17px - .7em) / 2) 7px}
  .mini{padding:calc((25px - .7em) / 2) 11px}
  .chip{padding:calc((27px - .7em) / 2) 11px}
  .keuze{padding:calc((35px - 2px - .7em) / 2) 14px}
  .snelrapport .srkort .keuze{padding:calc((29px - 2px - .7em) / 2) 11px}
  .segment button{padding:calc((27px - .7em) / 2) 12px}
  .segment.klein button{padding:calc((23px - .7em) / 2) 9px}
  .popknop{height:31px;padding:0 12px}
  .popknop .tel{min-width:17px;text-align:center;padding:calc((17px - .7em) / 2) 5px}
  .stappen button{height:27px;padding:0 12px}
  .k{min-height:34px;justify-content:center}
  .k:not(:has(svg)){display:inline-block;text-align:center;padding:calc((34px - .7em) / 2) 15px}
  .k.cta{min-height:40px}
  .dchip{padding:calc((20px - .7em) / 2) 7px}
  .cchip{padding:calc((24px - .7em) / 2) 10px}
  .opm{padding:calc((18px - .7em) / 2) 7px}
  .btpil{height:31px;padding:0 12px 0 10px}
}
</style>
</head>
<body>

<!-- ============================ KOP ============================ -->
<header class="kop"><div class="kopbinnen">
  <button class="merk" id="knopMerk" title="Naar de data"><span class="vlag"><svg viewBox="0 0 100 100"><title>Savills</title><g fill="none"><path fill="#fede07" d="M100 0H0v100h100z"/><path d="M14.576 93.633c-5.114 0-8.582-2.62-8.582-7.485v-.187H8.8v.125c0 3.18 2.307 5.052 5.8 5.052 1.871 0 5.426-.81 5.426-3.804 0-5.801-13.347-1.685-13.347-9.98 0-4.18 3.892-6.05 7.759-6.05 4.553 0 7.646 2.62 7.646 6.86v.188H19.28v-.187c0-2.745-1.933-4.366-5.052-4.366-2.183 0-4.74.936-4.74 3.43 0 5.426 13.347 1.622 13.347 9.98 0 4.428-4.14 6.424-8.257 6.424M38.8 82.032c-.435.374-1.496.562-2.058.624l-1.995.25c-3.743.436-7.235 1.184-7.235 4.428 0 2.682 2.307 3.804 4.365 3.804 2.121 0 3.992-.748 5.302-2.058 1.06-1.123 1.622-2.62 1.622-4.241v-2.807zm.5 10.977c-.313-1.123-.313-3.368-.313-3.368-1.06 2.308-3.492 3.992-7.296 3.992-4.366 0-6.986-2.37-6.986-6.237 0-5.614 5.051-6.176 9.98-6.736l1.06-.125c1.995-.25 3.056-.5 3.056-2.683 0-2.807-1.622-4.054-5.114-4.054-2.932 0-5.302 1.247-5.302 4.429v.187h-2.807v-.187c0-4.927 3.93-6.923 8.42-6.923 4.865 0 7.66 1.933 7.66 6.486v11.477c0 .998.176 3.12.426 3.742h-2.785zm20.644-21.082h.25L52.96 93.009h-3.056l-7.486-21.082h3.255l5.79 17.864 5.729-17.864zm5.022-5.549A1.971 1.971 0 0 0 63 64.413c-1.048 0-1.965.851-1.965 1.899A1.97 1.97 0 0 0 63 68.277a1.97 1.97 0 0 0 1.965-1.965v.066zm-3.4 5.549h2.932v21.082h-2.932zm5.801-7.984h2.931V93.01h-2.93zm5.739 0h2.932V93.01h-2.932zm13.197 29.69c-5.177 0-8.645-2.62-8.645-7.485v-.187h2.807v.125c0 3.18 2.37 5.052 5.8 5.052 1.871 0 5.49-.81 5.49-3.804 0-5.801-13.41-1.685-13.41-9.98 0-4.18 3.892-6.05 7.758-6.05 4.616 0 7.71 2.62 7.71 6.86v.188h-2.807v-.187c0-2.745-1.933-4.366-5.052-4.366-2.245 0-4.803.936-4.803 3.43 0 5.426 13.41 1.622 13.41 9.98 0 4.428-4.14 6.424-8.257 6.424" fill="#c80c0f"/></g></svg></span><span class="woord">Prognose</span></button>
  <nav class="stappen" id="stappen" aria-label="Stappen">
    <button data-stap="data"><span>Data</span></button>
    <button data-stap="overzicht"><span>Overzicht</span></button>
    <button data-stap="pijplijn"><span>Pijplijn</span></button>
    <button data-stap="teams"><span>Teams &amp; klanten</span></button>
    <button data-stap="wijzigingen" class="verborgen"><span>Wijzigingen</span></button>
    <button data-stap="regels"><span>Regels</span></button>
    <button data-stap="rapport"><span>Rapport</span></button>
  </nav>
  <span class="kopcontext" id="kopcontext"></span>
  <div class="rechts">
    <span class="stand" id="stand" aria-live="polite"></span>
    <button class="ikoonknop" id="knopOver" title="Over Prognose" aria-label="Over Prognose en versie">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.1"/></svg></button>
    <button class="ikoonknop" id="knopOpnieuw" title="Bestand vergeten en opnieuw beginnen" aria-label="Bestand vergeten en opnieuw beginnen">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg></button>
  </div>
</div></header>

<!-- ============================ DATA ============================ -->
<main class="scherm" id="s-data">
  <div class="blad" id="dataBlad"></div>
  <div class="voetbalk"><div class="voetbinnen">
    <span class="samen" id="dataSamen"></span>
    <div class="rest"><button class="k cta" id="knopNaarOverzicht" disabled><span>Naar het overzicht</span></button></div>
  </div></div>
</main>
<main class="scherm verborgen" id="s-overzicht"><div class="blad breed" id="ovBlad"></div></main>
<main class="scherm verborgen" id="s-pijplijn"><div class="blad breed" id="pijpBlad"></div></main>
<main class="scherm verborgen" id="s-teams"><div class="blad breed" id="teamBlad"></div></main>
<main class="scherm verborgen" id="s-wijzigingen"><div class="blad breed" id="wijzBlad"></div></main>
<main class="scherm verborgen" id="s-regels"><div class="blad breed" id="regelBlad" style="padding-bottom:12px"></div></main>
<main class="scherm verborgen" id="s-rapport">
  <div class="studio">
    <aside class="stkeuzes" id="stKeuzes"></aside>
    <section class="stvoorbeeld">
      <div class="stbalk"><span class="stinfo" id="pdfInfo"></span>
        <div class="rest">
          <button class="k stil" id="pdfVenster" title="Open het rapport in een eigen venster">Nieuw venster</button>
          <button class="k cta" id="pdfPrint"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg><span>Afdrukken / PDF</span></button>
        </div></div>
      <div class="stdoek" id="pdfDoek"><div class="stschaal" id="pdfSchaal"><iframe id="pdfFrame" title="Voorbeeld van het rapport"></iframe></div><div class="laden" id="pdfLaden">Voorbeeld maken…</div></div>
    </section>
  </div>
</main>

<div class="pop verborgen" id="pop" role="dialog"></div>
<div id="vensters"></div>
<div class="tip verborgen" id="tip" role="tooltip"></div>
<div id="sleepvlak"><div class="sd"><span class="pijlop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></span><b>Laat los om in te lezen</b><span>Het dashboard rekent alles opnieuw uit met dit bestand</span></div></div>
<div id="melding"></div>

function openZip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);

    tekst(naam){
      const f = bestanden[String(naam).replace(/^\/+/,'').toLowerCase()];

  let beste = null;

      const blok = {jaar, tab:tab.naam, rij:r+1, forecast: waarden(r), invoiced:null, secured:null, kolommen, labelKol:L};
      for (let rr=r+1; rr<Math.min(R.length, r+9); rr++){
        const label = celTekst((R[rr]||[])[L]).trim().toLowerCase();
        const jaarCel = (R[rr]||[]).slice(0, L).some(x => typeof x==='number' && x>=2000 && x<=2100);
        if (jaarCel || /cumul|forecast/.test(label)) break;
        if (!blok.invoiced && /^(invoiced|gefactureerd|realisatie|actual|omzet)/.test(label)) { blok.invoiced = waarden(rr); blok.invoicedRij = rr+1; }
        else if (!blok.secured && /^(secured|nog te factureren|pipeline|open)/.test(label)) blok.secured = waarden(rr);
      }
      if (!blokken[jaar]) blokken[jaar] = blok;
    }
  }
  return blokken;
}
function maandKolommen(R, r, L){
  for (let rr=r; rr>=Math.max(0, r-4); rr--){
    const rij = R[rr] || []; const map = {};
    rij.forEach((v,c) => { if (c<=L || typeof v!=='string') return; const m = leesMaand(v); if (m && !m.fout && map[m.m]==null) map[m.m] = c; });
    if (Object.keys(map).length >= 10) return Array.from({length:12}, (_,i) => map[i+1] ?? -1);
  }
  return Array.from({length:12}, (_,i) => L+1+i);
}

function bouwModel(wb, voorkeurTab){
  const kandidaten = [];
  for (const tab of wb.tabs){
    const kop = vindKoprij(tab); if (!kop) continue;
    const jaar = jaarUit(tab.naam);
    let score = kop.score + (jaar ? 10 : 0) - (/power\s*bi|^data\b|export/i.test(tab.naam) ? 8 : 0) - (tab.verborgen ? 5 : 0);
    if (/instruction/i.test(kop.koppen[kop.kol.status]||'')) score += 2;
    let n = 0;
    for (let r=kop.rij+1; r<tab.rijen.length; r++){ const rij = tab.rijen[r]||[]; if (!leegCel(rij[kop.kol.client]) || !leegCel(rij[kop.kol.status])) n++; }
    if (!n) score -= 20;   // lege sjabloontab (bijv. volgend jaar nog niet begonnen)
    kandidaten.push({tab, kop, jaar, score, n});
  }
  if (!kandidaten.length){
    const e = new Error('GEEN_DATA'); e.tabs = wb.tabs.map(t=>t.naam); throw e;
  }
  kandidaten.sort((a,b) => b.score-a.score || (b.jaar||0)-(a.jaar||0));
  let keuze = voorkeurTab && kandidaten.find(k => k.tab.naam === voorkeurTab);
  if (!keuze){
    const metJaar = kandidaten.filter(k => k.jaar && k.n > 0 && k.score >= 12);
    keuze = metJaar.length ? metJaar.sort((a,b) => b.jaar-a.jaar)[0] : kandidaten[0];
  }

  // historie uit de andere tabbladen (voorkeur voor 'Old' e.d.)
  const hist = {}; const histTabs = [];
  const volgorde = wb.tabs.filter(t => t !== keuze.tab).sort((a,b) => (/old|histor|forecast|budget|prognose/i.test(b.naam)?1:0) - (/old|histor|forecast|budget|prognose/i.test(a.naam)?1:0));
  for (const t of volgorde){
    const b = leesHistorie(t); const jaren = Object.keys(b);
    if (jaren.length) histTabs.push(t.naam);
    for (const j of jaren) if (!hist[j]) hist[j] = b[j];
  }

  // regels
  const {kol, rij: kopRij} = keuze.kop; const T = keuze.tab.rijen;
  const regels = []; const overgeslagen = [];
  const canon = {}; const kanoniek = (soort, s) => { const k = s.toLowerCase(); canon[soort] = canon[soort] || {}; return canon[soort][k] ??= s; };
  const g = (rij, k) => kol[k]==null ? null : rij[kol[k]];

  // jaar: uit de tabnaam, anders het meest voorkomende factuurjaar, anders de laatste forecast
  let jaar = keuze.jaar;
  if (!jaar){
    const tel = {};
    for (let r=kopRij+1; r<T.length; r++){ const d = leesDatum(g(T[r]||[], 'factuurdatum')); if (d) tel[d.getUTCFullYear()] = (tel[d.getUTCFullYear()]||0)+1; }
    const best = Object.entries(tel).sort((a,b)=>b[1]-a[1])[0];
    jaar = best ? +best[0] : (Object.keys(hist).map(Number).sort().pop() || new Date().getFullYear());
  }

  for (let r=kopRij+1; r<T.length; r++){
    const rij = T[r] || [];
    const clientRuw = g(rij,'client'), statusRuw = g(rij,'status'), secRuw = g(rij,'secured'), invRuw = g(rij,'invoiced');
    const tekstRij = rij.map(celTekst).join(' ').trim();
    if (leegCel(clientRuw) && leegCel(statusRuw)) {                       // lege regel, of totaal-/controleregel
      if (tekstRij) overgeslagen.push({rij:r+1, tekst: /tota/i.test(tekstRij) ? 'totaalregel' : tekstRij.slice(0,60)});
      continue;
    }
    if (leegCel(statusRuw)){
      const c = celTekst(clientRuw).trim();
      const zonderGeld = !leesBedrag(secRuw).w && !leesBedrag(invRuw).w && leegCel(g(rij,'maand'));
      if (/^(sub)?tota[a]?l\b|^som\b/i.test(c) || zonderGeld){                 // 'Totaal', of een regel als 'DEZE REGEL KOPIEREN'
        overgeslagen.push({rij:r+1, tekst: /^(sub)?tota/i.test(c) ? 'totaalregel' : c.slice(0,60)});
        continue;
      }
    }
    const o = {rij: r+1, issues: []};
    const idRuw = g(rij,'id');
    o.id = leegCel(idRuw) ? '' : celTekst(idRuw).trim();
    // client
    if (clientRuw && typeof clientRuw==='object' && clientRuw.e){ o.client = '(onbekende client)'; o.issues.push('client_mist'); }
    else {
      let s = celTekst(clientRuw).replace(/\s+/g,' ').trim();
      if (!s){ s = '(onbekende client)'; o.issues.push('client_mist'); }
      else if (/^cleint\b/i.test(s)) { s = s.replace(/^cleint/i, 'Client'); o.issues.push('client_typo'); }
      o.client = s === '(onbekende client)' ? s : kanoniek('client', s);
    }
    const tekstveld = (k, leeg) => { const s = celTekst(g(rij,k)).replace(/\s+/g,' ').trim(); return s ? kanoniek(k, s) : leeg; };
    o.team = tekstveld('team', '(geen team)'); if (o.team === '(geen team)') o.issues.push('team_mist');
    o.purpose = tekstveld('purpose', '(leeg)');
    o.type = tekstveld('type', '(leeg)');
    o.soort = tekstveld('soort', '(leeg)');
    o.object = celTekst(g(rij,'object')).trim();
    o.oppo = celTekst(g(rij,'oppo')).trim();
    const dyn = celTekst(g(rij,'dynamics')).trim().toUpperCase();
    o.dynamics = dyn; if (kol.dynamics!=null && !dyn) o.issues.push('dynamics_leeg');
    o.statusTekst = celTekst(statusRuw).trim();
    o.cat = leesStatus(statusRuw);
    o.maandTekst = celTekst(g(rij,'maand')).trim();
    const sec = leesBedrag(secRuw), inv = leesBedrag(invRuw);
    o.secured = sec.w; o.invoiced = inv.w;
    o.factuurnr = celTekst(g(rij,'factuurnr')).trim();
    const fdRuw = g(rij,'factuurdatum'); o.factuurdatum = leesDatum(fdRuw);
    o.telt = true; o.mnd = null; o.bedrag = 0;

    if (o.cat === 'inv'){
      if (inv.w == null){ o.issues.push(inv.tekst ? 'bedrag_tekst' : 'inv_geen_bedrag'); }
      else { o.bedrag = inv.w; if (inv.tekst) o.issues.push('bedrag_tekst_omgezet'); }
      if (!o.factuurdatum) o.issues.push(leegCel(fdRuw) ? 'inv_geen_datum' : 'datum_onbekend');
      else if (o.factuurdatum.getUTCFullYear() !== jaar){ o.issues.push('inv_ander_jaar'); o.telt = false; }
      else o.mnd = o.factuurdatum.getUTCMonth()+1;
      if (!o.factuurnr || o.factuurnr === '-') o.issues.push('inv_geen_nr');
      if (sec.w) o.issues.push('sec_bij_inv');
    } else if (o.cat === 'sec' || o.cat === 'acc'){
      if (sec.w == null){ o.issues.push(sec.tekst ? 'bedrag_tekst' : (o.cat==='sec' ? 'sec_geen_bedrag' : 'acc_geen_bedrag')); }
      else { o.bedrag = sec.w; if (sec.tekst) o.issues.push('bedrag_tekst_omgezet'); }
      const m = leesMaand(g(rij,'maand'));
      if (!m) o.issues.push('maand_mist');
      else if (m.fout) o.issues.push('maand_onbekend');
      else if (m.j && m.j !== jaar){ o.issues.push('maand_ander_jaar'); o.telt = false; }
      else o.mnd = m.m;
      if (inv.w) o.issues.push('inv_bij_ander');
    } else {
      o.telt = false;
      o.bedrag = inv.w || sec.w || 0;
      o.issues.push(o.cat === 'uit' ? 'status_uit' : o.cat === 'leeg' ? 'status_leeg' : 'status_onbekend');
    }
    if (!o.telt) o.bedragNietGeteld = o.bedrag;
    regels.push(o);
  }

  // dubbelen
  const tel = (sleutel, filter) => { const m = {}; regels.filter(filter).forEach(o => { const k = o[sleutel]; if (k) (m[k] = m[k]||[]).push(o); }); return m; };
  regels.forEach(o => o.dubbelSleutel = [o.id, o.client, o.object, o.statusTekst, o.bedrag, o.mnd, o.factuurnr].join('|').toLowerCase());
  Object.values(tel('dubbelSleutel', o => o.bedrag)).forEach(l => { if (l.length>1) l.forEach(o => o.issues.push('mogelijk_dubbel')); });
  Object.values(tel('factuurnr', o => o.cat==='inv' && o.factuurnr !== '-')).forEach(l => { if (l.length>1) l.forEach(o => o.issues.push('dubbel_nr')); });

  // peilmaand = de huidige maand. Een afgelopen jaar is helemaal afgesloten.
  const nu = new Date();
  const peil = nu.getFullYear() === jaar ? nu.getMonth()+1 : nu.getFullYear() > jaar ? 12 : 1;
  const lopend = nu.getFullYear() <= jaar;
  let laatsteFactuur = 0;
  regels.forEach(o => { if (o.cat==='inv' && o.telt && o.mnd) laatsteFactuur = Math.max(laatsteFactuur, o.mnd); });

  const fcBlok = hist[jaar];
  const forecast = fcBlok && fcBlok.forecast && fcBlok.forecast.some(v => v) ? fcBlok.forecast.map(v => v||0) : null;

  return {
    bestand: wb.bestand, tijd: wb.tijd, bestandTijd: wb.bestandTijd || null, jaar, peil, lopend, laatsteFactuur, regels, overgeslagen, forecast, hist, histTabs,
    tab: keuze.tab.naam, kop: keuze.kop, kandidaten: kandidaten.map(k => ({naam:k.tab.naam, n:k.n})),
    alleTabs: wb.tabs.map(t => t.naam)
  };
}

/* =====================================================================
   4. CONTROLES, OPTELLEN, INZICHTEN, VERSIES VERGELIJKEN
   ===================================================================== */
const CHECKS = {

  status_leeg:      {t:'Status leeg', u:'Zonder status telt de regel niet mee.'},
  status_uit:       {t:'Bewust niet meegeteld', u:'Status zoals Cancelled, Lost of On hold. Telt niet mee, en dat is de bedoeling.'},

  inv_ander_jaar:   {t:'Factuurdatum in een ander jaar', u:'Hoort niet bij dit boekjaar.'},
  maand_ander_jaar: {t:'Projected month in een ander jaar', u:'Hoort niet bij dit boekjaar.'},
  inv_geen_datum:   {t:'Invoiced zonder factuurdatum', u:'Valt in geen enkele maand.'},
  datum_onbekend:   {t:'Factuurdatum niet herkend', u:'De factuurdatum is geen datum.'},

  acc_geen_bedrag:  {t:'Accrual zonder bedrag', u:'Accruals tellen met het bedrag uit Secured Fee.'},
