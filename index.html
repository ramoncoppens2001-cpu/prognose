/* Verdeelt de blokken over A4-bladen. Draait in het rapport zelf (in het
   voorbeeld en in een eigen venster): blokken gaan in hun geheel naar het
   volgende blad als ze niet meer passen; tabellen en lijsten worden per
   regel gesplitst, met de tabelkop herhaald. Een tussenkop blijft bij wat
   erop volgt, en een tabel begint niet met één of twee regels onderaan. */
function pagineer(){
  var bron = document.getElementById('bron'), doel = document.getElementById('paginas');
  var blokken = [].slice.call(bron.children), bladen = [], pg = null;
  bron.parentNode.removeChild(bron);
  function nieuw(){
    var blad = document.createElement('div'); blad.className = 'blad';
    if (bladen.length && LOOP){ var lh = document.createElement('div'); lh.className = 'loophoofd'; lh.innerHTML = LOOP; blad.appendChild(lh); }
    var inh = document.createElement('div'); inh.className = 'inhoud';
    var voet = document.createElement('div'); voet.className = 'voet';
    blad.appendChild(inh); blad.appendChild(voet); doel.appendChild(blad); bladen.push(blad); pg = inh;
  }
  function past(){ return pg.scrollHeight <= pg.clientHeight + 1; }
  function leeg(){ return !pg.children.length; }
  function isLbl(b){ return b && b.classList && b.classList.contains('lbl'); }
  // staat er op dit blad (afgezien van blok b) alleen nog maar een tussenkop?
  function alleenKoppen(b){ for (var c = pg.firstElementChild; c; c = c.nextElementSibling) if (c !== b && !isLbl(c)) return false; return true; }
  // naar een nieuw blad; tussenkoppen onderaan het oude blad gaan mee
  function naarVolgend(){
    var mee = [];
    while (pg.children.length > 1 && isLbl(pg.lastElementChild)){ var l = pg.lastElementChild; pg.removeChild(l); mee.unshift(l); }
    nieuw();
    for (var i = 0; i < mee.length; i++) pg.appendChild(mee[i]);
  }
  function splitsbaar(b){ return b.tagName === 'TABLE' || (b.classList && b.classList.contains('aandacht')); }
  function delenVan(b){ return b.tagName === 'TABLE' ? [].slice.call(b.tBodies[0].rows) : [].slice.call(b.children); }
  function schil(b){
    var s = b.cloneNode(false);
    if (b.tagName === 'TABLE'){ if (b.tHead) s.appendChild(b.tHead.cloneNode(true)); s.appendChild(document.createElement('tbody')); }
    return s;
  }
  function bak(s){ return s.tagName === 'TABLE' ? s.tBodies[0] : s; }
  // hoeveel delen (vanaf i) passen er nog op dit blad?
  function hoeveel(bk, delen, i){
    var lo = 0, hi = delen.length - i;
    while (lo < hi){
      var mid = (lo + hi + 1) >> 1, j;
      for (j = 0; j < mid; j++) bk.appendChild(delen[i + j]);
      var ok = past();
      for (j = 0; j < mid; j++) bk.removeChild(delen[i + j]);
      if (ok) lo = mid; else hi = mid - 1;
    }
    return lo;
  }
  function splits(b){
    var delen = delenVan(b), i = 0, eerste = true;
    while (i < delen.length){
      var s = schil(b), bk = bak(s);
      pg.appendChild(s);
      var n = hoeveel(bk, delen, i), rest = delen.length - i, bovenaan = alleenKoppen(s);
      // niet met een paar regels onderaan een blad beginnen
      if (eerste && n < rest && n < Math.min(3, rest) && !bovenaan){
        pg.removeChild(s); naarVolgend(); eerste = false; continue;
      }
      if (n === 0){
        if (bovenaan){ bk.appendChild(delen[i]); i++; }   // past zelfs op een leeg blad niet: dan toch één regel
        else { pg.removeChild(s); naarVolgend(); eerste = false; continue; }
      }
      // geen eenzame laatste regel op het volgende blad
      if (n === rest - 1 && n >= 4) n--;
      for (var j = 0; j < n; j++) bk.appendChild(delen[i + j]);
      i += n; eerste = false;
      if (i < delen.length) nieuw();
    }
  }
  function plaats(b){
    if (b.hasAttribute && b.hasAttribute('data-nieuw') && !leeg()) nieuw();
    pg.appendChild(b);
    if (past()) return;
    pg.removeChild(b);
    if (isLbl(b)){ naarVolgend(); pg.appendChild(b); return; }
    if (splitsbaar(b)){ splits(b); return; }
    if (!alleenKoppen(null)){ naarVolgend(); pg.appendChild(b); if (past()) return; pg.removeChild(b); }
    pg.appendChild(b);   // groter dan een blad: dan maar afgesneden
  }
  nieuw();
  for (var i = 0; i < blokken.length; i++) plaats(blokken[i]);
  // een tussenkop helemaal onderaan zonder iets erna: weg ermee
  bladen.forEach(function(bl){ var inh = bl.querySelector('.inhoud'); while (isLbl(inh.lastElementChild) && inh.children.length > 1) inh.removeChild(inh.lastElementChild); });
  bladen = bladen.filter(function(bl){ if (!bl.querySelector('.inhoud').children.length){ bl.parentNode.removeChild(bl); return false; } return true; });
  bladen.forEach(function(bl, i){
    var v = bl.querySelector('.voet');
    if (MET_VOET){ v.innerHTML = '<span></span><span>' + (i + 1) + ' / ' + bladen.length + '</span>'; v.firstChild.textContent = VOETTEKST; }
  });
  window.__klaar = true;
}

/* =====================================================================
   8. FOUTZOEKER
   Een technisch verslag in een terminalvenster op de Data-stap: wat de
   tool in het werkboek vond, hoe hij de regels las, wat afwijkt en welke
   fouten er waren. Zonder clientnamen, adressen, ID's, factuurnummers,
   bestandsnaam en (standaard) zonder bedragen, zodat je het veilig kunt
   kopiëren en in een gesprek kunt plakken. Rijnummers en kolomletters
   verwijzen naar het Excel-bestand.
   ===================================================================== */
const DIAG = {open:false, bedragen:false, filter:'alles', extra:[], log:[], fouten:[], wb:null, bestand:null, duur:{}, mislukt:null};

function diagLog(soort, tekst){
  DIAG.log.push({t: Date.now(), soort, tekst: String(tekst).slice(0, 300)});
  if (DIAG.log.length > 60) DIAG.log.shift();
}
/* Een fout vastleggen. Paden in de stack worden ingekort tot de bestandsnaam
   met regel en kolom, zodat er geen mapnamen (zoals je gebruikersnaam) in staan. */
const kortPad = s => String(s).replace(/(?:file|https?|blob):\/\/\S*\/([^\/\s)]+)/g, '$1').replace(/[A-Z]:\\\S*\\([^\\\s)]+)/g, '$1');
function diagFout(err, waar){
  const msg = kortPad(err && err.message ? err.message : String(err || 'onbekende fout'));
  const stack = err && err.stack ? String(err.stack).split('\n').slice(1, 6).map(r => kortPad(r.trim())).join('\n') : '';
  DIAG.fouten.push({t: Date.now(), waar, soort: err && err.name ? err.name : 'Fout', msg: msg.slice(0, 300), stack: stack.slice(0, 600)});
  if (DIAG.fouten.length > 15) DIAG.fouten.shift();
  diagLog('fout', `${waar}: ${msg}`);
  try { if ($('#foutzoeker')) tekenFoutzoeker(); } catch(e){}
}
addEventListener('error', e => diagFout(e.error || {message: e.message, stack: `bij ${e.filename || '?'}:${e.lineno}:${e.colno}`}, 'fout op de pagina'));
addEventListener('unhandledrejection', e => diagFout(e.reason, 'fout in een taak op de achtergrond'));

/* ---------- vormen in plaats van inhoud ---------- */
const SOORT_VELD = {id:'nummer', client:'client', soort:'categorie', object:'tekst', type:'categorie', purpose:'categorie', team:'categorie', maand:'maand',
  secured:'bedrag', status:'categorie', invoiced:'bedrag', factuurnr:'nummer', factuurdatum:'datum', oppo:'nummer', dynamics:'categorie'};
const maskeer = s => String(s).replace(/\d/g, '9');                       // "€ 1.234,50" → "€ 9.999,99"
const zonderBedragen = s => DIAG.bedragen ? s : String(s).replace(/[−-]?€\s?[−-]?[\d.,]+(?:\s?(?:mln|k)\b)?/g, '€ …');
const fmtBedrag = v => v == null || !isFinite(v) ? '–' : DIAG.bedragen ? (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('nl-NL', {maximumFractionDigits:2}) : 'verborgen';
function cijfers(v){
  const d = String(Math.trunc(Math.abs(v))).length;
  return `${v < 0 ? 'negatief, ' : ''}${d} ${d === 1 ? 'cijfer' : 'cijfers'}${Number.isInteger(v) ? '' : ', met decimalen'}`;
}
let PSEUDO = null;
function pseudoniem(v){
  if (!PSEUDO || PSEUDO.m !== S.m){
    PSEUDO = new Map(); PSEUDO.m = S.m;
    (S.m ? S.m.regels : []).forEach(o => { const k = o.client.toLowerCase(); if (o.client !== '(onbekende client)' && !PSEUDO.has(k)) PSEUDO.set(k, 'client-' + String(PSEUDO.size + 1).padStart(3, '0')); });
  }
  if (v && typeof v === 'object' && v.e) return `fout ${v.e}`;
  const s = celTekst(v).replace(/\s+/g, ' ').trim().replace(/^cleint\b/i, 'Client');
  if (!s) return 'leeg';
  return PSEUDO.get(s.toLowerCase()) || `tekst (${s.length} tekens)`;
}
/* Hoe ziet een cel eruit, zonder te laten zien wat erin staat? */
function celVorm(v, soort){
  if (v == null || (typeof v === 'string' && !v.trim())) return 'leeg';
  if (typeof v === 'object' && v.e) return `fout ${v.e}`;
  if (typeof v === 'boolean') return v ? 'WAAR' : 'ONWAAR';
  if (soort === 'client') return pseudoniem(v);
  if (soort === 'bedrag'){
    if (typeof v === 'number') return v === 0 ? 'getal 0' : DIAG.bedragen ? `getal ${fmtBedrag(v)}` : `getal (${cijfers(v)})`;
    return `tekst "${kort(DIAG.bedragen ? String(v) : maskeer(v), 24)}"`;
  }
  if (soort === 'datum' || soort === 'maand'){
    if (typeof v === 'number') return v > 20000 && v < 80000 ? `datum ${datumNL(serialNaarDatum(v))}` : `getal ${v}`;
    return `tekst "${kort(String(v).trim(), 24)}"`;
  }
  if (soort === 'categorie') return typeof v === 'number' ? `getal ${v}` : `"${kort(String(v).replace(/\s+/g, ' ').trim(), 30)}"`;
  if (typeof v === 'number') return `getal (${cijfers(v)})`;
  return `tekst (${String(v).trim().length} tekens)`;
}
function celType(v){
  if (v == null || (typeof v === 'string' && !v.trim())) return 'leeg';
  if (typeof v === 'object' && v.e) return 'fout';
  if (typeof v === 'number') return 'getal';
  if (typeof v === 'string') return 'tekst';
  return 'anders';
}
/* "B, C, D, F" → "B–D, F" */
function bereiken(idx){
  const uit = []; let i = 0;
  while (i < idx.length){ let j = i; while (j + 1 < idx.length && idx[j+1] === idx[j] + 1) j++; uit.push(j > i + 1 ? `${kolLetter(idx[i])}–${kolLetter(idx[j])}` : j === i + 1 ? `${kolLetter(idx[i])}, ${kolLetter(idx[j])}` : kolLetter(idx[i])); i = j + 1; }
  return uit.join(', ');
}
const rijLijst = (nrs, max = 25) => nrs.length <= max ? nrs.join(', ') : `${nrs.slice(0, max).join(', ')} … (+${nrs.length - max})`;
const telLijst = (tel) => Object.entries(tel).filter(([, n]) => n).map(([k, n]) => `${k} ${n}`).join(' · ') || '–';
function overslagSoort(rij){
  const tekst = (rij || []).map(celTekst).join(' ').toLowerCase();
  const soort = /tota/.test(tekst) ? 'totaalregel' : /kopi|copy|sjabloon|template/.test(tekst) ? 'sjabloonregel (om te kopiëren)' : /correct|check|controle|klopt/.test(tekst) ? 'controleregel' : 'regel zonder status en zonder bedrag';
  const gevuld = (rij || []).map((v, i) => leegCel(v) ? -1 : i).filter(i => i >= 0);
  return {soort, gevuld: gevuld.length ? bereiken(gevuld) : 'niets', verdacht: soort.startsWith('regel zonder')};
}
function browserNaam(){
  const ua = navigator.userAgent; let m;
  const b = (m = ua.match(/Edg\/(\d+)/)) ? 'Edge ' + m[1] : (m = ua.match(/OPR\/(\d+)/)) ? 'Opera ' + m[1] : (m = ua.match(/Chrome\/(\d+)/)) ? 'Chrome ' + m[1]
    : (m = ua.match(/Firefox\/(\d+)/)) ? 'Firefox ' + m[1] : (m = ua.match(/Version\/(\d+)[\d.]* .*Safari/)) ? 'Safari ' + m[1] : 'onbekende browser';
  const os = /Windows NT 10/.test(ua) ? 'Windows 10/11' : /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'macOS' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Linux/.test(ua) ? 'Linux' : 'onbekend systeem';
  return `${b} · ${os}`;
}
const opslagKB = k => { try { const s = localStorage.getItem(k); return s ? `${Math.round(s.length / 1024)} kB` : 'leeg'; } catch(e){ return 'niet beschikbaar'; } };
const tijdKort = t => new Date(t).toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
const datumTijdKort = t => { const d = new Date(t); return `${datumNL(new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())))} ${d.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'})}`; };

/* Waarom wijkt gefactureerd in maand i af van de rij Invoiced in Excel?
   v = tool − Excel. Zoekt een eenvoudige verklaring in de regels. */
function verklaarVerschil(m, i, v){
  const bijna = (a, b) => Math.abs(a - b) < .5;
  const somB = (l, f = o => o.bedrag) => l.reduce((s, o) => s + f(o), 0);
  const nrs = l => l.map(o => o.rij).sort((a, b) => a - b);
  const inMaand = m.regels.filter(o => o.cat === 'inv' && o.telt && o.mnd === i + 1);
  if (v > 0){
    const tekst = inMaand.filter(o => o.issues.includes('bedrag_tekst_omgezet'));
    if (tekst.length && bijna(somB(tekst), v)) return `${tekst.length === 1 ? 'bedrag' : 'bedragen'} als tekst in rij ${rijLijst(nrs(tekst), 10)}: Excel telt tekst niet mee, de tool wel`;
    const een = inMaand.filter(o => bijna(o.bedrag, v)).sort((a, b) => b.rij - a.rij);
    if (een.length) return `precies het bedrag van rij ${een[0].rij}${een.length > 1 ? ` (of ${een.slice(1, 4).map(o => o.rij).join(', ')})` : ''}: telt de formule in Excel die rij niet mee?`;
    const onder = inMaand.slice().sort((a, b) => b.rij - a.rij); let s = 0;
    for (let k = 0; k < onder.length; k++){ s += onder[k].bedrag; if (bijna(s, v)) return `de onderste ${k + 1} ${k ? 'regels' : 'regel'} van deze maand (vanaf rij ${onder[k].rij}): valt het bereik van de formule in Excel te kort?`; }
  } else {
    const w = -v;
    const ander = m.regels.filter(o => o.cat !== 'inv' && o.invoiced && o.factuurdatum && o.factuurdatum.getUTCFullYear() === m.jaar && o.factuurdatum.getUTCMonth() === i);
    if (ander.length && bijna(somB(ander, o => o.invoiced), w)) return `Invoiced amount bij een andere status in rij ${rijLijst(nrs(ander), 10)}: Excel telt die mee, de tool niet`;
    const anderJaar = m.regels.filter(o => o.cat === 'inv' && o.issues.includes('inv_ander_jaar') && o.factuurdatum && o.factuurdatum.getUTCMonth() === i);
    if (anderJaar.length && bijna(somB(anderJaar), w)) return `facturen uit een ander jaar in rij ${rijLijst(nrs(anderJaar), 10)}: kijkt de formule in Excel alleen naar de maand?`;
    const geenStatus = m.regels.filter(o => !o.telt && o.invoiced && o.factuurdatum && o.factuurdatum.getUTCMonth() === i);
    if (geenStatus.length && bijna(somB(geenStatus, o => o.invoiced), w)) return `regels die niet meetellen (status) in rij ${rijLijst(nrs(geenStatus), 10)}: Excel telt die wel mee`;
  }
  return 'geen eenvoudige verklaring gevonden in de regels';
}

/* Hoe is één rij gelezen? */
function diagRij(n){
  const L = [], r = (s, t, bij) => L.push({s, t, bij: !!bij});
  const m = S.m;
  L.push({s:'kop', t:`Rij ${n}`});
  if (!m){ r('let', 'Er is geen bestand geladen.'); return L; }
  const tab = S.wb.tabs.find(t => t.naam === m.tab), T = tab ? tab.rijen : [];
  if (!T.length){ r('let', `De rijen van "${m.tab}" zijn niet beschikbaar.`); return L; }
  if (n <= m.kop.rij){ r('info', `Rij ${n} staat boven de koprij (rij ${m.kop.rij + 1}) en wordt niet gelezen.`); return L; }
  if (n === m.kop.rij + 1){ r('info', 'Dit is de koprij met de kolomnamen.'); return L; }
  const rij = T[n - 1];
  if (!rij || !rij.some(v => !leegCel(v))){ r('info', `Rij ${n} is leeg${n > T.length ? `; de laatste gevulde rij is ${T.length}` : ''}.`); return L; }
  r('zacht', `tab "${m.tab}"`);
  Object.keys(VELDNAMEN).filter(k => m.kop.kol[k] != null).sort((a, b) => m.kop.kol[a] - m.kop.kol[b]).forEach(k => {
    const c = m.kop.kol[k];
    r('sub', `${kolLetter(c).padEnd(4)}${VELDNAMEN[k].padEnd(22)}${celVorm(rij[c], SOORT_VELD[k])}`);
  });
  const ov = m.overgeslagen.find(x => x.rij === n);
  const o = m.regels.find(x => x.rij === n);
  if (ov){ const d = overslagSoort(rij); r(d.verdacht ? 'let' : 'info', `Overgeslagen: ${d.soort}.`); return L; }
  if (!o){ r('let', 'Deze rij staat niet in de regels (onverwacht).'); return L; }
  const catNaam = {inv:'gefactureerd', sec:'secured', acc:'accrual', uit:'bewust niet meegeteld', overig:'status niet herkend', leeg:'zonder status'}[o.cat] || o.cat;
  const bron = o.cat === 'inv' ? 'Invoiced amount' : o.cat === 'sec' || o.cat === 'acc' ? 'Secured Fee' : 'Invoiced amount of Secured Fee';
  r(o.telt ? 'ok' : 'let', `${o.telt ? 'Telt mee' : 'Telt NIET mee'} · ${catNaam} · maand ${o.mnd ? MNDL[o.mnd - 1] : 'geen'} · bedrag uit ${bron}: ${DIAG.bedragen ? fmtBedrag(o.bedrag) : o.bedrag ? 'gevuld' : '0 of leeg'}`);
  const imp = impactCodes(S.ctrl).get(o) || new Set();
  o.issues.forEach(c => r(imp.has(c) ? 'let' : 'info', `${c}: ${(CHECKS[c] || {t:c}).t}${imp.has(c) ? ' (invloed op de cijfers)' : ''}`));
  const a = S.ctrl.aandacht.find(x => x.o === o);
  if (a) a.adv.forEach(x => r('zacht', `  advies: ${zonderBedragen(x.a)}`, 1));
  return L;
}

  for (const l of lijnen){

/* =====================================================================
   RENDER
   ===================================================================== */
const STAPPEN = ['data','overzicht','pijplijn','teams','wijzigingen','regels','rapport'];
function render(){
  const m = S.m;
  if (!m) S.stap = 'data';
  if (S.stap === 'wijzigingen' && !S.wijz) S.stap = 'overzicht';
  $$('#stappen button').forEach(b => {
    const st = b.dataset.stap;
    b.disabled = !m && st !== 'data';
    b.classList.toggle('aan', st === S.stap);
    b.setAttribute('aria-current', st === S.stap ? 'step' : 'false');
    if (st === 'wijzigingen') b.classList.toggle('verborgen', !S.wijz);
    if (st === 'data'){
      const n = m ? controleGroepen(S.ctrl).length : 0;
      const vink = !m ? '' : n ? `<span class="stapvink let" title="${meervoud(n,'aandachtspunt','aandachtspunten')} in de controle">${n > 9 ? '9+' : n}</span>` : `<span class="stapvink" title="Controle in orde">${IK.vink()}</span>`;
      b.innerHTML = `${vink}<span>Data</span>`;
    }
  });
  $('#kopcontext').innerHTML = m ? `<b>${esc(m.bestand)}</b> · ${meervoud(m.regels.length,'regel','regels')} · ${S.lopend ? MNDL[S.peil-1] : 'heel'} ${m.jaar}${S.team!=='Alle' ? ` · ${esc(S.team)}` : ''}` : '';
  $('#stand').textContent = S.stand; $('#stand').className = 'stand ' + (S.standKlasse || '');
  STAPPEN.forEach(st => $('#s-' + st).classList.toggle('verborgen', st !== S.stap));
  // op een smal scherm de gekozen stap in beeld schuiven
  const nav = $('#stappen'), aan = $('#stappen button.aan');
  if (aan && nav.scrollWidth > nav.clientWidth){
    const l = aan.offsetLeft - nav.offsetLeft, r = l + aan.offsetWidth;
    if (l < nav.scrollLeft) nav.scrollLeft = l - 8; else if (r > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = r - nav.clientWidth + 8;
  }
  try {
    ({data:pData, overzicht:pOverzicht, pijplijn:pPijplijn, teams:pTeams, wijzigingen:pWijz, regels:pRegels, rapport:pRapport})[S.stap]();
  } catch(e){
    // Een scherm dat niet getekend kan worden: de fout vastleggen en de weg naar de foutzoeker wijzen.
    diagFout(e, `scherm ${S.stap}`);
    const plek = {data:'#dataBlad', overzicht:'#ovBlad', pijplijn:'#pijpBlad', teams:'#teamBlad', wijzigingen:'#wijzBlad', regels:'#regelBlad', rapport:'#stKeuzes'}[S.stap];
    const kaart = `<div class="paneel kapot"><h2>Dit scherm kon niet worden getekend</h2><p>Er ging iets mis in de tool, niet in je bestand. De foutzoeker heeft de details vastgelegd, zonder namen en bedragen.</p>
      ${S.stap === 'data' ? '' : `<button class="k vol" data-foutzoeker>Open de foutzoeker</button>`}</div>`;
    if (plek && $(plek)) $(plek).innerHTML = S.stap === 'data' ? kaart + '<section class="paneel foutzoeker" id="foutzoeker"></section>' : kaart;
    if (S.stap === 'data'){ DIAG.open = true; tekenFoutzoeker(); }
  }
}
function naarStap(st, opts={}){
  if (!S.m && st !== 'data') return;
  S.stap = st; tip.weg(); sluitPop(); render();
  if (opts.anker){ const el = $(opts.anker); if (el){ requestAnimationFrame(() => el.scrollIntoView({behavior:'smooth', block:'start'})); return; } }
  scrollTo({top:0});
}

          <div class="dcijfers"><span><span class="cg">${m.forecast ? eurK(som(m.forecast)) : '–'}</span><span class="cl">forecast ${Y}</span></span><span><span class="cg">${m.hist[Y-1] && heeft(m.hist[Y-1].invoiced) ? eurK(som(m.hist[Y-1].invoiced)) : '–'}</span><span class="cl">gefactureerd ${Y-1}</span></span><span><span class="cg">${jarenHist.length}</span><span class="cl">${jarenHist.length===1?'jaar':'jaren'}</span></span></div>

        : `<div class="vakdeel leeg"><span class="dikoon">${IK.grafiek(19)}</span><div class="dtekst"><div class="dtitel">Geen forecast gevonden</div><div class="dbron">Zet ergens een rij met het jaartal, het woord <b>Forecast</b> en de 12 maandbedragen, met de maanden erboven. Zonder forecast werkt het dashboard ook, alleen zonder vergelijking.</div></div><div></div><div></div></div>`}
      </div>
      <div class="vakvoorbeeld"><div class="vbkop"><span class="vbl">Eerste regels</span>${histRijen.length ? `<span class="segment klein" role="group"><button data-vbtab="regels" class="${S.vbTab==='regels'?'aan':''}">Regels</button><button data-vbtab="hist" class="${S.vbTab==='hist'?'aan':''}">Forecast en vorige jaren</button></span>` : ''}<button class="lnk" data-stap-naar="regels">Alle regels bekijken</button></div>
        ${S.vbTab === 'regels' || !histRijen.length ? voorbeeldRegels : voorbeeldHist}</div>
    </section>
    <div class="dataonder">${check}${snel}</div>
    <section class="paneel foutzoeker" id="foutzoeker"></section>`;
  $('#dataSamen').innerHTML = `<b>${meervoud(m.regels.length,'regel','regels')}</b> uit ${esc(m.tab)}${m.forecast ? ` · forecast uit ${esc(m.hist[Y].tab)}` : ''}${S.bron === 'voorbeeld' ? ' (voorbeelddata)' : ''}`;
  $('#knopNaarOverzicht').disabled = false;
  tekenFoutzoeker();
}

/* =====================================================================
   OVERZICHT
   ===================================================================== */
function pOverzicht(){
  const m = S.m, regels = gefilterd(), agg = optellen(regels), k = kerncijfers(m, regels, agg), Y = m.jaar;
  const koers = koersVan(k), alles = S.team === 'Alle' ? agg : optellen(m.regels);
  let zin;
  if (k.fc){
    zin = `Met wat er nu gefactureerd en secured is, komt ${Y} op <b>${eurK(agg.totaal)}</b>: ${pct(agg.totaal/k.fy)} van de jaarforecast van ${eurK(k.fy)}.`
      + (agg.totaal < k.fy ? ` Er moet nog <b>${eurK(k.fy-agg.totaal)}</b> aan nieuw werk bij.` : ' Daarmee is de forecast gedekt.')
      + (koers ? ` Over ${k.periode} is ${pct(koers.r)} van de forecast gefactureerd.` : '');
  } else if (S.team !== 'Alle'){
    zin = `<b>${esc(S.team)}</b> komt op <b>${eurK(agg.totaal)}</b>: ${eurK(agg.tot.inv)} gefactureerd en ${eurK(agg.open)} nog te factureren. Dat is ${pct(agg.totaal/(alles.totaal||1))} van alle teams samen.`;
  } else zin = `${eurK(agg.tot.inv)} gefactureerd en ${eurK(agg.open)} nog te factureren. In het bestand staat geen forecast voor ${Y}.`;

  // tegels
  const t = [];
  t.push(tegel(`Verwacht ${Y} (I+F)`, eurK(agg.totaal), k.fc ? `${chip(pct(agg.totaal/k.fy))}<span>van ${eurK(k.fy)} forecast</span>` : '<span>gefactureerd + nog te factureren</span>', 'hoofd'));
  t.push(tegel('Gefactureerd', eurK(agg.tot.inv), k.groei != null ? `${dchip(k.groei, v => pct(v,1), {drempel:.0005})}<span>t.o.v. ${Y-1}, ${periodeKort(k.af)}</span>`
    : k.fc ? `<span>${pct(agg.tot.inv/k.fy)} van de jaarforecast</span>` : `<span>${meervoud(regels.filter(o => o.telt && o.cat==='inv').length,'factuur','facturen')}</span>`));
  if (k.fcAf) t.push(tegel(`Tot nu toe · ${periodeKort(k.af)}`, pct(k.invAf/k.fcAf), `${dchip(k.invAf-k.fcAf)}<span>t.o.v. ${eurK(k.fcAf)} forecast</span>`));
  if (k.deze){
    const d = k.deze, tot = d.gef + d.sec;
    t.push(tegel(`${Hoofd(MNDL[k.nu-1])} · lopende maand`, eurK(tot), d.fc ? `${chip(pct(tot/d.fc), tot >= d.fc ? 'goed' : 'let')}<span>van ${eurK(d.fc)} forecast</span>` : `<span>${eurK(d.gef)} gefactureerd · ${meervoud(d.n,'regel','regels')} open</span>`,
      'nu klik', ` data-stap-naar="pijplijn" data-o="maand" title="Bekijk wat er deze maand open staat"`));
  }
  t.push(tegel('Nog te factureren', eurK(agg.open), k.achterN ? `${chip(`${k.achterN} over datum`, 'let')}<span>${eurK(k.achterB)}</span>` : `<span>secured + accruals</span>`,
    k.achterN ? 'klik' : '', k.achterN ? ` data-stap-naar="pijplijn" data-o="over" title="Bekijk de regels waarvan de maand voorbij is"` : ''));
  if (k.fc) t.push(tegel(k.gat > 0 ? 'Nog te vinden' : 'Boven de forecast', eurK(Math.abs(k.gat)), `<span>${pct(Math.abs(k.gat)/k.fy)} van de jaarforecast</span>`));
  else if (S.team !== 'Alle') t.push(tegel('Aandeel in het totaal', pct(agg.totaal/(alles.totaal||1)), `<span>van ${eurK(alles.totaal)} alle teams</span>`));
  else t.push(tegel('Klanten', nl0.format(k.klanten), `<span>${meervoud(agg.n,'regel','regels')}</span>`));

  const inz = maakInzichten(m, regels, agg, S.team === 'Alle' ? S.ctrl : null);
  const inzToon = S.inzMeer ? inz : inz.slice(0, 6);
  const vjKan = m.hist[Y-1] && m.hist[Y-1].invoiced && S.team === 'Alle';

  // kwartalen
  const jaren = S.team === 'Alle' ? [Y-1, Y-2].filter(j => m.hist[j] && m.hist[j].invoiced) : [];
  const q = (a, kw) => som(a, kw*3, kw*3+3);
  const kwRij = (naam, kw, cls='') => {
    const f = kw == null ? (x => som(x)) : (x => q(x,kw));
    const fcv = k.fc ? f(k.fc) : null, inv = f(agg.inv), open = f(agg.sec) + f(agg.acc), tot = inv + open, r = fcv ? tot/fcv : null;
    return `<tr class="${cls}"><td>${naam}</td>${k.fc?`<td class="z">${eurK(fcv)}</td>`:''}<td>${eurK(inv)}</td><td>${eurK(open)}</td><td><b>${eurK(tot)}</b></td>${k.fc?`<td><span class="pct ${r>=1?'goed':r>=.85?'let':'slecht'}">${pct(r)}</span></td>`:''}${jaren.slice(0,1).map(j => `<td class="z">${eurK(f(m.hist[j].invoiced))}</td>`).join('')}</tr>`;
  };
  const kwartalen = `<div class="mtabelvak"><table class="mtabel"><thead><tr><th></th>${k.fc?'<th>Forecast</th>':''}<th>Gefactureerd</th><th>Nog te fact.</th><th>Totaal</th>${k.fc?'<th>% fc</th>':''}${jaren.slice(0,1).map(j=>`<th>${j}</th>`).join('')}</tr></thead>
    <tbody>${[0,1,2,3].map(kw => kwRij('Q'+(kw+1), kw)).join('')}${kwRij('Jaar', null, 'tot')}</tbody></table></div>`;

  // jaren naast elkaar
  const jaarRijen = S.team !== 'Alle' ? [] : [...Object.keys(m.hist).map(Number).filter(j => j < Y && m.hist[j].invoiced).sort().slice(-3), Y].map(j => {
    const fcj = j === Y ? (m.forecast ? som(m.forecast) : null) : (m.hist[j].forecast && m.hist[j].forecast.some(v => v) ? som(m.hist[j].forecast) : null);
    return j === Y ? {naam:String(j), inv:agg.tot.inv, open:Math.max(0, agg.open), tot:agg.totaal, mk:fcj||0, fc:fcj}
                   : {naam:String(j), inv:som(m.hist[j].invoiced), open:0, tot:som(m.hist[j].invoiced), mk:fcj||0, fc:fcj};
  });

  const teams = groepeer(m.regels, 'team'), totT = teams.reduce((s,x) => s + x.tot, 0);
  const tabNaam = m.hist[Y] ? m.hist[Y].tab : (m.histTabs[0] || 'Old');
  $('#ovBlad').innerHTML = `
    <div class="ovkop"><div><h1>${S.team==='Alle' ? `Prognose ${Y}` : `${esc(S.team)} · ${Y}`}</h1><p>${zin}</p></div>
      <div class="rechtsin">${koers ? `<span class="st ${koers.c==='goed'?'klaar':koers.c==='let'?'open':'mis'}">${koers.t}</span>` : ''}<button class="k stil" data-excel>Excel exporteren</button><button class="k cta" data-stap-naar="rapport"><span>Rapport maken</span></button></div></div>
    ${filterbalk({vj:true})}
    ${S.wijz && S.team === 'Alle' ? wijzStrip() : ''}
    <div class="tegels">${t.join('')}</div>
    <div class="kaartraster">
      <div class="grafkaart breed">
        <div class="gkop"><div><h2>${S.weergave==='cum' ? 'Opgeteld door het jaar' : S.weergave==='tabel' ? 'Per maand, als tabel' : 'Per maand'}</h2>
          <div class="gsub">${S.weergave==='maand' ? 'Gefactureerd telt op factuurdatum, secured en accrual op projected month' + (k.fc ? '; onder elke maand het totaal als percentage van de forecast' : '') : S.weergave==='cum' ? 'Cumulatief vanaf januari' + (jaren.length ? ', met de vorige jaren ernaast' : '') : `Zoals in de tab ${esc(tabNaam)}: per maand en opgeteld`}</div></div>
          <div class="rechtsin"><span class="segment" role="group" aria-label="Weergave"><button data-w="maand" class="${S.weergave==='maand'?'aan':''}">Per maand</button><button data-w="cum" class="${S.weergave==='cum'?'aan':''}">Cumulatief</button><button data-w="tabel" class="${S.weergave==='tabel'?'aan':''}">Tabel</button></span></div></div>
        ${S.weergave==='tabel' ? maandTabel(m, agg, k.fc) : `<div class="legenda">${S.weergave==='maand' ? `
          ${k.fc ? `<span><i class="tick" style="background:${KLEUR.fc}"></i>Forecast</span>` : ''}
          <span><i style="background:${KLEUR.inv}"></i>Gefactureerd</span>
          <span><i style="background:${KLEUR.sec}"></i>Secured</span>
          ${agg.sec.some((v,i) => v && i < k.af) ? `<span><i class="arceer"></i>Secured, maand voorbij</span>` : ''}
          ${agg.acc.some(v => v) ? `<span><i style="background:${KLEUR.acc}"></i>Accrual</span>` : ''}
          ${vjKan && S.toonVj ? `<span><i class="ring"></i>Gefactureerd ${Y-1}</span>` : ''}` : `
          ${k.fc ? `<span><i class="streep"></i>Forecast</span>` : ''}
          <span><i class="lijn" style="background:${KLEUR.inv}"></i>Gefactureerd</span>
          <span><i class="lijn" style="background:${KLEUR.verwacht}"></i>Gefactureerd + nog te factureren</span>
          ${jaren.map((j,i) => `<span><i class="lijn" style="background:${i?KLEUR.vvj:'#92939C'}"></i>Gefactureerd ${j}</span>`).join('')}`}</div>
          <div class="grafvak" id="gHoofd"></div>`}
        ${S.weergave!=='tabel' && (agg.zonder.inv || agg.zonder.sec || agg.zonder.acc) ? `<div class="gnoot">${eurK(agg.zonder.inv + agg.zonder.sec + agg.zonder.acc)} heeft geen maand en staat niet in de grafiek. <button class="alink" data-anker-stap="data" data-anker="#checkPaneel">Bekijk in de controle</button></div>` : '<div style="height:8px"></div>'}
      </div>
      <div class="grafkaart">
        <div class="gkop"><div><h2>${k.fc ? 'Op weg naar de jaarforecast' : 'Per kwartaal'}</h2><div class="gsub">${k.fc ? `Gefactureerd, nog te factureren en wat er nog bij moet${k.fcAf ? `; de streep is de forecast t/m ${MND[k.af-1]}` : ''}` : 'Totaal = gefactureerd + nog te factureren'}</div></div></div>
        ${k.fc ? jaarbalkHtml(agg, k.fy, k.fcAf, k.af) : ''}
        <div style="height:12px"></div>${kwartalen}
      </div>
      <div class="grafkaart">
        <div class="gkop"><div><h2>Aandachtspunten</h2><div class="gsub">${S.team==='Alle' ? 'Wat opvalt, het belangrijkste eerst' : 'Voor ' + esc(S.team)}</div></div></div>
        <ul class="aandacht">${inzToon.map(i => `<li><span class="ai ${i.toon==='neutraal'?'':i.toon}">${ikA(i.ikoon)}</span><span class="at">${i.html}</span></li>`).join('') || '<li><span class="at" style="color:var(--flauw)">Nog niets bijzonders</span></li>'}</ul>
        ${inz.length > 6 ? `<div class="meerrij"><button class="mini" id="inzMeer">${S.inzMeer ? 'Toon minder' : `Toon nog ${inz.length-6}`}</button></div>` : ''}
      </div>
      <div class="grafkaart">
        <div class="gkop"><div><h2>Per team</h2><div class="gsub">Verwacht (I+F); klik op een team om alles daarop te filteren</div></div></div>
        <div class="legenda"><span><i style="background:${KLEUR.inv}"></i>Gefactureerd</span><span><i style="background:${KLEUR.sec}"></i>Nog te factureren</span></div>
        ${staven(teams, {klik:'team', gekozen:S.team, totaal:totT, sub: g => meervoud(g.n,'regel','regels')})}
      </div>
      ${jaarRijen.length > 1 ? `<div class="grafkaart">
        <div class="gkop"><div><h2>Jaren naast elkaar</h2><div class="gsub">Gefactureerd; voor ${Y} ook wat nog gefactureerd wordt. De streep is de forecast van dat jaar, rechts het percentage daarvan</div></div></div>
        <div class="legenda"><span><i style="background:${KLEUR.inv}"></i>Gefactureerd</span><span><i style="background:${KLEUR.sec}"></i>Nog te factureren</span><span><i class="tick" style="background:${KLEUR.fc}"></i>Forecast</span></div>
        ${staven(jaarRijen, {totaal:0, rechts: g => g.fc ? pct(g.tot/g.fc) : '', tipExtra: g => g.fc ? tipRij('#FFFFFF','Forecast',eur(g.fc),'lijn') + tipRij(null,'Van forecast',pct(g.tot/g.fc)) : ''})}
      </div>` : ''}
    </div>`;

  const g = $('#gHoofd');
  if (!g) return;
  if (S.weergave === 'maand'){
    maandGrafiek(g, {inv:agg.inv, sec:agg.sec, acc:agg.acc, fc:k.fc, vj: k.vj && k.vj.invoiced, toonVj:S.toonVj, af:k.af, nu:k.nu, jaar:Y, hoogte:320});
  } else {
    const cum = a => { let s = 0; return a.map(v => s += (v||0)); };
    const series = [];
    if (k.fc) series.push({naam:'Forecast', kort:'Forecast', w:cum(k.fc), kleur:KLEUR.fc, streep:true});
    series.push({naam:'Gefactureerd + nog te factureren', kort:'Verwacht', w:cum(agg.maandTot), kleur:KLEUR.verwacht});
    series.push({naam:'Gefactureerd', kort:'Gefactureerd', w:cum(agg.inv).map((v,i) => i < Math.max(k.af, k.nu) ? v : null), kleur:KLEUR.inv, dik:2.5});
    jaren.forEach((j,i) => series.push({naam:`Gefactureerd ${j}`, kort:String(j), w:cum(m.hist[j].invoiced), kleur:i?KLEUR.vvj:'#92939C', dik:1.5}));
    lijnGrafiek(g, {series, af:k.af, nu:k.nu, jaar:Y, hoogte:320});
  }
}
function wijzStrip(){
  const w = S.wijz, delen = [`Verwacht ${dchip(w.delta.totaal)}`];
  if (w.gefactureerd.length) delen.push(`<b>${w.gefactureerd.length}</b> gefactureerd`);
  if (w.nieuw.length) delen.push(`<b>${w.nieuw.length}</b> nieuw`);
  if (w.maand.length) delen.push(`<b>${w.maand.length}</b> verschoven`);
  if (w.bedrag.length) delen.push(`<b>${w.bedrag.length}</b> ander bedrag`);
  if (w.weg.length) delen.push(`<b>${w.weg.length}</b> verwijderd`);
  return `<div class="wijzstrip"><span class="wk">Sinds ${datumKort(S.vorige.tijd)}</span>${w.aantal ? delen.join('<span style="color:var(--navy4)">·</span>') : 'Geen verschillen met de vorige versie'}<button class="alink" data-stap-naar="wijzigingen">Bekijk wat er is veranderd</button></div>`;
}
/* Tabel zoals in de tab Old */
function maandTabel(m, agg, fc){
  const Y = m.jaar, af = afgesloten(), nu = lopendeMaand();
  const vj = S.team==='Alle' && m.hist[Y-1] && m.hist[Y-1].invoiced ? m.hist[Y-1].invoiced : null;
  const open = agg.sec.map((v,i) => v + agg.acc[i]);
  const cum = a => { let s = 0; return a.map(v => s += (v||0)); };
  const cl = i => i===nu-1 ? 'nu' : (i>=af && i!==nu-1) ? 'toek' : '';
  const sg = v => (v>=0?'+':'−') + eurK(Math.abs(v));
  const rij = (naam, w, opt={}) => {
    if (!w) return '';
    const jaar = opt.jaar !== undefined ? opt.jaar : som(w), f = opt.f || eurK;
    return `<tr class="${opt.cls||''}"><td>${naam}</td>${w.map((v,i) => `<td class="${cl(i)} ${opt.kleur && v ? (v<0?'neg':'pos') : ''}">${v==null?'':f(v)}</td>`).join('')}<td><b>${jaar==null?'':f(jaar)}</b></td></tr>`;
  };
  const verschil = fc ? agg.maandTot.map((v,i) => v - fc[i]) : null;
  const ratio = fc ? agg.maandTot.map((v,i) => fc[i] ? v/fc[i] : null) : null;
  const cf = fc ? cum(fc) : null, ct = cum(agg.maandTot);
  return `<div class="mtabelvak" style="padding-top:6px"><table class="mtabel">
    <thead><tr><th></th>${MND.map((n,i) => `<th class="${i===nu-1?'nu':''}">${Hoofd(n)}</th>`).join('')}<th>Jaar</th></tr></thead>
    <tbody>
      ${rij('Forecast', fc)}${rij('Gefactureerd', agg.inv)}${rij('Nog te factureren', open)}${rij('Totaal (I+F)', agg.maandTot, {cls:'dik'})}
      ${rij('Verschil met forecast', verschil, {kleur:true, f:sg})}${rij('% van forecast', ratio, {f: v => pct(v), jaar: fc ? agg.totaal/som(fc) : null})}
      ${vj ? rij(`Gefactureerd ${Y-1}`, vj) : ''}
      <tr class="gk"><td colspan="14">Cumulatief</td></tr>
      ${rij('Forecast', cf, {jaar: cf ? cf[11] : null})}${rij('Totaal (I+F)', ct, {cls:'dik', jaar: ct[11]})}
      ${fc ? rij('Verschil', ct.map((v,i) => v - cf[i]), {kleur:true, jaar: ct[11]-cf[11], f:sg}) : ''}
      ${vj ? rij(`Gefactureerd ${Y-1}`, cum(vj), {jaar: som(vj)}) : ''}
    </tbody></table></div>`;
}

/* =====================================================================
   PIJPLIJN
   ===================================================================== */
function openLijsten(regels){
  const af = afgesloten(), nu = lopendeMaand();
  const open = regels.filter(o => o.telt && (o.cat==='sec' || o.cat==='acc'));
  return {open,
    maand: nu ? open.filter(o => o.mnd === nu) : [],
    over: open.filter(o => o.cat==='sec' && o.mnd && o.mnd <= af),
    volgend: nu && nu < 12 ? open.filter(o => o.mnd === nu+1) : [],
    later: open.filter(o => o.mnd && o.mnd > (nu ? nu+1 : af)),
    alle: open};
}
function pPijplijn(){
  const m = S.m, regels = gefilterd(), agg = optellen(regels), k = kerncijfers(m, regels, agg);
  const fc = k.fc, af = k.af, nu = k.nu;
  const L = openLijsten(regels);
  if (!L[S.open] || (!L[S.open].length && S.open !== 'alle')) S.open = ['maand','over','volgend'].find(x => L[x].length) || 'alle';
  const z = S.openZoek.trim().toLowerCase();
  let lijst = L[S.open].slice();
  if (z) lijst = lijst.filter(o => [o.client, o.object, o.team, o.purpose, o.id, String(o.rij)].join(' ').toLowerCase().includes(z));
  lijst.sort((a,b) => ((a.mnd||13) - (b.mnd||13)) || (b.bedrag - a.bedrag));
  const toon = S.openAlle ? lijst : lijst.slice(0, 60);
  const somL = l => l.reduce((s,o) => s + o.bedrag, 0);
  const knop = (x, t) => L[x].length || x==='alle' ? `<button data-o="${x}" class="${S.open===x?'aan':''}">${t} · ${L[x].length}</button>` : '';

  const t = [];
  if (nu) t.push(tegel(`${Hoofd(MNDL[nu-1])} · deze maand`, eurK(somL(L.maand)), `<span>${meervoud(L.maand.length,'regel','regels')} open</span>${k.deze && k.deze.fc ? chip(`${pct((k.deze.gef+k.deze.sec)/k.deze.fc)} van fc`, k.deze.gef+k.deze.sec >= k.deze.fc ? 'goed' : 'let') : ''}`, 'nu klik', ` data-o="maand"`));
  t.push(tegel('Maand voorbij', eurK(somL(L.over)), L.over.length ? `${chip(meervoud(L.over.length,'regel','regels'), 'let')}<span>nog op Running</span>` : '<span>niets achterstallig</span>', L.over.length ? 'klik' : '', L.over.length ? ` data-o="over"` : ''));
  if (nu && nu < 12) t.push(tegel(`${Hoofd(MNDL[nu])} · volgende maand`, eurK(somL(L.volgend)), `<span>${meervoud(L.volgend.length,'regel','regels')}${fc ? ` · forecast ${eurK(fc[nu])}` : ''}</span>`, L.volgend.length ? 'klik' : '', L.volgend.length ? ` data-o="volgend"` : ''));
  t.push(tegel('Later dit jaar', eurK(somL(L.later)), `<span>${meervoud(L.later.length,'regel','regels')}</span>`));

const STATUSFILTERS = [['alle','Alle'],['inv','Gefactureerd'],['sec','Secured'],['acc','Accrual'],['niet','Telt niet mee'],['opm','Met opmerking']];
const STIL = new Set(['dynamics_leeg','client_typo','inv_geen_nr','sec_bij_inv']);
function regelsGefilterd(regels){
  const z = S.r.zoek.trim().toLowerCase();
  let l = regels.filter(o => S.r.status==='alle' || (S.r.status==='niet' ? !o.telt : S.r.status==='opm' ? o.issues.some(c => !STIL.has(c)) : o.cat===S.r.status && o.telt));
  if (z) l = l.filter(o => [o.id, o.client, o.team, o.purpose, o.object, o.statusTekst, o.factuurnr, o.oppo, o.maandTekst, String(o.rij)].join(' ').toLowerCase().includes(z));
  const k = S.r.sort, d = S.r.dir;
  const w = o => k==='bedrag' ? o.bedrag : k==='mnd' ? (o.mnd||13) : k==='datum' ? (o.factuurdatum ? +o.factuurdatum : 0) : k==='rij' ? o.rij : String(o[k]||'').toLowerCase();
  l.sort((a,b) => { const x = w(a), y = w(b); return (x<y ? -1 : x>y ? 1 : 0) * d || a.rij - b.rij; });
  return l;
}

let POP = null;
function openPop(knop, html){
  const pop = $('#pop');
  if (POP && POP.knop === knop){ sluitPop(); return null; }
  sluitPop();
  pop.innerHTML = html; pop.classList.remove('verborgen'); knop.classList.add('open'); knop.setAttribute('aria-expanded','true');
  POP = {knop}; plaatsPop();
  const aan = pop.querySelector('.popkeuze.aan') || pop.querySelector('.popkeuze'); if (aan) aan.focus({preventScroll:true});
  return pop;
}
function plaatsPop(){
  if (!POP) return;
  if (!document.body.contains(POP.knop)){ sluitPop(); return; }
  const pop = $('#pop'), r = POP.knop.getBoundingClientRect(), b = pop.offsetWidth;
  pop.style.left = Math.max(10, Math.min(r.left, innerWidth - b - 10)) + 'px';
  pop.style.top = (r.bottom + 6) + 'px';
}
function sluitPop(){
  const pop = $('#pop'); if (!pop) return;
  pop.classList.add('verborgen'); pop.innerHTML = '';
  if (POP){ POP.knop.classList.remove('open'); POP.knop.setAttribute('aria-expanded','false'); }
  POP = null;

const SLEUTEL = 'prognoseDashboard.laatste.v1', VERSIES = 'prognoseDashboard.versies.v1';
function leesOpslag(k){ try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function schrijfOpslag(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
function foutTekst(e){
  if (e.message === 'GEEN_XLSX') return 'Dit bestand kan ik niet lezen. Gebruik een .xlsx- of .xlsm-bestand; een oud .xls-bestand eerst in Excel opslaan als .xlsx.';
  if (e.message === 'GEEN_DATA') return `Geen tab met regels gevonden (tabs: ${(e.tabs||[]).join(', ')}). Een regeltab heeft een koprij met onder meer Client, Team, Instruction status, Secured Fee en Invoiced amount.`;
  console.error(e); return 'Er ging iets mis bij het lezen: ' + (e.message || e);
}
/* Korte reden voor de foutzoeker, zonder tabnamen of inhoud */
const foutCode = e => e && e.message === 'GEEN_XLSX' ? 'geen geldig xlsx-bestand (de zip kon niet worden geopend)' : e && e.message === 'GEEN_DATA' ? 'geen tab met een herkenbare koprij (status en een bedrag)' : `fout in de tool: ${kortPad(e && e.message || e)}`;
function toonFout(tekst){
  openVenster(`<div class="vkop"><h2>Het bestand kon niet worden gelezen</h2><p id="startFout">${esc(tekst)}</p></div>
    <div class="vvoet"><span class="hint" style="margin:0">Klopt dit niet? De foutzoeker laat zien wat de tool vond.</span><div class="rest"><button class="k stil" data-foutzoeker>Foutzoeker</button><button class="k vol" data-sluit autofocus>Sluiten</button></div></div>`, 'smal');
}
/* bron: 'bestand' | 'hervat' | 'voorbeeld' | 'tab' */
function start(wb, voorkeurTab, bron='bestand'){
  const m = bouwModel(wb, voorkeurTab);
  Object.assign(S, {wb, m, ctrl: controles(m), peil: m.peil, lopend: m.lopend, team:'Alle', bron: bron === 'tab' ? S.bron : bron,
    r:{zoek:'', status:'alle', sort:'rij', dir:1, limiet:200}, klantenAlle:false, openAlle:false, open:'maand', openZoek:'', inzMeer:false, alleChecks:false});
  const snap = momentopname(m);
  if (bron === 'voorbeeld') S.vorige = voorbeeldVorige(m);
  else if (bron !== 'tab'){
    const v = leesOpslag(VERSIES) || {};
    if (bron === 'bestand' && (!v.laatste || v.laatste.h !== snap.h)){
      v.vorige = v.laatste && v.laatste.jaar === m.jaar ? v.laatste : null;
      v.laatste = snap; schrijfOpslag(VERSIES, v);
    }
    const pas = x => x && x.h !== snap.h && x.jaar === m.jaar;
    S.vorige = pas(v.laatste) ? v.laatste : pas(v.vorige) ? v.vorige : null;
  }
  S.wijz = S.vorige ? vergelijk(S.vorige, snap) : null;
  if (bron === 'voorbeeld'){ S.stand = 'Voorbeelddata geladen'; S.standKlasse = 'goed'; }
  else if (bron === 'hervat'){ S.stand = `Bestand van ${datumTijd(wb.tijd)}`; S.standKlasse = ''; }
  else if (bron === 'bestand') bewaar(wb, m);          // zet zelf de stand: onthouden of niet
}
function bewaar(wb, m){
  const nodig = new Set([...m.kandidaten.map(k => k.naam), ...m.histTabs]);
  const klein = {bestand: wb.bestand, tijd: wb.tijd, bestandTijd: wb.bestandTijd, tab: m.tab, tabs: wb.tabs.map(t => nodig.has(t.naam) ? t : {naam:t.naam, verborgen:t.verborgen, rijen:[]})};
  if (schrijfOpslag(SLEUTEL, klein)){ S.stand = 'Ingelezen en onthouden'; S.standKlasse = 'goed'; }
  else { S.stand = 'Ingelezen (niet onthouden: opslag vol)'; S.standKlasse = 'mis'; }
}
function bezig(aan, titel='', tekst=''){
  let b = $('#bezigVenster');
  if (!aan){ b && b.remove(); return; }
  if (!b){ b = document.createElement('div'); b.id = 'bezigVenster'; b.className = 'bezig'; b.setAttribute('role','status'); document.body.appendChild(b); }
  b.innerHTML = `<div class="bzdoos"><span class="bzdraai"></span><span><span class="bztitel">${esc(titel)}</span><span class="bztekst">${esc(tekst)}</span></span></div>`;
}
const volgendBeeld = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 20)));
async function laadBestand(f){
  if (!f) return;
  const ext = (f.name.match(/\.[a-z0-9]{2,5}$/i) || ['(geen extensie)'])[0].toLowerCase();
  if (!/\.(xlsx|xlsm)$/i.test(f.name) && !/spreadsheetml/.test(f.type)){
    diagLog('let', `bestand geweigerd: ${ext}, geen .xlsx`);
    toonFout(`${f.name} is geen .xlsx-bestand. Sla het in Excel op als .xlsx en probeer het opnieuw.`); return;
  }
  const wasStap = S.m ? S.stap : null;
  DIAG.bestand = {ext, grootte: f.size}; DIAG.duur = {};
  diagLog('info', `bestand gekozen: ${ext}, ${Math.round(f.size / 1024)} kB`);
  sluitPop(); bezig(true, 'Bestand lezen', f.name); await volgendBeeld();
  let wb = null;
  try {
    const buf = await f.arrayBuffer();
    bezig(true, 'Regels herkennen', 'Tabbladen, koprij en forecast zoeken'); await volgendBeeld();
    let t0 = performance.now();
    wb = leesXlsx(buf, f.name); wb.bestandTijd = f.lastModified || null;
    DIAG.duur.lezen = Math.round(performance.now() - t0); DIAG.wb = wb;
    diagLog('info', `gelezen in ${DIAG.duur.lezen} ms: ${meervoud(wb.tabs.length, 'tabblad', 'tabbladen')}`);
    t0 = performance.now();
    start(wb, null, 'bestand');
    DIAG.duur.model = Math.round(performance.now() - t0); DIAG.mislukt = null; DIAG.extra = [];
    diagLog('info', `herkend in ${DIAG.duur.model} ms: ${meervoud(S.m.regels.length, 'regel', 'regels')} uit "${S.m.tab}"${S.m.forecast ? `, forecast uit "${S.m.hist[S.m.jaar].tab}"` : ', geen forecast'}`);
    S.stap = wasStap && wasStap !== 'data' ? wasStap : 'data';
    render(); scrollTo({top:0});
    if (wasStap && wasStap !== 'data') meld(`${f.name} ingelezen: ${meervoud(S.m.regels.length,'regel','regels')}`);
  } catch(e){
    DIAG.wb = wb; DIAG.mislukt = foutCode(e);
    if (e && (e.message === 'GEEN_XLSX' || e.message === 'GEEN_DATA')) diagLog('fout', `inlezen mislukt: ${DIAG.mislukt}`);
    else diagFout(e, 'bestand inlezen');
    toonFout(foutTekst(e));
    if (S.stap === 'data') render();
  }
  finally { bezig(false); }
}
function laadVoorbeeld(){
  try {
    start({...JSON.parse(JSON.stringify(VOORBEELD)), tijd: Date.now()}, null, 'voorbeeld');
    Object.assign(DIAG, {wb:S.wb, bestand:null, mislukt:null, extra:[], duur:{}});
    diagLog('info', `voorbeelddata geladen: ${meervoud(S.m.regels.length, 'regel', 'regels')}`);
    S.stap = 'data'; render(); scrollTo({top:0});
  } catch(err){ diagFout(err, 'voorbeelddata laden'); toonFout(foutTekst(err)); }
}

function bediening(){
  const invoer = $('#bestandInvoer');
  invoer.addEventListener('change', () => { laadBestand(invoer.files[0]); invoer.value = ''; });
  $('#knopOver').addEventListener('click', toonOver);
  $('#knopOpnieuw').addEventListener('click', () => S.m ? bevestigOpnieuw() : meld('Er is nog niets om te wissen'));
  $('#knopMerk').addEventListener('click', () => naarStap('data'));
  $('#knopNaarOverzicht').addEventListener('click', () => naarStap('overzicht'));
  koppelRapport();

  document.addEventListener('click', e => {
    if (e.target.closest('#stKeuzes,#pop .popnoot')) return;           // de rapportstudio heeft zijn eigen bediening
    const t = e.target.closest('button,a[data-ga],[data-stap-naar],[data-team],[data-o],[data-sort],[data-diag],.vakdrop,tr.klik');
    if (!t || t.disabled) return;
    const d = t.dataset;
    if (d.diag){ if (d.diag !== 'bedragen') diagKlik(d.diag); return; }
    if (d.foutzoeker != null){ naarFoutzoeker(); return; }
    if (t.closest('#stappen') && d.stap){ naarStap(d.stap); return; }
    if (d.stapNaar){ if (d.o){ S.open = d.o; S.openAlle = false; } naarStap(d.stapNaar); return; }
    if (d.ankerStap){ naarStap(d.ankerStap, {anker: d.anker}); return; }
    if (d.anker){ const el = $(d.anker); el && el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    if (d.ga){ const doel = {controle:'data', klanten:'teams'}[d.ga] || d.ga; if (d.o){ S.open = d.o; S.openAlle = false; } naarStap(doel, d.ga==='controle' ? {anker:'#checkPaneel'} : {}); return; }
    if (d.kies != null || t.id === 'vakdrop'){ invoer.click(); return; }
    if (t.id === 'knopVoorbeeld'){ laadVoorbeeld(); return; }
    if (t.id === 'knopWis'){ bevestigOpnieuw(); return; }
    if (t.id === 'knopWisBevestig'){ wisAlles(); return; }
    if (d.pop){ ({team:popTeam, maand:popMaand, tab:popTab})[d.pop](t); return; }
    if (d.team){ const kies = d.team; sluitPop(); S.team = (S.team === kies && t.closest('.staven,.mtabel')) ? 'Alle' : kies; render(); return; }
    if (d.peil){ sluitPop(); if (d.peil === 'af'){ S.peil = 12; S.lopend = false; } else { S.peil = +d.peil; S.lopend = true; } render(); return; }
    if (d.tabkeuze){ sluitPop(); try { const st = S.stap; start(S.wb, d.tabkeuze, 'tab'); S.stap = st; diagLog('info', `andere tab gekozen: "${d.tabkeuze}", ${meervoud(S.m.regels.length, 'regel', 'regels')}`); render(); meld(`Regels uit ${d.tabkeuze}`); } catch(err){ diagFout(err, `tab "${d.tabkeuze}" kiezen`); meld('Die tab kon niet worden gelezen'); } return; }
    if (d.w){ S.weergave = d.w; render(); return; }
    if (d.o){ S.open = d.o; S.openAlle = false; if (S.stap !== 'pijplijn') naarStap('pijplijn'); else render(); return; }
    if (d.s){ S.r.status = d.s; S.r.limiet = 200; render(); return; }
    if (d.sort){ const k = d.sort; S.r.dir = S.r.sort === k ? -S.r.dir : (k==='bedrag' ? -1 : 1); S.r.sort = k; render(); return; }
    if (d.vbtab){ S.vbTab = d.vbtab; render(); return; }
    if (d.toon){ toonDetail(d.toon); return; }
    if (d.toonlijst != null){ toonDetail(d.toonlijst); return; }
    if (d.excel != null){ exporteerExcel(); return; }
    if (d.profiel){ kiesProfiel(d.profiel); render(); return; }
    if (d.sjabloonwissel != null){ const i = SJABLONEN.findIndex(x => x.w === R.sjabloon); R.sjabloon = SJABLONEN[(i+1) % SJABLONEN.length].w; bewaarR(); render(); return; }
    if (d.rapport){ naarRapport(d.rapport === 'pdf'); return; }
    if (t.id === 'btVj'){ S.toonVj = !S.toonVj; render(); return; }
    if (t.id === 'checkAlles'){ S.alleChecks = !S.alleChecks; render(); return; }
    if (t.id === 'inzMeer'){ S.inzMeer = !S.inzMeer; render(); return; }
    if (t.id === 'kAlle'){ S.klantenAlle = !S.klantenAlle; render(); return; }
    if (t.id === 'openAlle'){ S.openAlle = !S.openAlle; render(); return; }
    if (t.id === 'meerRegels'){ S.r.limiet = 1e9; render(); return; }
  });
  document.addEventListener('mousedown', e => { if (POP && !$('#pop').contains(e.target) && !POP.knop.contains(e.target)) sluitPop(); });
  document.addEventListener('change', e => {
    if (e.target.matches('[data-diag="bedragen"]')){ DIAG.bedragen = e.target.checked; diagLog('info', `bedragen in het verslag: ${DIAG.bedragen ? 'aan' : 'uit'}`); tekenFoutzoeker(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'fzInvoer'){ e.preventDefault(); diagOpdracht(e.target.value); return; }
    if (e.key === 'Escape'){ if (POP){ const k = POP.knop; sluitPop(); k.focus(); } else if ($('#vensters').lastElementChild) sluitVenster(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('#vakdrop,.tegel.klik,.staaf.klik,.fzkop')){ e.preventDefault(); e.target.click(); return; }
    if (POP && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
      const k = $$('#pop .popkeuze'); if (!k.length) return;
      e.preventDefault(); const i = k.indexOf(document.activeElement);
      k[(i + (e.key === 'ArrowDown' ? 1 : -1) + k.length) % k.length].focus();
    }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'zoekRegels'){ S.r.zoek = e.target.value; S.r.limiet = 200; clearTimeout(bediening.z); bediening.z = setTimeout(render, 140); }
    if (e.target.id === 'openZoek'){ S.openZoek = e.target.value; clearTimeout(bediening.z); bediening.z = setTimeout(render, 140); }
  });
  // hover-labels voor HTML-elementen
  document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) tip.toon(t.dataset.tip, e); });
  document.addEventListener('mousemove', e => { if (e.target.closest('[data-tip]')) tip.zet(e); });
  document.addEventListener('mouseout', e => { const t = e.target.closest('[data-tip]'); if (t && !t.contains(e.relatedTarget)) tip.weg(); });
  // slepen en loslaten, overal op de pagina
  let diepte = 0;
  const heeftBestand = e => e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files');
  const sleepUit = () => { diepte = 0; $('#sleepvlak').classList.remove('aan'); const v = $('#vakdrop'); v && v.classList.remove('doel'); };
  addEventListener('dragenter', e => { if (!heeftBestand(e)) return; e.preventDefault(); diepte++; $('#sleepvlak').classList.add('aan'); const v = $('#vakdrop'); v && v.classList.add('doel'); });
  addEventListener('dragover', e => { if (heeftBestand(e)){ e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
  addEventListener('dragleave', e => { if (!heeftBestand(e)) return; if (--diepte <= 0) sleepUit(); });
  addEventListener('drop', e => { if (!heeftBestand(e)) return; e.preventDefault(); sleepUit(); laadBestand(e.dataTransfer.files[0]); });
  addEventListener('paste', e => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    const f = e.clipboardData && e.clipboardData.files && e.clipboardData.files[0];
    if (f){ e.preventDefault(); laadBestand(f); }
    else if (!S.m) meld('Kopieer het bestand zelf (in Verkenner of Finder, niet de cellen in Excel) en plak opnieuw');
  });
  let rt, bw = innerWidth;
  addEventListener('resize', () => { plaatsPop(); clearTimeout(rt); rt = setTimeout(() => {
    if (S.m && ['overzicht','teams'].includes(S.stap) && innerWidth !== bw) render();
    bw = innerWidth; }, 150); });
  addEventListener('scroll', () => { if (POP) plaatsPop(); }, {passive:true});

  // vorige keer: meteen terug naar het overzicht
  const b = leesOpslag(SLEUTEL);
  if (b){
    try { start(b, b.tab, 'hervat'); S.stap = 'overzicht'; DIAG.wb = b; diagLog('info', `onthouden bestand hersteld (ingelezen ${datumTijd(b.tijd)}): ${meervoud(S.m.regels.length, 'regel', 'regels')}`); }
    catch(e){ diagFout(e, 'onthouden bestand herstellen'); /* oud of kapot: gewoon leeg beginnen */ }
  } else diagLog('info', 'tool geopend zonder onthouden bestand');
  render();
}
bediening();

</script>
</body>
</html>
